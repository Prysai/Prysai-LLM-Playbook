    "policy": "Prefer the transferable core unless the requested outcome depends on a named platform delta or a bounded application context.",
    "layers": [
      {
        "id": "transferable_core",
        "selection_rule": "The capability and acceptance evidence remain meaningful across LLM products without product-specific commands or UI claims."
      },
      {
        "id": "platform_adapter",
        "selection_rule": "The task depends on a named product's commands, tools, permissions, runtime, interface, or volatile behavior; record that delta and first-party sources."
      },
      {
        "id": "application_playbook",
        "selection_rule": "The task applies a core capability and any required adapter to a bounded domain outcome, evidence packet, and failure case."
      }
    ],
    "platform_adapters": [
      {"id": "codex", "status": "candidate"},
      {"id": "claude-code", "status": "proposed"},
      {"id": "grok", "status": "proposed"}
    ],
    "equivalence_rule": "Never infer command, tool, permission, runtime, interface, or behavior equivalence between platforms. An equivalence claim requires an explicitly scoped compatibility record and current authoritative evidence for every named platform."
  },
