{
  "schema_version": "1",
  "last_reviewed": "2026-08-12",
  "description": "The canonical directory map for reader-facing material, practice, research, governance, assets, tooling, and release work.",
  "excluded_workdirs": [".git", ".work", ".codex-temp", "tmp", "_site", "output", ".pytest_cache", "node_modules"],
  "top_level": [
    {
      "path": ".github",
      "role": "Repository automation and quality gates.",
      "entry": ".github/workflows/quality.yml",
      "first_read": ".github/workflows/quality.yml",
      "canonical_sources": [".github/workflows/quality.yml", ".github/workflows/pages.yml"],
      "generated_outputs": []
    },
    {
      "path": "assets",
      "role": "Project-owned teaching diagrams, README visuals, and case evidence.",
      "entry": "assets/README.md",
      "first_read": "assets/README.md",
      "canonical_sources": ["docs/sources/asset-register.md"],
      "generated_outputs": []
    },
    {
      "path": "book",
      "role": "The reader-facing book, chapters, table of contents, and labs.",
      "entry": "book/README.md",
      "first_read": "book/README-EN.md",
      "canonical_sources": ["docs/governance/book-navigation.yaml", "docs/governance/lab-navigation.yaml", "docs/book-architecture.md"],
      "generated_outputs": []
    },
    {
      "path": "docs",
      "role": "The project control plane: research, governance, quality, sources, and decisions.",
      "entry": "docs/README.md",
      "first_read": "docs/project-map-EN.md",
      "canonical_sources": ["docs/governance/project-structure.yaml", "docs/governance/quality-register.yaml", "docs/governance/release-evidence.yaml", "docs/governance/external-url-audit.yaml"],
      "generated_outputs": []
    },
    {
      "path": "evals",
      "role": "Fixed evaluation tasks and explicitly recorded run results.",
      "entry": "evals/README.md",
      "first_read": "evals/README.md",
      "canonical_sources": ["evals/task-set-v1.yaml", "docs/quality/evaluation-framework.md"],
      "generated_outputs": []
    },
    {
      "path": "examples",
      "role": "Disposable, low-risk sandboxes and reproducible case inputs.",
      "entry": "examples/README.md",
      "first_read": "examples/skill-sandbox/product-context-real-estate/README.md",
      "canonical_sources": ["docs/sources/asset-register.md"],
      "generated_outputs": []
    },
    {
      "path": "scripts",
      "role": "Repeatable validators, generators, and project checks.",
      "entry": "scripts/README.md",
      "first_read": "scripts/README.md",
      "canonical_sources": ["AGENTS.md", "docs/release-checklist.md"],
      "generated_outputs": []
    },
    {
      "path": "site",
      "role": "The public static showcase and generated learning-path presentation data.",
      "entry": "site/README.md",
      "first_read": "site/README.md",
      "canonical_sources": ["docs/governance/learning-path.yaml", "docs/governance/content-status.yaml", "docs/governance/locale-matrix.yaml", "site/content-catalog.json", "book/chapters", "book/labs"],
      "generated_outputs": ["site/learning-path-data.js", "site/locale-manifest.js", "site/search-index.js"]
    },
    {
      "path": "skills",
      "role": "Project-owned reusable Skill contracts and their agent metadata.",
      "entry": "skills/README.md",
      "first_read": "docs/skill-registry.md",
      "canonical_sources": ["docs/skill-registry.md", "docs/quality/skill-quality-standard.md"],
      "generated_outputs": []
    },
    {
      "path": "tasks",
      "role": "The current bounded plan, checklist, and handoff state.",
      "entry": "tasks/README.md",
      "first_read": "tasks/todo.md",
      "canonical_sources": ["tasks/plan.md", "tasks/todo.md"],
      "generated_outputs": []
    }
  ],
  "subdirectories": [
    {"path": "assets/branding", "role": "Project-owned brand marks used by the reading surface.", "entry": "assets/branding/README.md"},
    {"path": "assets/cases", "role": "Rendered screenshots and other bounded case evidence.", "entry": "assets/cases/README.md"},
    {"path": "assets/teaching", "role": "Original SVG teaching cards used in the book and showcase.", "entry": "assets/teaching/README.md"},
    {"path": "book/chapters", "role": "One file per chapter identity, with explicit locale suffixes where authored.", "entry": "book/chapters/README.md"},
    {"path": "book/labs", "role": "Low-risk experiments with observable output, failure variants, and transfer tasks.", "entry": "book/labs/README.md"},
    {"path": "docs/adr", "role": "Architecture decisions and their trade-offs.", "entry": "docs/adr/README.md"},
    {"path": "docs/governance", "role": "Machine-readable contracts for order, status, locale, updates, and ownership.", "entry": "docs/governance/README.md"},
    {"path": "docs/quality", "role": "Acceptance standards and review records.", "entry": "docs/quality/README.md"},
    {"path": "docs/research", "role": "Official fact records, structure studies, and dated field-problem reports.", "entry": "docs/research/README.md"},
    {"path": "docs/sources", "role": "External-source, archive, asset, license, and attribution boundaries.", "entry": "docs/sources/README.md"},
    {"path": "docs/strategy", "role": "Dated product, audience, curriculum, and migration proposals that require explicit adoption.", "entry": "docs/strategy/README.md"},
    {"path": "docs/templates", "role": "Reusable records for field cases and non-trivial updates.", "entry": "docs/templates/README.md"},
    {"path": "examples/skill-sandbox", "role": "One-time local sandboxes used to make Skill outputs inspectable.", "entry": "examples/skill-sandbox/README.md"},
    {"path": "examples/lab-001-v1", "role": "Disposable offline README fixture used as the novice bridge into Lab 001.", "entry": "examples/lab-001-v1/README.md"},
    {"path": "examples/lab-008-v1", "role": "Frozen deterministic source-conflict fixture for the Lab 008 maintainer reference run.", "entry": "examples/lab-008-v1/README.md"},
    {"path": "examples/lab-013-v1", "role": "Frozen deterministic fixture and review contract for the Lab 013 maintainer reference run.", "entry": "examples/lab-013-v1/README.md"},
    {"path": "examples/universal-seam-v1", "role": "Fictional offline request, target, receipt, and structured-state seam fixture before a platform adapter is needed.", "entry": "examples/universal-seam-v1/README.md"},
    {"path": "evals/candidates/context-packet-builder-v1", "role": "Original fictional admission fixture for an unadmitted context-packet responsibility; it does not create a Skill or runtime evidence.", "entry": "evals/candidates/context-packet-builder-v1/README.md"},
    {"path": "evals/candidates/shift-handoff-v1", "role": "Fictional candidate model-output study with frozen randomized prompt packets, manifest-bound records, and no checked-in result.", "entry": "evals/candidates/shift-handoff-v1/README.md"},
    {"path": "evals/contributions", "role": "Publicly reviewable fictional test-material receipts; never a raw learner or model-evidence store.", "entry": "evals/contributions/README.md"}
  ],
  "root_entries": [
    {"path": "LICENSE", "role": "Default distribution license and trademark exclusion.", "canonical_source": "LICENSE"},
    {"path": "CODE_OF_CONDUCT.md", "role": "Community participation, reporting, and maintainer-response boundary.", "canonical_source": "CODE_OF_CONDUCT.md"},
    {"path": "CHANGELOG.md", "role": "Curated candidate change record; not a release record or immutable tag.", "canonical_source": "docs/governance/release-readiness.yaml"},
    {"path": "README.md", "role": "GitHub's default English facade.", "canonical_source": "README-EN.md"},
    {"path": "README-EN.md", "role": "Detailed English project entry.", "canonical_source": "README-EN.md"},
    {"path": "AGENTS.md", "role": "Working rules for contributors and agents.", "canonical_source": "AGENTS.md"},
    {"path": "CONTRIBUTING.md", "role": "Public contributor front door and change-class router.", "canonical_source": "docs/governance/contribution-model.md"},
    {"path": "CONTEXT.md", "role": "Stable project vocabulary and boundaries.", "canonical_source": "CONTEXT.md"},
    {"path": "package.json", "role": "Private Node toolchain contract for browser verification.", "canonical_source": "package.json"},
    {"path": "package-lock.json", "role": "Pinned npm dependency graph generated from package.json; do not hand-edit.", "canonical_source": "package.json"}
  ],
  "generated_outputs": [
    {
      "path": "book/chapters/*.md",
      "source": ["docs/governance/book-navigation.yaml"],
      "owner": "scripts/build_book_navigation.py",
      "surface": "The marked chapter-navigation block inside each matching Markdown file.",
      "edit_rule": "Edit the source order; do not hand-edit the marked chapter-navigation block."
    },
    {
      "path": "book/title-map.json",
      "source": ["docs/governance/book-navigation.yaml"],
      "owner": "scripts/build_book_title_map.py",
      "surface": "The role-aware title projection consumed by both tables of contents, the Reader manifest, and the generated search index.",
      "edit_rule": "Edit book-navigation.yaml, then regenerate; do not hand-edit this map or the generated compact chapter headings."
    },
    {
      "path": "book/labs/lab-*-EN.md",
      "source": ["docs/governance/lab-navigation.yaml"],
      "owner": "scripts/build_lab_navigation.py",
      "surface": "The marked lab-navigation block inside each canonical English Lab source.",
      "edit_rule": "Edit the Lab catalog order; do not hand-edit the marked lab-navigation block."
    },
    {
      "path": "site/learning-path-data.js",
      "source": ["docs/governance/learning-path.yaml", "docs/governance/content-status.yaml", "site/content-catalog.json"],
      "owner": "scripts/build_learning_path_site.py",
      "surface": "The complete generated JavaScript data file.",
      "edit_rule": "Edit the contracts and catalog, then regenerate and run --check."
    },
    {
      "path": "site/locale-manifest.js",
      "source": ["docs/governance/locale-matrix.yaml", "docs/governance/content-status.yaml", "docs/governance/book-navigation.yaml", "book/title-map.json", "docs/governance/lab-navigation.yaml"],
      "owner": "scripts/build_site_locale_manifest.py",
      "surface": "The generated content_id, locale, translation-state, alias, and path index consumed by the public site.",
      "edit_rule": "Edit the locale matrix or current status source, then regenerate and run --check; do not hand-edit."
    },
    {
      "path": "site/search-index.js",
      "source": ["docs/governance/content-status.yaml", "docs/governance/locale-matrix.yaml", "docs/governance/book-navigation.yaml", "book/title-map.json", "book/chapters", "book/labs"],
      "owner": "scripts/build_site_search_index.py",
      "surface": "The generated dependency-free search index consumed by the public site.",
      "edit_rule": "Edit canonical content and contracts, then regenerate and run --check; do not hand-edit."
    },
    {
      "path": "docs/quality/quality-register.md",
      "source": ["docs/governance/quality-register.yaml", "docs/governance/content-status.yaml"],
      "owner": "scripts/build_quality_register.py",
      "surface": "The generated human-readable defect ledger and derived release decision.",
      "edit_rule": "Edit the machine quality register, then regenerate and run --check; do not hand-edit the Markdown ledger."
    }
  ]
}
