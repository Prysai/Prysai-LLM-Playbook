{
  "schema_version": "1",
  "policy_id": "repository-security-policy",
  "status": "candidate",
  "owner": "governance-maintainer",
  "reviewed_at": "2026-08-18",
  "next_review": "2026-09-18",
  "scope": {
    "included": [
      "tracked and unignored candidate repository files",
      "GitHub Actions workflow definitions",
      "pull-request review metadata",
      "contributor security disclosures"
    ],
    "excluded": [
      "GitHub account recovery",
      "organization-wide policy",
      "external hosting headers and access control",
      "third-party dependency vulnerability databases",
      "runtime penetration testing"
    ]
  },
  "automation": {
    "workflow_path": ".github/workflows/security-policy.yml",
    "events": ["pull_request", "push:main"],
    "token_permissions": {"contents": "read"},
    "forbidden_workflow_features": [
      "pull_request_target",
      "secrets context in untrusted pull_request workflows",
      "write-scoped token permissions on pull_request workflows except the controlled CodeQL exception below",
      "persisted checkout credentials on pull_request workflows",
      "unpinned third-party GitHub Actions"
    ],
    "controlled_pr_write_permissions": [
      {
        "workflow_path": ".github/workflows/codeql.yml",
        "permissions": {
          "actions": "read",
          "contents": "read",
          "packages": "read",
          "security-events": "write"
        },
        "reason": "CodeQL must upload its own pull-request analysis results without receiving any other write scope"
      }
    ],
    "checks": [
      "pull-request event, explicit least-privileged permission, and checkout credential boundary",
      "CodeQL pull-request upload permission is restricted to the exact controlled exception",
      "full-SHA Action pinning",
      "tracked credential-shaped files",
      "common token and private-key markers",
      "unsafe shell-pipe patterns in workflows",
      "high-confidence secret signatures and secret-like assignments",
      "credential-bearing headers, URLs, and URL queries",
      "machine-local paths and file URIs",
      "private IPv4/hostname locations",
      "MAC addresses and labeled device identifiers",
      "pinned binary-only Python validation dependency",
      "same-origin static-site Content-Security-Policy meta contract",
      "secret-bearing Docs deployment consumes only the validated Pages artifact",
      "policy fixture tests, including synthetic-path false-positive boundaries"
    ],
    "evidence_limit": "A passing check only establishes the declared static policy over the checked commit. It does not prove that no secret, vulnerability, unsafe dependency, account compromise, deployment risk, or host-side misconfiguration exists."
  },
  "review_requirements": {
    "all_pull_requests": [
      "bounded change description",
      "source and license disclosure",
      "safety and external-effect disclosure",
      "commands and evidence actually produced",
      "unverified scope"
    ],
    "heightened_review_paths": [
      ".github/workflows/**",
      "scripts/**",
      "package-lock.json",
      "package.json",
      "SECURITY.md",
      "docs/governance/repository-security-policy.yaml",
      "docs/security/**"
    ],
    "heightened_review_rule": "A maintainer must review the diff, requested permission change, supply-chain source, rollback path, and declared evidence before merge. Automation may flag a change but must not approve, merge, comment on, or modify a pull request on its own."
  },
  "host_ruleset": {
    "status": "active",
    "observed_at": "2026-08-18",
    "repository": "Prysai/Prysai-LLM-Playbook",
    "ruleset_id": 20903386,
    "name": "Prysai llm playbook",
    "target": "branch",
    "enforcement": "active",
    "ref_include": ["~ALL"],
    "configuration_state": "active",
    "rules": [
      "deletion",
      "non_fast_forward",
      "required_signatures",
      "CodeQL high_or_higher security alerts and errors_and_warnings alert threshold",
      "code quality errors",
      "one approving review, stale-review dismissal, and resolved review threads"
    ],
    "bypass_list": [
      "RepositoryRole actor id 5 with bypass_mode always"
    ],
    "evidence_limit": "The live GitHub API reports an active repository Ruleset. Its current bypass actor can always bypass the Ruleset, and this repository policy does not treat a passing workflow as proof that every write used a pull request."
  },
  "host_security_controls": {
    "observed_at": "2026-08-18",
    "secret_scanning": "enabled",
    "secret_scanning_non_provider_patterns": "disabled",
    "secret_scanning_push_protection": "enabled",
    "actions": {
      "enabled": true,
      "allowed_actions": "all",
      "sha_pinning_required": true
    },
    "evidence_limit": "These are repository-level GitHub settings observed through the authenticated API; GitHub did not enable non-provider pattern scanning in this request. Secret values, organization policy, hosted headers, and provider-side logs remain outside this repository record."
  },
