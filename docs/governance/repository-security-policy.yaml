  "automation": {
    "workflow_path": ".github/workflows/security-policy.yml",
    "events": ["pull_request", "push:main"],
    "token_permissions": {"contents": "read"},
    "forbidden_workflow_features": [
      "pull_request_target",
      "secrets context in untrusted pull_request workflows",
      "write-scoped token permissions on untrusted pull_request workflows; any write-scoped workflow_run exception must be explicitly listed below",
      "persisted checkout credentials on pull_request workflows",
      "unpinned third-party GitHub Actions"
    ],
    "controlled_pr_write_permissions": [
      {
        "workflow_path": ".github/workflows/codeql.yml",
        "permissions": {
          "actions": "read",
          "contents": "read",
          "packages": "read",
          "security-events": "write"
        },
        "reason": "CodeQL must upload its own pull-request analysis results without receiving any other write scope"
      },
      {
        "workflow_path": ".github/workflows/maintainer-pr-automerge.yml",
        "permissions": {
          "actions": "read",
          "contents": "write",
          "pull-requests": "write"
        },
        "reason": "A trusted workflow_run may submit a clearly labeled bot approval and enable native squash auto-merge only for the explicit uuzzrm or Prysai-Lab book-Markdown route"
      }
    ],
    "checks": [
      "pull-request event, explicit least-privileged permission, and checkout credential boundary",
      "CodeQL and maintainer auto-merge write permissions are restricted to their exact controlled exceptions",
      "full-SHA Action pinning",
      "tracked credential-shaped files",
      "common token and private-key markers",
      "unsafe shell-pipe patterns in workflows",
      "high-confidence secret signatures and secret-like assignments",
      "credential-bearing headers, URLs, and URL queries",
      "machine-local paths and file URIs",
      "private IPv4/hostname locations",
      "MAC addresses and labeled device identifiers",
      "pinned binary-only Python validation dependency",
      "same-origin static-site Content-Security-Policy meta contract",
      "secret-bearing Docs deployment consumes only the validated Pages artifact",
      "post-merge Pages, Docs, and Hugging Face publication jobs keep independent concurrency boundaries",
      "policy fixture tests, including synthetic-path false-positive boundaries",
      "read-only pull-request contract headings, exact-head check, and per-commit DCO sign-offs",
      "maintainer documentation auto-merge workflow boundary and permission exception"
    ],
    "evidence_limit": "A passing check only establishes the declared static policy over the checked commit. It does not prove that no secret, vulnerability, unsafe dependency, account compromise, deployment risk, or host-side misconfiguration exists."
  },
  "review_requirements": {
    "all_pull_requests": [
      "bounded change description",
      "source and license disclosure",
      "safety and external-effect disclosure",
      "pull-request contract headings and exact-head check",
      "valid DCO sign-off on every commit",
      "commands and evidence actually produced",
      "unverified scope"
    ],
    "migration_exceptions": [
      "Pull requests created before 2026-08-31T00:14:52Z by uuzzrm or Prysai-Lab may use the one-time contract migration path: the exact current head, non-empty commit history, and a valid GitHub cryptographic signature on every commit remain required, while historical PR headings and DCO trailers are not retroactively rewritten. The active Ruleset, required checks, resolved threads, and maintainer approval remain required."
    ],
    "heightened_review_paths": [
      ".github/workflows/**",
      "scripts/**",
      "package-lock.json",
      "package.json",
      "SECURITY.md",
      "DCO.md",
      "docs/governance/repository-security-policy.yaml",
      "docs/security/**"
    ],
    "heightened_review_rule": "A maintainer must review the diff, requested permission change, supply-chain source, rollback path, and declared evidence before merge. The constrained maintainer documentation route may submit a clearly labeled bot approval and enable native squash auto-merge only after its trusted workflow_run checks pass; this does not establish independent human review, dynamically authorize every administrator, or bypass the active Ruleset."
  },
  "host_ruleset": {
    "status": "active",
    "observed_at": "2026-08-30",
    "observation_phase": "post-final-mutation",
    "repository": "Prysai/Prysai-LLM-Playbook",
    "ruleset_id": 20903386,
    "name": "Prysai llm playbook",
    "target": "branch",
    "enforcement": "active",
    "ref_include": ["~ALL"],
    "configuration_state": "active",
    "rules": [
      "deletion",
      "non_fast_forward",
      "required_signatures",
      "CodeQL high_or_higher security alerts and errors_and_warnings alert threshold",
      "code quality errors",
      "one approving review, stale-review dismissal, and resolved review threads",
      "required status checks: candidate-evidence, repository-security, and pull-request-contract",
      "strict required status checks against the latest base code"
    ],
    "bypass_list": [],
    "required_status_checks": [
      "candidate-evidence",
      "repository-security",
      "pull-request-contract"
    ],
    "strict_required_status_checks": true,
    "evidence_limit": "Live GitHub API verification on 2026-08-30 observed an active Ruleset with the listed required status checks, strict latest-base evaluation, and an empty bypass-actor list after the final host-side mutation. This repository policy still does not treat a passing workflow as proof that every future write used a pull request; recheck the host before each release."
  },
