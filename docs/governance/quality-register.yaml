      "required_evidence": "Run the fixed v2 baseline, commit-bound optional-warm-up study worksheet, seeded recovery branch, immediate unseen transfer, 48–72 hour delayed transfer, and separate public-surface observation of recommended-path versus optional-warm-up selection with 5–8 experienced-beginner readers; preserve de-identified first answers, marked findings, before/after diffs, timing, drop-off, help, scorer disagreement, and independent review. Treat the first round as instrument debugging only and do not generalize it to first-time chat-model users.",
