      "resolution_scope": "The revised protocol binds a controlled worksheet to the current First Win while treating public-surface navigation separately. A local-only package generator now refuses a non-existent commit, source-digest drift, output overwrite, malformed role or condition labels, an expired retention date, and an entry URL that could contain credentials, query text, or a fragment; it produces a participant worksheet, restricted scorer key, blank records, and a de-identified aggregate template without recruiting, contacting, collecting, or retaining participant data. The public page gates its illustrative answer behind three locally recorded judgments and can copy a status-only local receipt; it does not collect the answer or the receipt and this static design change is not learner evidence. The entry names Chapter 1 → Lab 011 → Chapter 2 → First Safe Change fixture → Lab 001 as the recommended local Codex path, labels First Win as an optional warm-up, and exposes a first-route card that says when the offline fixture is relevant and that it does not replace the guided path. Whether readers distinguish, select, or complete either route is untested. No recruitment, session, aggregate result, scorer agreement, independent review, activation rate, or learner-effect conclusion has been recorded. Q-001 and Q-002 remain separate and cannot be closed by this preparation work."
