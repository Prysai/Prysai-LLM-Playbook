  "input_text": "Hi, the workshop changed. It starts Friday at 10. Bring the draft. Tell me if you cannot come.",
  "prompt": "You are revising a fictional short message. Do not use tools, files, browsing, or outside facts.\n\nSource message:\n\"Hi, the workshop changed. It starts Friday at 10. Bring the draft. Tell me if you cannot come.\"\n\nRewrite it as a clear message to workshop participants. Preserve every fact in the source. Do not invent a calendar date, time zone, venue, deadline, sender, reason for the change, contact method, or any other detail. If a detail is missing, leave it unstated rather than guessing.\n\nReturn only the revised message. The reader will check it.",
  "example_output": "The workshop starts Friday at 10. Please bring your draft. If you cannot attend, please reply.",
  "expected_characteristics": [
    "addresses workshop participants clearly",
    "preserves Friday at 10",
    "preserves the instruction to bring the draft",
    "asks unavailable participants to reply",
    "does not invent a venue, deadline, sender, or reason"
  ],
  "human_checks": [
    "Facts kept — Friday at 10 and the instruction to bring the draft are still present: PASS / FAIL / UNSURE.",
    "Action kept — anyone who cannot attend is asked to reply: PASS / FAIL / UNSURE.",
    "Nothing invented — no date, time zone, venue, deadline, sender, reason, contact method, or other new fact appears: PASS / FAIL / UNSURE."
  ],
  "comparison_gate": {
    "rule": "record_all_three_judgments_before_comparison",
    "accepted_judgments": ["PASS", "FAIL", "UNSURE"],
    "storage_boundary": "temporary page state only; the page does not collect, transmit, or retain the reader's answer or check record",
    "comparison_boundary": "The example is illustrative and must not score the reader or establish learning."
  },
  "rescue_prompt": "Keep the fictional source and your previous answer in view.\n\nMy first failed or uncertain check is: [paste check 1, 2, or 3 here].\n\nDo three things only:\n1. quote the words in your previous answer that caused the failure or uncertainty;\n2. explain the mismatch in one sentence;\n3. return one corrected message, changing only what is necessary.\n\nDo not add any fact that is absent from the source. If the source does not contain a detail, leave it unstated rather than guessing.",
  "receipt_fields": ["attempted", "checked_here", "help_used", "corrected", "not_proven"],
  "receipt": {
    "attempted": "yes or no",
    "checked_here": "the three stated checks only",
    "help_used": "first prompt, rescue prompt, both, or neither",
    "corrected": "yes, no, or not needed",
    "not_proven": "general writing ability, learning, transfer, or model superiority"
  },
  "check_record": {
    "fields": ["facts_kept", "action_kept", "nothing_invented", "help_used", "correction_status"],
    "copy_boundary": "A copied record contains selected statuses and claim limits only; it must not include the reader's chat answer or personal data."
