  "input_text": "The workshop changed. It starts Friday at 10. Bring the draft. Tell me if you cannot come.",
  "prompt": "Please rewrite the message below so it is clear and friendly.\n\nKeep every fact exactly the same. Do not add a date, place, reason, contact detail, or any other information that is not in the original.\n\nOriginal message:\n\"The workshop changed. It starts Friday at 10. Bring the draft. Tell me if you cannot come.\"\n\nReturn only the rewritten message.",
  "example_output": "The workshop starts Friday at 10. Please bring your draft. If you cannot attend, please reply.",
  "expected_characteristics": [
    "addresses workshop participants clearly",
    "preserves Friday at 10",
    "preserves the instruction to bring the draft",
    "asks unavailable participants to reply",
    "does not invent a venue, deadline, sender, or reason"
  ],
  "human_checks": [
    "Does the answer still say Friday at 10?",
    "Does it still ask people to bring the draft and reply if they cannot come?",
    "Did it avoid adding a date, place, reason, or contact detail?"
  ],
  "teaching_point": "An LLM can generate useful-sounding text, but it does not automatically know that missing details must remain unknown. A clear instruction plus a quick human check makes that limit visible.",
