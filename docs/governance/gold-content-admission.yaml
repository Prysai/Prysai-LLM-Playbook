    "reference": ["lookup_scope", "canonical_owners"]
  },
  "hard_gates": [
    {
      "id": "distinct-increment",
      "question": "Does the unit add a decision, failure class, artifact, or transfer not already owned elsewhere?",
      "reject_when": "It only restates existing advice or changes wording."
    },
    {
      "id": "no-prompt-folklore",
      "question": "Does the unit avoid presenting a perfect prompt, role phrase, or longer prompt as a guarantee?",
      "reject_when": "Prompt advice lacks task inputs, uncertainty, comparison, or verification."
    },
    {
      "id": "no-invented-evidence",
      "question": "Are stories, metrics, runs, screenshots, customers, and outcomes real or explicitly synthetic?",
      "reject_when": "Any success, provenance, runtime, or user outcome is invented or ambiguous."
    },
    {
      "id": "source-license-clear",
      "question": "Are source, adaptation, asset, and license boundaries explicit?",
      "reject_when": "Copied wording, code, image, dataset, or permission is unclear."
    },
    {
      "id": "volatile-facts-bounded",
      "question": "Are volatile product facts bound to authoritative URLs, date, scope, owner, and next review?",
      "reject_when": "A volatile claim lacks any required freshness field."
    },
    {
      "id": "platform-delta-real",
      "question": "Does every platform-specific unit name a behavior or contract delta?",
      "reject_when": "A platform name is added without a platform-specific difference."
    },
    {
      "id": "acceptance-observable",
      "question": "Can acceptance be judged from an observable artifact and bounded evidence?",
      "reject_when": "Acceptance is subjective polish, length, confidence, or file presence alone."
    },
    {
      "id": "limits-explicit",
      "question": "Does the unit state what passing still does not prove?",
      "reject_when": "The completion or maturity claim is broader than the named evidence."
    }
  ],
  "score_policy": {
    "minimum_total": 24,
    "minimum_each": 1,
    "maximum_each": 4,
    "dimensions": [
      {"id": "real-demand", "question": "Is the reader problem observed in credible field evidence, learner evidence, or repeated project practice?"},
      {"id": "consequential-decision", "question": "Does the unit change a decision about quality, safety, cost, or speed?"},
      {"id": "novel-increment", "question": "Does it add capability not already owned by another unit?"},
      {"id": "actionability", "question": "Can the learner produce a bounded useful artifact?"},
      {"id": "evidence-strength", "question": "Are claims supported at their stated scope with limits visible?"},
      {"id": "failure-value", "question": "Does a realistic failure teach diagnosis, recovery, or a clean stop?"},
      {"id": "transfer-value", "question": "Are the invariant and material delta named for another task or platform?"},
      {"id": "maintenance-fitness", "question": "Are ownership, duplication, volatility, and retirement manageable?"}
    ]
  },
