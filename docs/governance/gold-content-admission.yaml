  "families": ["chapter", "lab", "evaluation-candidate", "field-case", "platform-adapter", "task-route", "reference"],
  "audiences": ["beginner", "practitioner", "advanced", "leader"],
  "platform_scopes": ["universal", "platform-specific"],
  "required_record_fields": [
    "content_id",
    "family",
    "title",
    "status",
    "audiences",
    "platform_scope",
    "problem",
    "capability_increment",
    "consequential_decision",
