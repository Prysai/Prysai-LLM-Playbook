<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Six LLM terms, one checked result</title>
  <desc id="desc">A horizontal editorial map separates token, context, context window, prompt, response, and tool or agent. The final red boundary says that a response is only a candidate until a person checks it against the source or acceptance rule.</desc>
  <rect width="1400" height="1000" fill="#f6f6f2"/>
  <rect x="48" y="36" width="1304" height="10" fill="#161616"/>
  <text x="48" y="92" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LLM BASICS / ONE REQUEST</text>
  <text x="48" y="166" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-3">SIX TERMS.</text>
  <text x="48" y="236" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-3">ONE CHECK.</text>
  <text x="48" y="282" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="17">separate the layers before you trust the answer</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="354" width="196" height="290" fill="#161616"/>
    <text x="72" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / UNIT</text>
    <text x="72" y="452" fill="#ffffff" font-size="32" font-weight="900">TOKEN</text>
    <text x="72" y="500" fill="#c4c4be" font-size="18">A small piece</text>
    <text x="72" y="528" fill="#c4c4be" font-size="18">of text the</text>
    <text x="72" y="556" fill="#c4c4be" font-size="18">model processes.</text>
    <text x="72" y="610" fill="#ffffff" font-size="16" font-weight="700">It is not a fact.</text>

    <rect x="264" y="354" width="196" height="290" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="288" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / MATERIAL</text>
    <text x="288" y="452" fill="#161616" font-size="32" font-weight="900">CONTEXT</text>
    <text x="288" y="500" fill="#565650" font-size="18">The material</text>
    <text x="288" y="528" fill="#565650" font-size="18">available for</text>
    <text x="288" y="556" fill="#565650" font-size="18">this turn.</text>
    <text x="288" y="610" fill="#161616" font-size="16" font-weight="700">Missing context stays unknown.</text>

    <rect x="480" y="354" width="196" height="290" fill="#d71920"/>
    <text x="504" y="392" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / CAPACITY</text>
    <text x="504" y="452" fill="#ffffff" font-size="32" font-weight="900">WINDOW</text>
    <text x="504" y="500" fill="#ffffff" font-size="18">The limit on</text>
    <text x="504" y="528" fill="#ffffff" font-size="18">what can fit</text>
    <text x="504" y="556" fill="#ffffff" font-size="18">in the turn.</text>
    <text x="504" y="610" fill="#161616" font-size="16" font-weight="700">More text is not always better.</text>

    <rect x="696" y="354" width="196" height="290" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="720" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / DIRECTION</text>
    <text x="720" y="452" fill="#161616" font-size="32" font-weight="900">PROMPT</text>
    <text x="720" y="500" fill="#565650" font-size="18">Your goal,</text>
    <text x="720" y="528" fill="#565650" font-size="18">constraints,</text>
    <text x="720" y="556" fill="#565650" font-size="18">and output shape.</text>
    <text x="720" y="610" fill="#161616" font-size="16" font-weight="700">A prompt frames; it does not grant access.</text>

    <rect x="912" y="354" width="196" height="290" fill="#161616"/>
    <text x="936" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">05 / CANDIDATE</text>
    <text x="936" y="452" fill="#ffffff" font-size="32" font-weight="900">RESPONSE</text>
    <text x="936" y="500" fill="#c4c4be" font-size="18">Text proposed</text>
    <text x="936" y="528" fill="#c4c4be" font-size="18">by the model</text>
    <text x="936" y="556" fill="#c4c4be" font-size="18">for you to inspect.</text>
    <text x="936" y="610" fill="#ffffff" font-size="16" font-weight="700">Fluency is not evidence.</text>

    <rect x="1128" y="354" width="224" height="290" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="1152" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">06 / EXTRA ACTION</text>
    <text x="1152" y="452" fill="#161616" font-size="32" font-weight="900">TOOL / AGENT</text>
    <text x="1152" y="500" fill="#565650" font-size="18">A product may</text>
    <text x="1152" y="528" fill="#565650" font-size="18">read or act</text>
    <text x="1152" y="556" fill="#565650" font-size="18">with extra authority.</text>
    <text x="1152" y="610" fill="#161616" font-size="16" font-weight="700">Execution still needs permission.</text>
  </g>

  <g stroke="#d71920" stroke-width="5" fill="none">
    <path d="M244 500H258"/><path d="M460 500H474"/><path d="M676 500H690"/><path d="M892 500H906"/><path d="M1108 500H1122"/>
  </g>
  <g fill="#d71920">
    <path d="M258 500l-12-8v16z"/><path d="M474 500l-12-8v16z"/><path d="M690 500l-12-8v16z"/><path d="M906 500l-12-8v16z"/><path d="M1122 500l-12-8v16z"/>
  </g>

  <rect x="48" y="718" width="1304" height="176" fill="#d71920"/>
  <text x="76" y="760" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">CHECK / DO NOT SKIP THIS LINE</text>
  <text x="76" y="812" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">RESPONSE ≠ ACTION ≠ VERIFIED RESULT</text>
  <text x="76" y="852" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20">Compare the result with a source, diff, test, log, or acceptance rule before you claim completion.</text>
  <text x="48" y="950" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / ORIGINAL TEACHING BOARD / BEGIN WITH THE LAYERS</text>
</svg>
