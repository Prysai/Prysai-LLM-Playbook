<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Turn a first attempt into a checkable receipt</title>
  <desc id="desc">A five-step teaching board moves from a bounded goal and non-sensitive input through an actual response, one focused check, and a small receipt that records the result, limits, unknowns, and next step.</desc>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="40" y="30" width="820" height="10" fill="#161616"/>
  <text x="40" y="88" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FIRST ATTEMPT / EVIDENCE RECEIPT</text>
  <text x="40" y="148" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" letter-spacing="-2">DO THE SMALL</text>
  <text x="40" y="202" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" letter-spacing="-2">ATTEMPT. KEEP THE</text>
  <text x="40" y="256" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" letter-spacing="-2">RECEIPT.</text>
  <text x="42" y="294" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="16">one bounded run / one focused check / no claim beyond the record</text>
  <line x1="80" y1="364" x2="80" y2="1080" stroke="#d71920" stroke-width="8"/>
  <circle cx="80" cy="402" r="16" fill="#d71920"/><circle cx="80" cy="560" r="16" fill="#d71920"/><circle cx="80" cy="718" r="16" fill="#d71920"/><circle cx="80" cy="876" r="16" fill="#d71920"/><circle cx="80" cy="1034" r="16" fill="#d71920"/>
  <g transform="translate(126 330)"><rect width="734" height="144" fill="#161616"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / GOAL</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">NAME ONE CHECKABLE RESULT.</text><text x="24" y="116" fill="#c4c4be" font-family="Arial, Helvetica, sans-serif" font-size="21">A smaller target leaves a clearer record.</text></g>
  <g transform="translate(126 488)"><rect width="734" height="144" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / INPUT</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">KEEP ONLY SAFE, RELEVANT INPUT.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="21">Use a fixture or non-sensitive example; mark what is missing.</text></g>
  <g transform="translate(126 646)"><rect width="734" height="144" fill="#d71920"/><text x="24" y="34" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / RUN</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">SAVE WHAT ACTUALLY HAPPENED.</text><text x="24" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21">Keep the response, diff, exit, log, or screenshot—not the plan.</text></g>
  <g transform="translate(126 804)"><rect width="734" height="144" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / CHECK</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">COMPARE ONE IMPORTANT DETAIL.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="21">Use a source, diff, test, log, or acceptance rule.</text></g>
  <g transform="translate(126 962)"><rect width="734" height="144" fill="#161616"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">05 / RECEIPT</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">WRITE RESULT, LIMIT, UNKNOWN.</text><text x="24" y="116" fill="#c4c4be" font-family="Arial, Helvetica, sans-serif" font-size="21">Add the smallest safe next step—or stop.</text></g>
  <rect x="40" y="1174" width="820" height="132" fill="#d71920"/>
  <text x="64" y="1214" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">RECEIPT / CLAIM BOUNDARY</text>
  <text x="64" y="1258" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">A PLAN IS NOT A RUN.</text><text x="64" y="1290" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">A RUN IS NOT MASTERY.</text>
  <text x="40" y="1360" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / ORIGINAL TEACHING BOARD / KEEP THE CHECKABLE RECEIPT</text>
</svg>
