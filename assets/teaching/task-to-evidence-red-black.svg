<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">A claim can travel only as far as its evidence</title>
  <desc id="desc">A vertical editorial teaching board moves from one request through scope, action, and observation to a narrow claim. It ends at an explicit unknown boundary and says that a confident summary is not an observation.</desc>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="40" y="30" width="820" height="10" fill="#161616"/>
  <text x="40" y="88" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">EVIDENCE FILE / REQUEST TO CLAIM</text>
  <text x="40" y="148" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" letter-spacing="-2">A CLAIM TRAVELS</text>
  <text x="40" y="202" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" letter-spacing="-2">ONLY AS FAR AS ITS</text>
  <text x="40" y="256" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="900" letter-spacing="-2">EVIDENCE.</text>
  <text x="42" y="294" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="16">one named result / one read-back / no expanded claim</text>
  <line x1="80" y1="364" x2="80" y2="1080" stroke="#d71920" stroke-width="8"/>
  <circle cx="80" cy="402" r="16" fill="#d71920"/><circle cx="80" cy="560" r="16" fill="#d71920"/><circle cx="80" cy="718" r="16" fill="#d71920"/><circle cx="80" cy="876" r="16" fill="#d71920"/><circle cx="80" cy="1034" r="16" fill="#d71920"/>
  <g transform="translate(126 330)"><rect width="734" height="144" fill="#161616"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / REQUEST</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">NAME ONE RESULT.</text><text x="24" y="116" fill="#c4c4be" font-family="Arial, Helvetica, sans-serif" font-size="21">“Update the page” is still incomplete.</text></g>
  <g transform="translate(126 488)"><rect width="734" height="144" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / SCOPE</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">MAKE THE LIMIT VISIBLE.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="21">Path, authority, allowed action, and stop.</text></g>
  <g transform="translate(126 646)"><rect width="734" height="144" fill="#d71920"/><text x="24" y="34" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / ACTION</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">RECORD THE ACTUAL EVENT.</text><text x="24" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21">Edit, command, or submitted call—not a plan.</text></g>
  <g transform="translate(126 804)"><rect width="734" height="144" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / OBSERVATION</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">READ IT BACK.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="21">Inspect a diff, exit, log, screenshot, or source.</text></g>
  <g transform="translate(126 962)"><rect width="734" height="144" fill="#161616"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">05 / CLAIM LIMIT</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">SAY ONLY WHAT THE</text><text x="24" y="112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">RECORD SUPPORTS.</text></g>
  <rect x="40" y="1174" width="820" height="132" fill="#d71920"/>
  <text x="64" y="1214" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">UNKNOWN / STOP HERE</text>
  <text x="64" y="1258" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">A CONFIDENT SUMMARY IS NOT</text><text x="64" y="1290" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">AN OBSERVATION.</text>
  <text x="40" y="1360" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / ORIGINAL TEACHING BOARD / INSPECT BEFORE YOU CLAIM</text>
</svg>
