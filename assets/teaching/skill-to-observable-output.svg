<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From Skill contract to observable output</title>
  <desc id="desc">A visual learning slide connecting a skill trigger and input check to a bounded artifact and an evidence review.</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7f2e9"/><stop offset="1" stop-color="#e8e0d4"/></linearGradient>
    <pattern id="rule" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#22313a" stroke-opacity=".08"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#071016" flood-opacity=".28"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#18232a"/>
  <rect x="44" y="44" width="1512" height="812" rx="24" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="44" y="44" width="1512" height="812" rx="24" fill="url(#rule)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="100" y="116" font-size="16" font-weight="700" letter-spacing="4" fill="#b6402f">SKILL DESIGN / FIELD GUIDE</text>
    <text x="100" y="190" font-size="56" font-weight="800" letter-spacing="-2" fill="#17242c">A Skill is not a magic button.</text>
    <text x="100" y="236" font-size="22" fill="#52616a">It is a bounded method whose output can be inspected.</text>
  </g>
  <g transform="translate(100 324)" font-family="Arial, Helvetica, sans-serif">
    <g><rect width="260" height="190" rx="14" fill="#172a33"/><text x="24" y="40" font-size="14" font-weight="700" letter-spacing="2" fill="#ffb19f">01 / TRIGGER</text><text x="24" y="88" font-size="24" font-weight="700" fill="#f7f2e9">When is this</text><text x="24" y="120" font-size="24" font-weight="700" fill="#f7f2e9">method relevant?</text><text x="24" y="162" font-size="15" fill="#b8c4c8">Name the job.</text></g>
    <path d="M278 95H326" stroke="#b6402f" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(344)"><rect width="260" height="190" rx="14" fill="#fffaf1" stroke="#d8cdbc"/><text x="24" y="40" font-size="14" font-weight="700" letter-spacing="2" fill="#b6402f">02 / INPUT</text><text x="24" y="88" font-size="24" font-weight="700" fill="#17242c">What must exist</text><text x="24" y="120" font-size="24" font-weight="700" fill="#17242c">before action?</text><text x="24" y="162" font-size="15" fill="#52616a">Missing input → stop.</text></g>
    <path d="M622 95H670" stroke="#b6402f" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(688)"><rect width="260" height="190" rx="14" fill="#fffaf1" stroke="#d8cdbc"/><text x="24" y="40" font-size="14" font-weight="700" letter-spacing="2" fill="#b6402f">03 / METHOD</text><text x="24" y="88" font-size="24" font-weight="700" fill="#17242c">What is allowed,</text><text x="24" y="120" font-size="24" font-weight="700" fill="#17242c">forbidden, reversible?</text><text x="24" y="162" font-size="15" fill="#52616a">Keep authority narrow.</text></g>
    <path d="M966 95H1014" stroke="#b6402f" stroke-width="4" marker-end="url(#a)"/>
    <g transform="translate(1032)"><rect width="260" height="190" rx="14" fill="#172a33"/><text x="24" y="40" font-size="14" font-weight="700" letter-spacing="2" fill="#ffd994">04 / OUTPUT</text><text x="24" y="88" font-size="24" font-weight="700" fill="#f7f2e9">What artifact should</text><text x="24" y="120" font-size="24" font-weight="700" fill="#f7f2e9">another person inspect?</text><text x="24" y="162" font-size="15" fill="#b8c4c8">File · screenshot · log.</text></g>
  </g>
  <path d="M230 590C500 690 1080 690 1360 590" fill="none" stroke="#b6402f" stroke-width="3" stroke-dasharray="10 12"/>
  <g font-family="Arial, Helvetica, sans-serif"><text x="800" y="704" text-anchor="middle" font-size="23" font-weight="700" fill="#17242c">Then run a positive case, a boundary case, a failure case, and a transfer case.</text><text x="800" y="748" text-anchor="middle" font-size="17" fill="#52616a">A polished output is one artifact. A reusable Skill is an artifact plus its limits and evidence.</text></g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#52616a" font-size="14"><text x="100" y="812">ORIGINAL VECTOR / NO EXTERNAL MEDIA / 2026-08-11</text><text x="1500" y="812" text-anchor="end">Prysai Lab</text></g>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b6402f"/></marker></defs>
</svg>
