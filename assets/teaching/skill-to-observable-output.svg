<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A Skill contract ends in an observable artifact</title>
  <desc id="desc">A hard-edged red, black, and off-white editorial diagram. Four unequal stages move from trigger to input gate, bounded method, and observable artifact. A lower verification rail requires positive, boundary, failure, and transfer cases.</desc>
  <rect width="1600" height="900" fill="#f3f0e9"/>
  <rect width="1600" height="116" fill="#11151a"/>
  <rect x="64" y="46" width="18" height="18" fill="#d62828"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="106" y="68" fill="#f3f0e9" font-size="32" font-weight="700" letter-spacing="1">SKILL CONTRACT → OBSERVABLE ARTIFACT</text>
    <text x="1536" y="68" fill="#f3f0e9" font-size="16" font-weight="700" text-anchor="end" letter-spacing="2">METHOD / NOT MAGIC</text>

    <text x="64" y="190" fill="#11151a" font-size="58" font-weight="800" letter-spacing="-2">Four decisions. One inspectable result.</text>
    <text x="64" y="232" fill="#4f555a" font-size="21">Width follows the question; authority stays visible at every handoff.</text>

    <rect x="64" y="290" width="270" height="292" fill="#11151a"/>
    <text x="88" y="330" fill="#ef4444" font-size="18" font-weight="700" letter-spacing="2">01 / TRIGGER</text>
    <text x="88" y="393" fill="#f3f0e9" font-size="35" font-weight="700">Name the job.</text>
    <text x="88" y="448" fill="#c9cccf" font-size="20">When is this method</text>
    <text x="88" y="480" fill="#c9cccf" font-size="20">the narrowest fit?</text>
    <line x1="88" y1="528" x2="310" y2="528" stroke="#ef4444" stroke-width="4"/>
    <text x="88" y="559" fill="#f3f0e9" font-size="16" font-weight="700">OUTPUT: ROUTE OR YIELD</text>

    <rect x="350" y="290" width="318" height="292" fill="#f3f0e9" stroke="#11151a" stroke-width="3"/>
    <text x="374" y="330" fill="#d62828" font-size="18" font-weight="700" letter-spacing="2">02 / INPUT GATE</text>
    <text x="374" y="393" fill="#11151a" font-size="32" font-weight="700">Check first.</text>
    <text x="374" y="448" fill="#4f555a" font-size="20">What must be present?</text>
    <text x="374" y="480" fill="#4f555a" font-size="20">What missing fact stops work?</text>
    <line x1="374" y1="528" x2="644" y2="528" stroke="#d62828" stroke-width="4"/>
    <text x="374" y="559" fill="#11151a" font-size="16" font-weight="700">MISSING INPUT → STOP</text>

    <rect x="684" y="290" width="380" height="292" fill="#d62828"/>
    <text x="708" y="330" fill="#11151a" font-size="18" font-weight="700" letter-spacing="2">03 / BOUNDED METHOD</text>
    <text x="708" y="393" fill="#ffffff" font-size="32" font-weight="700">Separate the actions.</text>
    <text x="708" y="448" fill="#ffffff" font-size="20">Allowed / forbidden / reversible</text>
    <text x="708" y="480" fill="#ffffff" font-size="20">Target / owner / stop / rollback</text>
    <line x1="708" y1="528" x2="1040" y2="528" stroke="#11151a" stroke-width="4"/>
    <text x="708" y="559" fill="#11151a" font-size="16" font-weight="700">CAPABILITY ≠ AUTHORITY</text>

    <rect x="1080" y="290" width="456" height="292" fill="#11151a"/>
    <text x="1104" y="330" fill="#ef4444" font-size="18" font-weight="700" letter-spacing="2">04 / OBSERVABLE ARTIFACT</text>
    <text x="1104" y="393" fill="#f3f0e9" font-size="35" font-weight="700">Leave proof another</text>
    <text x="1104" y="434" fill="#f3f0e9" font-size="35" font-weight="700">person can inspect.</text>
    <text x="1104" y="480" fill="#c9cccf" font-size="20">File · diff · log · screenshot</text>
    <line x1="1104" y1="528" x2="1512" y2="528" stroke="#ef4444" stroke-width="4"/>
    <text x="1104" y="559" fill="#f3f0e9" font-size="16" font-weight="700">ARTIFACT + LIMIT + STATUS</text>

    <text x="64" y="654" fill="#d62828" font-size="17" font-weight="700" letter-spacing="2">VERIFICATION RAIL</text>
    <line x1="64" y1="690" x2="1536" y2="690" stroke="#11151a" stroke-width="3"/>
    <rect x="64" y="676" width="18" height="28" fill="#d62828"/>
    <rect x="440" y="676" width="18" height="28" fill="#d62828"/>
    <rect x="816" y="676" width="18" height="28" fill="#d62828"/>
    <rect x="1192" y="676" width="18" height="28" fill="#d62828"/>
    <text x="64" y="748" fill="#11151a" font-size="27" font-weight="700">POSITIVE</text>
    <text x="440" y="748" fill="#11151a" font-size="27" font-weight="700">BOUNDARY</text>
    <text x="816" y="748" fill="#11151a" font-size="27" font-weight="700">FAILURE</text>
    <text x="1192" y="748" fill="#11151a" font-size="27" font-weight="700">TRANSFER</text>
    <text x="64" y="784" fill="#4f555a" font-size="17">works on the named job</text>
    <text x="440" y="784" fill="#4f555a" font-size="17">yields outside its scope</text>
    <text x="816" y="784" fill="#4f555a" font-size="17">stops or recovers honestly</text>
    <text x="1192" y="784" fill="#4f555a" font-size="17">survives a changed example</text>

    <text x="64" y="854" fill="#11151a" font-size="15" font-weight="700">ORIGINAL PROJECT VECTOR · NO EXTERNAL MEDIA</text>
    <text x="1536" y="854" fill="#11151a" font-size="15" font-weight="700" text-anchor="end">PRYSAI LAB / CANDIDATE</text>
  </g>
</svg>
