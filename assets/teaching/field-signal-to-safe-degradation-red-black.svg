<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" role="img" aria-labelledby="title desc">
  <title id="title">From field signal to the first safe move</title>
  <desc id="desc">A vertical editorial teaching board presents three field signals, the unsupported inference to avoid, and the first safe move. It ends by instructing the reader to preserve the signal and narrow the next check. Source scope and limits are maintained in source record S43.</desc>
  <rect width="900" height="1450" fill="#f6f6f2"/>
  <rect x="40" y="30" width="820" height="10" fill="#161616"/>
  <text x="40" y="88" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FIELD NOTE / ACTION UNDER UNCERTAINTY</text>
  <text x="40" y="148" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">A SIGNAL TELLS YOU</text>
  <text x="40" y="202" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">WHAT TO CHECK—</text>
  <text x="40" y="256" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">NOT WHAT TO CLAIM.</text>
  <text x="42" y="294" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="16">keep the observation / refuse the leap / take the smallest safe move</text>

  <line x1="80" y1="370" x2="80" y2="1128" stroke="#d71920" stroke-width="8"/>
  <circle cx="80" cy="412" r="16" fill="#d71920"/><circle cx="80" cy="664" r="16" fill="#d71920"/><circle cx="80" cy="916" r="16" fill="#d71920"/>

  <g transform="translate(126 336)">
    <rect width="734" height="206" fill="#161616"/>
    <text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / FIELD SIGNAL</text>
    <text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">TARGETS DIFFER.</text>
    <text x="24" y="112" fill="#c4c4be" font-family="Arial, Helvetica, sans-serif" font-size="21">A label and the runtime disagree.</text>
    <line x1="24" y1="136" x2="710" y2="136" stroke="#52524d" stroke-width="2"/>
    <text x="24" y="166" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700">DO NOT INFER</text>
    <text x="194" y="166" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20">Label = runtime target.</text>
  </g>
  <g transform="translate(126 588)">
    <rect width="734" height="206" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / FIELD SIGNAL</text>
    <text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">OUTPUT IS MISSING.</text>
    <text x="24" y="112" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="21">A command ended; proof is absent.</text>
    <line x1="24" y1="136" x2="710" y2="136" stroke="#c9c9c4" stroke-width="2"/>
    <text x="24" y="166" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700">DO NOT INFER</text>
    <text x="194" y="166" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="20">Command = verified result.</text>
  </g>
  <g transform="translate(126 840)">
    <rect width="734" height="206" fill="#d71920"/>
    <text x="24" y="34" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / FIELD SIGNAL</text>
    <text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">A CHECK WRITES.</text>
    <text x="24" y="112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="21">A diagnostic step changes state.</text>
    <line x1="24" y1="136" x2="710" y2="136" stroke="#f48589" stroke-width="2"/>
    <text x="24" y="166" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700">DO NOT INFER</text>
    <text x="194" y="166" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20">Can do = authorized.</text>
  </g>

  <rect x="40" y="1124" width="820" height="184" fill="#161616"/>
  <text x="64" y="1162" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">FIRST SAFE MOVE / ALL THREE CASES</text>
  <text x="64" y="1204" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900">PRESERVE THE SIGNAL. NAME THE</text>
  <text x="64" y="1236" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900">TARGET, EFFECT, AND NEXT CHECK.</text>
  <text x="64" y="1272" fill="#c4c4be" font-family="Arial, Helvetica, sans-serif" font-size="19">Check cwd/root/branch · keep exit/artifact/read-back · stop on mismatch.</text>
  <text x="40" y="1374" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / ORIGINAL TEACHING BOARD / SOURCE BOUNDARY S43</text>
</svg>
