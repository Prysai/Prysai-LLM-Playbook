<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">LLM Foundation Core five-unit path</title>
  <desc id="desc">A five-unit learning path: start with one safe attempt, make context and instructions visible, recognize visible failures, check and repair the result, then repeat the method on an unseen task.</desc>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="42" y="34" width="816" height="10" fill="#171717"/>
  <text x="42" y="94" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">FOUNDATION CORE / FIVE UNITS</text>
  <text x="42" y="158" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">LEARN THE METHOD</text>
  <text x="42" y="214" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">BEFORE THE PLATFORM.</text>
  <text x="44" y="255" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="16">attempt / observe / name / repair / transfer</text>

  <line x1="76" y1="330" x2="76" y2="1178" stroke="#d71920" stroke-width="8"/>
  <circle cx="76" cy="370" r="15" fill="#d71920"/>
  <circle cx="76" cy="540" r="15" fill="#d71920"/>
  <circle cx="76" cy="710" r="15" fill="#d71920"/>
  <circle cx="76" cy="880" r="15" fill="#d71920"/>
  <circle cx="76" cy="1050" r="15" fill="#d71920"/>

  <g transform="translate(122 318)">
    <rect width="734" height="124" fill="#171717"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / ATTEMPT</text>
    <text x="24" y="80" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">Start with one safe attempt.</text>
    <text x="24" y="104" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="15">Keep the first response as the baseline.</text>
  </g>
  <g transform="translate(122 488)">
    <rect width="734" height="124" fill="#ffffff" stroke="#171717" stroke-width="3"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / FRAME</text>
    <text x="24" y="80" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">Make the task fields visible.</text>
    <text x="24" y="104" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="15">Goal, context, limits, and answer shape.</text>
  </g>
  <g transform="translate(122 658)">
    <rect width="734" height="124" fill="#ffe5e9" stroke="#171717" stroke-width="3"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / NOTICE</text>
    <text x="24" y="80" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">Name the visible failure.</text>
    <text x="24" y="104" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="15">Omission, invention, ambiguity, or overconfidence.</text>
  </g>
  <g transform="translate(122 828)">
    <rect width="734" height="124" fill="#ffffff" stroke="#171717" stroke-width="3"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / REPAIR</text>
    <text x="24" y="80" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">Check, repair, and state limits.</text>
    <text x="24" y="104" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="15">Compare with evidence. Change one condition.</text>
  </g>
  <g transform="translate(122 998)">
    <rect width="734" height="124" fill="#d71920"/>
    <text x="24" y="35" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">05 / TRANSFER</text>
    <text x="24" y="80" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">Repeat it on an unseen task.</text>
    <text x="24" y="104" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="15">A new task needs its own check.</text>
  </g>

  <rect x="42" y="1192" width="816" height="132" fill="#171717"/>
  <text x="66" y="1235" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">BOUNDARY / CANDIDATE ROUTE</text>
  <text x="66" y="1278" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900">ONE ATTEMPT IS NOT MASTERY.</text>
  <text x="66" y="1308" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="18">Keep the artifact, limit, and next question.</text>
  <text x="42" y="1372" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / ORIGINAL TEACHING BOARD / PRACTICE BEFORE CLAIM</text>
</svg>
