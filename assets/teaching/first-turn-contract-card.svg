<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Six fields for a bounded first request</title>
  <desc id="desc">An editorial teaching board lists outcome, starting context, requested response, limits, check, and stop plus receipt. It warns that visible fields are not a safety or correctness certificate.</desc>
  <rect width="1600" height="900" fill="#f6f6f2"/>
  <rect x="64" y="56" width="1472" height="10" fill="#161616"/>
  <text x="64" y="126" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">FIRST TURN / A BOUNDED REQUEST</text>
  <text x="64" y="212" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="900" letter-spacing="-4">MAKE THE BOUNDARY VISIBLE.</text>
  <text x="66" y="256" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="20">one small request / six fields / no hidden authority added</text>

  <g transform="translate(64 322)">
    <rect width="462" height="146" fill="#161616"/>
    <text x="24" y="38" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700">01 / OUTCOME</text>
    <text x="24" y="83" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="900">What small result?</text>
    <text x="24" y="117" fill="#c4c4be" font-family="Arial, Helvetica, sans-serif" font-size="17">Name one inspectable result for this session.</text>
  </g>
  <g transform="translate(569 322)">
    <rect width="462" height="146" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="24" y="38" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700">02 / STARTING CONTEXT</text>
    <text x="24" y="83" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="900">What may it use?</text>
    <text x="24" y="117" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="17">Supply text, facts, sources, or say “unknown.”</text>
  </g>
  <g transform="translate(1074 322)">
    <rect width="462" height="146" fill="#d71920"/>
    <text x="24" y="38" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700">03 / REQUESTED RESPONSE</text>
    <text x="24" y="83" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="900">What shape fits?</text>
    <text x="24" y="117" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17">Ask for a form, length, or small sequence.</text>
  </g>

  <g transform="translate(64 492)">
    <rect width="462" height="146" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="24" y="38" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700">04 / LIMITS</text>
    <text x="24" y="83" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="900">What must not widen?</text>
    <text x="24" y="117" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="17">Name data, actions, or help you do not want.</text>
  </g>
  <g transform="translate(569 492)">
    <rect width="462" height="146" fill="#d71920"/>
    <text x="24" y="38" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700">05 / CHECK</text>
    <text x="24" y="83" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="900">How will you inspect?</text>
    <text x="24" y="117" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17">Ask for uncertainty, sources, or a revision check.</text>
  </g>
  <g transform="translate(1074 492)">
    <rect width="462" height="146" fill="#161616"/>
    <text x="24" y="38" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700">06 / STOP + RECEIPT</text>
    <text x="24" y="83" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="900">When does it end?</text>
    <text x="24" y="117" fill="#c4c4be" font-family="Arial, Helvetica, sans-serif" font-size="17">Keep one small record of unknowns and next step.</text>
  </g>

  <rect x="64" y="692" width="1472" height="128" fill="#161616"/>
  <text x="92" y="735" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="17" font-weight="700">BEFORE SEND / INSPECT THE DRAFT</text>
  <text x="92" y="790" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900">VISIBLE FIELDS ≠ A SAFETY, CORRECTNESS, OR COMPLETION CERTIFICATE.</text>
  <text x="64" y="864" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="14">PRYSAI LAB / ORIGINAL TEACHING BOARD / CANDIDATE / 2026-08-13</text>
</svg>
