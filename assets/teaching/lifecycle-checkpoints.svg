<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A workflow advances through inspectable exits</title>
  <desc id="desc">A hard-edged seven-stage workflow is split into two reading bands. Each stage names its exit evidence. A missing exit branches visibly to stop and recover.</desc>
  <rect width="1600" height="900" fill="#111315"/>
  <rect x="0" y="0" width="34" height="900" fill="#e43b2f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="76" fill="#e43b2f" font-size="18" font-weight="700" letter-spacing="4">WORKFLOW CONTROL / 07 STAGES / 08</text>
    <text x="76" y="172" fill="#f0ebe1" font-size="66" font-weight="800" letter-spacing="-3">NO EXIT EVIDENCE. NO ADVANCE.</text>
    <text x="80" y="218" fill="#a9adb0" font-size="21">The Agent moving on is not a checkpoint. An inspectable artifact is.</text>
    <path d="M76 262H1524" stroke="#f0ebe1" stroke-opacity=".28"/>

    <g transform="translate(76 304)">
      <text x="0" y="-18" fill="#777b7e" font-size="14" font-weight="700" letter-spacing="3">BAND A / FRAME AND MAKE</text>
      <g>
        <rect width="334" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">01</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">DEFINE</text>
        <text x="86" y="82" fill="#55595c" font-size="16">goal / scope / non-goals</text>
        <path d="M86 108H310" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">EXIT / ACCEPTANCE + STOP</text>
      </g>
      <g transform="translate(354)">
        <rect width="334" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">02</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">PLAN</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">slices / dependencies / risks</text>
        <path d="M86 108H310" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">EXIT / ORDERED CHECKPOINTS</text>
      </g>
      <g transform="translate(708)">
        <rect width="334" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">03</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">BUILD</text>
        <text x="86" y="82" fill="#55595c" font-size="16">scoped diff / changed files</text>
        <path d="M86 108H310" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">EXIT / REVERSIBLE CHANGE</text>
      </g>
      <g transform="translate(1062)">
        <rect width="386" height="176" fill="#e43b2f"/>
        <rect width="62" height="176" fill="#151719"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">04</text>
        <text x="86" y="48" fill="#fff8ed" font-size="25" font-weight="800">VERIFY</text>
        <text x="86" y="82" fill="#211719" font-size="16">command / exit / runtime / limits</text>
        <path d="M86 108H362" stroke="#151719" stroke-opacity=".38"/>
        <text x="86" y="140" fill="#151719" font-size="13" font-weight="800">EXIT / CLAIM-MATCHED PROOF</text>
      </g>
    </g>

    <g transform="translate(76 574)">
      <text x="0" y="-18" fill="#777b7e" font-size="14" font-weight="700" letter-spacing="3">BAND B / JUDGE, HAND OFF, KEEP CURRENT</text>
      <g>
        <rect width="406" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">05</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">REVIEW</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">claim map / independent read / risks</text>
        <path d="M86 108H382" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">EXIT / ACCEPT, REVISE, REJECT</text>
      </g>
      <g transform="translate(426)">
        <rect width="406" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">06</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">DELIVER</text>
        <text x="86" y="82" fill="#55595c" font-size="16">diff / logs / gaps / handoff</text>
        <path d="M86 108H382" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">EXIT / BOUNDED RECEIPT</text>
      </g>
      <g transform="translate(852)">
        <rect width="354" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">07</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">MAINTAIN</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">owner / review / rollback</text>
        <path d="M86 108H330" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">EXIT / NEXT CHECK DATED</text>
      </g>
      <g transform="translate(1236)">
        <path d="M0 0H212V176H0V118H26V58H0Z" fill="#e43b2f"/>
        <text x="28" y="45" fill="#151719" font-size="16" font-weight="800">MISSING EXIT?</text>
        <text x="28" y="83" fill="#fff8ed" font-size="27" font-weight="800">STOP</text>
        <text x="28" y="116" fill="#fff8ed" font-size="27" font-weight="800">RECOVER</text>
        <text x="28" y="151" fill="#151719" font-size="13" font-weight="700">PRESERVE LAST STATE</text>
      </g>
    </g>
    <path d="M1385 480V544H1418V574" fill="none" stroke="#e43b2f" stroke-width="5"/>
    <text x="76" y="836" fill="#797d80" font-size="14">TEACHING MODEL / EACH EXIT IS CLAIM-SCOPED / A SCREENSHOT ALONE DOES NOT PROVE THE WORKFLOW RAN</text>
  </g>
</svg>
