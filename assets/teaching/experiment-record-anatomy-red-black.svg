<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Experiment record anatomy</title>
  <desc id="desc">A six-part lab record moves from a concrete question through a safe fixture, an actual run, an observation, an acceptance check, and an explicit boundary. The final boundary keeps unknowns visible instead of turning a plan into a result.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0 0 9 4 0 8Z" fill="#d71920" />
    </marker>
    <style>
      .ink { fill: #171717; font-family: Arial, Helvetica, sans-serif; }
      .muted { fill: #575750; font-family: Arial, Helvetica, sans-serif; }
      .mono { fill: #d71920; font-family: Consolas, 'Courier New', monospace; font-weight: 700; letter-spacing: 1px; }
      .line { stroke: #171717; stroke-width: 2; fill: none; }
      .redline { stroke: #d71920; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9" />
  <rect x="42" y="42" width="816" height="1416" fill="#ffffff" stroke="#171717" stroke-width="2" />
  <text x="78" y="112" class="mono" font-size="22">LAB RECORD / ONE RUN</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">KEEP THE RUN</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">SMALL ENOUGH TO CHECK.</text>
  <text x="78" y="282" class="muted" font-size="22">A plan is not an observation. Preserve the six parts that let another person inspect one bounded attempt.</text>

  <line x1="128" y1="362" x2="128" y2="1246" class="line" />
  <line x1="128" y1="488" x2="128" y2="526" class="redline" />
  <line x1="128" y1="646" x2="128" y2="684" class="redline" />
  <line x1="128" y1="804" x2="128" y2="842" class="redline" />
  <line x1="128" y1="962" x2="128" y2="1000" class="redline" />
  <line x1="128" y1="1120" x2="128" y2="1158" class="redline" />

  <g transform="translate(78 320)">
    <circle cx="50" cy="48" r="34" fill="#171717" />
    <text x="50" y="58" fill="#ffffff" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">01</text>
    <rect x="100" width="722" height="128" fill="#171717" />
    <text x="126" y="36" class="mono" font-size="15">QUESTION</text>
    <text x="126" y="82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">Name one observable result.</text>
    <text x="126" y="108" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="16">A broad intention is not yet a lab question.</text>
  </g>
  <g transform="translate(78 478)">
    <circle cx="50" cy="48" r="34" fill="#ffffff" stroke="#171717" stroke-width="3" />
    <text x="50" y="58" fill="#171717" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">02</text>
    <rect x="100" width="722" height="128" fill="#ffffff" stroke="#171717" stroke-width="3" />
    <text x="126" y="36" class="mono" font-size="15">FIXTURE</text>
    <text x="126" y="82" class="ink" font-size="30" font-weight="900">Use safe, bounded input.</text>
    <text x="126" y="108" class="muted" font-size="16">Fictional or disposable data; mark what is missing.</text>
  </g>
  <g transform="translate(78 636)">
    <circle cx="50" cy="48" r="34" fill="#d71920" />
    <text x="50" y="58" fill="#171717" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">03</text>
    <rect x="100" width="722" height="128" fill="#d71920" />
    <text x="126" y="36" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">RUN</text>
    <text x="126" y="82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">Save what actually happened.</text>
    <text x="126" y="108" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16">Keep the response, diff, log, exit status, or screenshot.</text>
  </g>
  <g transform="translate(78 794)">
    <circle cx="50" cy="48" r="34" fill="#ffffff" stroke="#171717" stroke-width="3" />
    <text x="50" y="58" fill="#171717" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">04</text>
    <rect x="100" width="722" height="128" fill="#ffffff" stroke="#171717" stroke-width="3" />
    <text x="126" y="36" class="mono" font-size="15">OBSERVE</text>
    <text x="126" y="82" class="ink" font-size="30" font-weight="900">Read the record, not the story.</text>
    <text x="126" y="108" class="muted" font-size="16">Separate visible events from what you infer about them.</text>
  </g>
  <g transform="translate(78 952)">
    <circle cx="50" cy="48" r="34" fill="#171717" />
    <text x="50" y="58" fill="#ffffff" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">05</text>
    <rect x="100" width="722" height="128" fill="#171717" />
    <text x="126" y="36" class="mono" font-size="15">ACCEPT</text>
    <text x="126" y="82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">Run one focused check.</text>
    <text x="126" y="108" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="16">Compare a source, test, diff, log, or acceptance rule.</text>
  </g>
  <g transform="translate(78 1110)">
    <circle cx="50" cy="48" r="34" fill="#d71920" />
    <text x="50" y="58" fill="#171717" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700">06</text>
    <rect x="100" width="722" height="128" fill="#d71920" />
    <text x="126" y="36" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">BOUNDARY</text>
    <text x="126" y="82" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">State what remains unknown.</text>
    <text x="126" y="108" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16">Stop, ask for authority, or name the smallest next check.</text>
  </g>

  <rect x="78" y="1302" width="744" height="92" fill="#ffe5e9" stroke="#d71920" stroke-width="2" />
  <text x="102" y="1342" class="mono" font-size="14">EVIDENCE BOUNDARY</text>
  <text x="102" y="1375" class="ink" font-size="21" font-weight="700">A completed record supports a bounded claim — not a larger one.</text>
  <text x="78" y="1428" class="muted" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / ORIGINAL TEACHING BOARD / KEEP OBSERVATIONS SEPARATE</text>
</svg>
