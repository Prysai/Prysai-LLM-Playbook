<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Claim to evidence audit</title>
  <desc id="desc">A six-step research audit: state the claim, bound its scope, name the source owner, run the smallest check, choose a supported or candidate decision, and keep a receipt with the remaining limits.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">RESEARCH / CLAIM AUDIT</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">Do not let a citation</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">carry more than it proves.</text>
  <text x="78" y="282" class="muted" font-size="22">A compact receipt for one claim, one source, and one next decision.</text>

  <line x1="128" y1="376" x2="128" y2="1300" class="line"/>
  <line x1="128" y1="520" x2="128" y2="650" class="redline"/>
  <line x1="128" y1="794" x2="128" y2="924" class="redline"/>
  <line x1="128" y1="1068" x2="128" y2="1198" class="redline"/>

  <g transform="translate(78 330)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="112" y="0" width="650" height="144" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">CLAIM</text>
    <text x="140" y="86" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900">Write the exact sentence.</text>
    <text x="140" y="119" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="19">Separate what you want to say from what you hope is true.</text>
  </g>

  <g transform="translate(78 604)">
    <circle cx="50" cy="48" r="34" fill="#d71920"/>
    <text x="50" y="58" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="112" y="0" width="650" height="144" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">SCOPE</text>
    <text x="140" y="86" class="ink" font-size="30" font-weight="900">Name the boundary.</text>
    <text x="140" y="119" class="muted" font-size="19">Record task, date, version, population, and what the source cannot establish.</text>
  </g>

  <g transform="translate(78 878)">
    <circle cx="50" cy="48" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="50" y="58" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="112" y="0" width="650" height="144" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">SOURCE</text>
    <text x="140" y="86" class="ink" font-size="30" font-weight="900">Name the owner and location.</text>
    <text x="140" y="119" class="muted" font-size="19">Keep the original URL, access date, page or section, and revision in the receipt.</text>
  </g>

  <g transform="translate(78 1152)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="112" y="0" width="650" height="144" fill="#d71920"/>
    <text x="140" y="44" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">CHECK → DECIDE → KEEP</text>
    <text x="140" y="86" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="900">Test the smallest link in the chain.</text>
    <text x="140" y="119" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="19">Mark supported, candidate, or unknown; keep the failed check and the next stop.</text>
  </g>

  <rect x="78" y="1345" width="762" height="72" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1375" class="mono" font-size="17">RECEIPT</text>
  <text x="220" y="1375" class="ink" font-size="19" font-weight="700">claim · scope · source · check · decision · limit</text>
  <text x="102" y="1403" class="muted" font-size="17">A receipt narrows a claim; it does not turn one source into certainty.</text>
</svg>
