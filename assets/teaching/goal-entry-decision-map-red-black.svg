<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Choose a Playbook entry by goal</title>
  <desc id="desc">A four-branch entry map: start with a safe task, recover an uncertain result, verify a claim, or transfer the method to a new task.</desc>
  <style>
    .ink { fill:#171717; font-family:Arial,Helvetica,sans-serif; }
    .muted { fill:#575750; font-family:Arial,Helvetica,sans-serif; }
    .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:2px; }
    .line { stroke:#171717; stroke-width:2; fill:none; }
  </style>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="42" y="34" width="816" height="10" fill="#171717"/>
  <text x="42" y="96" class="mono" font-size="18">START WITH THE QUESTION</text>
  <text x="42" y="158" class="ink" font-size="48" font-weight="900">CHOOSE ONE</text>
  <text x="42" y="214" class="ink" font-size="48" font-weight="900">SAFE ENTRY.</text>
  <text x="44" y="258" class="muted" font-size="21">A reason to begin is better than a random page.</text>

  <rect x="270" y="322" width="360" height="124" fill="#171717"/>
  <text x="450" y="363" fill="#d71920" font-family="Consolas,'Courier New',monospace" font-size="17" font-weight="700" text-anchor="middle">YOUR NEXT QUESTION</text>
  <text x="450" y="408" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900" text-anchor="middle">What do I need now?</text>

  <path d="M450 446V510M450 510H150V566M450 510H750V566M450 510V870M450 870H150V926M450 870H750V926" class="line"/>

  <g transform="translate(70 566)">
    <rect width="360" height="250" fill="#ffe5e9" stroke="#171717" stroke-width="2"/>
    <text x="24" y="42" class="mono" font-size="17">01 / START</text>
    <text x="24" y="90" class="ink" font-size="27" font-weight="900">One safe task.</text>
    <text x="24" y="132" class="muted" font-size="18">Use a fictional offline task.</text>
    <text x="24" y="166" class="muted" font-size="18">Keep the first response.</text>
    <text x="24" y="218" class="ink" font-size="18" font-weight="700">Next: smallest check</text>
  </g>
  <g transform="translate(470 566)">
    <rect width="360" height="250" fill="#fff" stroke="#171717" stroke-width="2"/>
    <text x="24" y="42" class="mono" font-size="17">02 / RECOVER</text>
    <text x="24" y="90" class="ink" font-size="27" font-weight="900">Uncertain result.</text>
    <text x="24" y="132" class="muted" font-size="18">Preserve the output and trace.</text>
    <text x="24" y="166" class="muted" font-size="18">Stop when proof is missing.</text>
    <text x="24" y="218" class="ink" font-size="18" font-weight="700">Next: actual observation</text>
  </g>
  <g transform="translate(70 926)">
    <rect width="360" height="250" fill="#171717"/>
    <text x="24" y="42" fill="#d71920" font-family="Consolas,'Courier New',monospace" font-size="17" font-weight="700">03 / VERIFY</text>
    <text x="24" y="90" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900">A claim to check.</text>
    <text x="24" y="132" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="18">Name the source and scope.</text>
    <text x="24" y="166" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="18">Run the smallest check.</text>
    <text x="24" y="218" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700">Next: what could change it?</text>
  </g>
  <g transform="translate(470 926)">
    <rect width="360" height="250" fill="#fff" stroke="#171717" stroke-width="2"/>
    <text x="24" y="42" class="mono" font-size="17">04 / TRANSFER</text>
    <text x="24" y="90" class="ink" font-size="27" font-weight="900">A new task.</text>
    <text x="24" y="132" class="muted" font-size="18">Change one condition.</text>
    <text x="24" y="166" class="muted" font-size="18">Keep a bounded receipt.</text>
    <text x="24" y="218" class="ink" font-size="18" font-weight="700">Next: what stayed stable?</text>
  </g>

  <rect x="42" y="1240" width="816" height="92" fill="#f3f0e9" stroke="#171717" stroke-width="2"/>
  <text x="66" y="1280" class="mono" font-size="16">BOUNDARY</text>
  <text x="66" y="1315" class="ink" font-size="18" font-weight="700">The map chooses an entry point; it does not prove learning or task success.</text>
</svg>
