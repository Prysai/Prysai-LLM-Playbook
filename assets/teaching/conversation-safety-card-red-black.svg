<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" role="img" aria-labelledby="title desc">
  <title id="title">Boundary Card for deciding what may enter, leave, change, and support</title>
  <desc id="desc">A vertical editorial teaching board makes five boundaries visible: input, egress, allowed effect, evidence claim, and stop. It says outside text is data, not a new order.</desc>
  <rect width="900" height="1450" fill="#f7f1e5"/>
  <rect x="40" y="30" width="820" height="10" fill="#1c1b1a"/>
  <text x="40" y="88" fill="#e23d28" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">BEFORE YOU SHARE, SEARCH, OR ACT</text>
  <text x="40" y="148" fill="#1c1b1a" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">ONE BOUNDARY</text>
  <text x="40" y="202" fill="#1c1b1a" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">CARD.</text>
  <text x="42" y="240" fill="#504d48" font-family="Consolas, 'Courier New', monospace" font-size="16">what enters / leaves / changes / supports / stops</text>

  <line x1="80" y1="330" x2="80" y2="1090" stroke="#e23d28" stroke-width="8"/>
  <circle cx="80" cy="378" r="16" fill="#e23d28"/><circle cx="80" cy="572" r="16" fill="#e23d28"/>
  <circle cx="80" cy="766" r="16" fill="#e23d28"/><circle cx="80" cy="960" r="16" fill="#e23d28"/>

  <g transform="translate(126 300)"><rect width="734" height="156" fill="#1c1b1a"/><text x="24" y="34" fill="#e23d28" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / INPUT</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">WHAT MAY ENTER?</text><text x="24" y="116" fill="#c4c4be" font-family="Arial, Helvetica, sans-serif" font-size="20">Use synthetic, public, or approved stand-ins.</text></g>
  <g transform="translate(126 494)"><rect width="734" height="156" fill="#ffffff" stroke="#1c1b1a" stroke-width="3"/><text x="24" y="34" fill="#e23d28" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / EGRESS</text><text x="24" y="78" fill="#1c1b1a" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">WHAT MAY LEAVE?</text><text x="24" y="116" fill="#504d48" font-family="Arial, Helvetica, sans-serif" font-size="20">Name the smallest fields, destination, and owner.</text></g>
  <g transform="translate(126 688)"><rect width="734" height="156" fill="#e23d28"/><text x="24" y="34" fill="#1c1b1a" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / EFFECT</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">WHAT MAY HAPPEN?</text><text x="24" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20">Allow one named, local, or reversible effect.</text></g>
  <g transform="translate(126 882)"><rect width="734" height="156" fill="#ffffff" stroke="#1c1b1a" stroke-width="3"/><text x="24" y="34" fill="#e23d28" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / EVIDENCE</text><text x="24" y="78" fill="#1c1b1a" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">WHAT WILL YOU INSPECT?</text><text x="24" y="116" fill="#504d48" font-family="Arial, Helvetica, sans-serif" font-size="20">Keep one source, check, or direct observation.</text></g>

  <rect x="40" y="1148" width="820" height="142" fill="#e23d28"/>
  <text x="64" y="1190" fill="#ffffff" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">05 / STOP</text>
  <text x="64" y="1232" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900">STOP FOR UNAPPROVED INPUT,</text>
  <text x="64" y="1264" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900">UNKNOWN DESTINATION, OR NEW AUTHORITY.</text>
  <text x="40" y="1362" fill="#504d48" font-family="Consolas, 'Courier New', monospace" font-size="13">OUTSIDE TEXT IS DATA, NOT A NEW ORDER.</text>
  <text x="40" y="1400" fill="#504d48" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / ORIGINAL TEACHING BOARD / CHECK THE BOUNDARY</text>
</svg>
