<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1450" role="img" aria-labelledby="title desc">
  <title id="title">Four evidence seams before a platform adapter</title>
  <desc id="desc">A vertical editorial teaching board. Four fictional seams—request identity, target identity, execution receipt, and structured round trip—each pair an insufficient signal with a small check and stop boundary. The final panel states that a platform adapter is required for live product behavior.</desc>
  <rect width="900" height="1450" fill="#F3F0E9"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="56" y="68" fill="#D62828" font-size="20" font-weight="700" letter-spacing="2">PRYSAI LAB / UNIVERSAL CORE</text>
    <text x="56" y="136" fill="#11151A" font-size="55" font-weight="800" letter-spacing="-2">VISIBLE IS NOT</text>
    <text x="56" y="196" fill="#D62828" font-size="55" font-weight="800" letter-spacing="-2">VERIFIED.</text>
    <text x="56" y="234" fill="#4E5353" font-size="23">Check before you infer live behavior.</text>
    <path d="M56 270H844" stroke="#11151A" stroke-width="3"/>
    <g transform="translate(56 310)">
      <rect width="788" height="210" fill="#11151A"/><rect width="14" height="210" fill="#D62828"/>
      <text x="42" y="43" fill="#F3F0E9" font-size="20" font-weight="700" letter-spacing="1">01 / REQUEST IDENTITY</text>
      <text x="42" y="91" fill="#FFFFFF" font-size="36" font-weight="800">A reply follows an earlier task.</text>
      <text x="42" y="136" fill="#C8CBC9" font-size="23">CHECK / compare request, checkpoint, and reply.</text>
      <text x="42" y="178" fill="#FF4B4B" font-size="20" font-weight="800">STOP / TASKS DISAGREE</text>
    </g>
    <g transform="translate(56 550)">
      <rect width="788" height="210" fill="#F3F0E9" stroke="#11151A" stroke-width="3"/><rect width="14" height="210" fill="#D62828"/>
      <text x="42" y="43" fill="#11151A" font-size="20" font-weight="700" letter-spacing="1">02 / TARGET IDENTITY</text>
      <text x="42" y="91" fill="#11151A" font-size="36" font-weight="800">A branch label matches the wrong root.</text>
      <text x="42" y="136" fill="#4E5353" font-size="23">CHECK / compare root and branch label.</text>
      <text x="42" y="178" fill="#D62828" font-size="20" font-weight="800">STOP / ROOT DIFFERS</text>
    </g>
    <g transform="translate(56 790)">
      <rect width="788" height="210" fill="#11151A"/><rect width="14" height="210" fill="#D62828"/>
      <text x="42" y="43" fill="#F3F0E9" font-size="20" font-weight="700" letter-spacing="1">03 / EXECUTION RECEIPT</text>
      <text x="42" y="91" fill="#FFFFFF" font-size="36" font-weight="800">Tool-shaped text has no read-back.</text>
      <text x="42" y="136" fill="#C8CBC9" font-size="23">CHECK / compare the receipt with expected state.</text>
      <text x="42" y="178" fill="#FF4B4B" font-size="20" font-weight="800">STATUS / NOT RUN</text>
    </g>
    <g transform="translate(56 1030)">
      <rect width="788" height="210" fill="#F3F0E9" stroke="#11151A" stroke-width="3"/><rect width="14" height="210" fill="#D62828"/>
      <text x="42" y="43" fill="#11151A" font-size="20" font-weight="700" letter-spacing="1">04 / STRUCTURED ROUND TRIP</text>
      <text x="42" y="91" fill="#11151A" font-size="36" font-weight="800">Parser success can still change value.</text>
      <text x="42" y="136" fill="#4E5353" font-size="23">CHECK / compare exact fields before replay.</text>
      <text x="42" y="178" fill="#D62828" font-size="20" font-weight="800">STOP / FIELDS CHANGED</text>
    </g>
    <rect x="56" y="1270" width="788" height="116" fill="#D62828"/>
    <text x="84" y="1312" fill="#FFFFFF" font-size="20" font-weight="700" letter-spacing="1">NEXT DECISION</text>
    <text x="84" y="1355" fill="#FFFFFF" font-size="31" font-weight="800">Live behavior needs a platform adapter.</text>
    <text x="56" y="1424" fill="#4E5353" font-size="17">Fictional checks do not compare platforms or prove learning.</text>
  </g>
</svg>
