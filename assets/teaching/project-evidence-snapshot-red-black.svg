  <text x="44" y="212" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" letter-spacing="-2">NAME THE GAP.</text>
  <text x="46" y="252" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="17">current repository record / not a learning result / not a release claim</text>

