<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four evidence lenses</title>
  <desc id="desc">A red, black, and cream teaching board separating existence, correctness, readiness, and learning evidence.</desc>
  <defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern></defs>
  <rect width="1600" height="900" fill="#11151a"/><rect width="1600" height="900" fill="url(#grid)"/>
  <g fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif"><text x="80" y="86" font-size="20" font-weight="700" letter-spacing="5">PRYSAI LAB / REVIEW BOARD 003</text><text x="80" y="220" font-size="92" font-weight="800" letter-spacing="-4">FOUR LENSES</text><text x="80" y="310" font-size="92" font-weight="800" letter-spacing="-4" fill="#ff5b45">ONE CLAIM.</text><text x="84" y="372" font-size="22" fill="#c8cdd2" letter-spacing="1">A polished output can pass one lens and fail the next.</text></g>
  <g stroke="#f4f1ea" stroke-opacity=".3" fill="none"><path d="M80 520H1520"/><path d="M440 460V760"/><path d="M800 460V760"/><path d="M1160 460V760"/></g>
  <g font-family="Arial,Helvetica,sans-serif"><g fill="#ff5b45" font-size="18" font-weight="700" letter-spacing="3"><text x="86" y="500">01</text><text x="446" y="500">02</text><text x="806" y="500">03</text><text x="1166" y="500">04</text></g><g fill="#f4f1ea" font-size="32" font-weight="700"><text x="86" y="570">EXISTS</text><text x="446" y="570">CORRECT</text><text x="806" y="570">READY</text><text x="1166" y="570">LEARNED</text></g><g fill="#aeb6be" font-size="16"><text x="86" y="622">the file, page, or</text><text x="86" y="647">artifact is present</text><text x="446" y="622">the result works</text><text x="446" y="647">within the checked scope</text><text x="806" y="622">the intended reader</text><text x="806" y="647">can use it safely</text><text x="1166" y="622">a learner can explain,</text><text x="1166" y="647">operate, judge, and review</text></g></g>
  <path d="M90 800H1510" stroke="#ff5b45" stroke-width="5"/><text x="80" y="846" fill="#f4f1ea" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="2">DO NOT PROMOTE A LOWER LENS INTO A HIGHER CLAIM.</text>
</svg>
