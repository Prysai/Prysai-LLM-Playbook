<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Evidence maturity ladder</title>
  <desc id="desc">A five-stage ladder from a designed teaching contract to independent review. Each stage names what it supports, what it cannot support, and the evidence needed to move forward.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">EVIDENCE / MATURITY</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">DO NOT SKIP</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">THE EVIDENCE.</text>
  <text x="78" y="282" class="muted" font-size="22">A complete page is not the same as a practiced, transferred, reviewed method.</text>

  <line x1="120" y1="366" x2="120" y2="1268" class="line"/>
  <line x1="120" y1="452" x2="120" y2="508" class="redline"/>
  <line x1="120" y1="636" x2="120" y2="692" class="redline"/>
  <line x1="120" y1="820" x2="120" y2="876" class="redline"/>
  <line x1="120" y1="1004" x2="120" y2="1060" class="redline"/>

  <g transform="translate(78 320)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="96" y="0" width="688" height="148" fill="#111"/>
    <text x="124" y="42" class="mono" fill="#fff" font-size="19">DESIGNED</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">The contract is written.</text>
    <text x="124" y="111" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Supports: a clear intended method.</text>
    <text x="124" y="135" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Cannot support: a claim that anyone can use it.</text>
  </g>

  <g transform="translate(78 504)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="96" y="0" width="688" height="148" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="42" class="mono" font-size="19">RENDERED</text>
    <text x="124" y="78" class="ink" font-size="28" font-weight="900">The page and route work.</text>
    <text x="124" y="111" class="muted" font-size="17">Supports: a reader can reach the material.</text>
    <text x="124" y="135" class="muted" font-size="17">Cannot support: a reader understood or used it.</text>
  </g>

  <g transform="translate(78 688)">
    <circle cx="42" cy="54" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="42" y="64" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="96" y="0" width="688" height="148" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="42" class="mono" font-size="19">PRACTICED</text>
    <text x="124" y="78" class="ink" font-size="28" font-weight="900">A learner runs the task.</text>
    <text x="124" y="111" class="muted" font-size="17">Supports: an observed attempt and its result.</text>
    <text x="124" y="135" class="muted" font-size="17">Cannot support: reliable performance on a new task.</text>
  </g>

  <g transform="translate(78 872)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="96" y="0" width="688" height="148" fill="#d71920"/>
    <text x="124" y="42" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">TRANSFERRED</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">The method survives a changed task.</text>
    <text x="124" y="111" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Supports: evidence of reuse beyond the first example.</text>
    <text x="124" y="135" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Cannot support: a universal or permanent skill claim.</text>
  </g>

  <g transform="translate(78 1056)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="96" y="0" width="688" height="148" fill="#111"/>
    <text x="124" y="42" class="mono" fill="#fff" font-size="19">INDEPENDENTLY REVIEWED</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">Another person reruns and checks it.</text>
    <text x="124" y="111" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Supports: a corroborated result under a named scope.</text>
    <text x="124" y="135" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Cannot support: claims outside the reviewed conditions.</text>
  </g>

  <path d="M694 1258 790 1258 790 1174" class="redline"/>
  <rect x="78" y="1308" width="762" height="92" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1342" class="mono" font-size="17">NEXT EVIDENCE</text>
  <text x="102" y="1372" class="ink" font-size="19" font-weight="700">Name the stage you have, then collect only what moves it forward.</text>
</svg>
