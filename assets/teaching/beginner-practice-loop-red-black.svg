<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Beginner practice loop: attempt, correct, vary, receipt</title>
  <desc id="desc">A vertical editorial teaching board designed to remain readable at phone width. Four steps show an unaided attempt, one correction, a changed case, and a bounded receipt. It warns that one useful attempt is not mastery.</desc>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="48" y="46" width="804" height="10" fill="#171717"/>
  <text x="48" y="114" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="3">BEGINNER PRACTICE PACK / 01</text>
  <text x="48" y="200" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" letter-spacing="-2">TRY BEFORE YOU TRUST.</text>
  <text x="50" y="244" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="19">one capability / changed conditions / an honest receipt</text>

  <line x1="86" y1="308" x2="86" y2="1168" stroke="#d71920" stroke-width="8"/>

  <circle cx="86" cy="350" r="16" fill="#d71920"/>
  <rect x="132" y="292" width="720" height="202" fill="#171717"/>
  <text x="164" y="338" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700">01 / ATTEMPT</text>
  <text x="164" y="403" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900">Write your first answer.</text>
  <text x="164" y="446" fill="#deded8" font-family="Arial, Helvetica, sans-serif" font-size="28">Keep the learner's words and conditions.</text>
  <text x="164" y="477" fill="#deded8" font-family="Arial, Helvetica, sans-serif" font-size="28">Do not leak an answer before there is a try.</text>

  <circle cx="86" cy="572" r="16" fill="#d71920"/>
  <rect x="132" y="514" width="650" height="202" fill="#ffffff" stroke="#171717" stroke-width="4"/>
  <text x="164" y="560" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700">02 / CORRECT</text>
  <text x="164" y="625" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900">Fix one useful mistake.</text>
  <text x="164" y="668" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="28">Give one hint; learner writes the revision.</text>
  <text x="164" y="699" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="28">Keep before-and-after text as evidence.</text>

  <circle cx="86" cy="794" r="16" fill="#d71920"/>
  <rect x="132" y="736" width="720" height="202" fill="#ffffff" stroke="#171717" stroke-width="4"/>
  <text x="164" y="782" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700">03 / VARY</text>
  <text x="164" y="847" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900">Change the situation.</text>
  <text x="164" y="890" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="28">Same skill; change audience or detail.</text>
  <text x="164" y="921" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="28">Remove the hint. Record the next attempt.</text>

  <circle cx="86" cy="1016" r="16" fill="#d71920"/>
  <rect x="132" y="958" width="650" height="202" fill="#d71920"/>
  <text x="164" y="1004" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="21" font-weight="700">04 / RECEIPT</text>
  <text x="164" y="1069" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="900">Record the boundary.</text>
  <text x="164" y="1112" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28">Record what held, failed, and is unknown.</text>
  <text x="164" y="1143" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28">One record supports one scoped claim.</text>

  <rect x="48" y="1224" width="804" height="126" fill="#171717"/>
  <text x="80" y="1271" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="20" font-weight="700">STOP / CLAIM LIMIT</text>
  <text x="80" y="1320" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">ONE USEFUL ATTEMPT IS NOT MASTERY.</text>
  <text x="48" y="1382" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="14">PRYSAI LAB / ORIGINAL TEACHING BOARD / INSPECT THE RECEIPT</text>
</svg>
