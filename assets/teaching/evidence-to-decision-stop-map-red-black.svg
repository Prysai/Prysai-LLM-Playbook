<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Evidence to decision and stop</title>
  <desc id="desc">A five-step evidence chain: state the question, identify a source, inspect an observable result, choose a supported or candidate decision, and stop when the next proof is missing.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">EVIDENCE / DECISION PATH</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">LET THE RECORD</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">SET THE CLAIM.</text>
  <text x="78" y="282" class="muted" font-size="22">One question, one check, one bounded decision, one deliberate stop.</text>

  <line x1="128" y1="376" x2="128" y2="1250" class="line"/>
  <line x1="128" y1="450" x2="128" y2="530" class="redline"/>
  <line x1="128" y1="660" x2="128" y2="740" class="redline"/>
  <line x1="128" y1="870" x2="128" y2="950" class="redline"/>
  <line x1="128" y1="1080" x2="128" y2="1160" class="redline"/>

  <g transform="translate(78 330)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">QUESTION</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">Name the decision.</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">A broad topic is not yet a checkable question.</text>
  </g>

  <g transform="translate(78 540)">
    <circle cx="50" cy="48" r="34" fill="#d71920"/>
    <text x="50" y="58" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">SOURCE</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">Name the owner and scope.</text>
    <text x="140" y="105" class="muted" font-size="17">Keep URL, date, version, location, and the source's boundary.</text>
  </g>

  <g transform="translate(78 750)">
    <circle cx="50" cy="48" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="50" y="58" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">OBSERVE</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">Check what actually happened.</text>
    <text x="140" y="105" class="muted" font-size="17">Read the page, diff, test, log, or response; do not infer an event.</text>
  </g>

  <g transform="translate(78 960)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="112" y="0" width="650" height="120" fill="#d71920"/>
    <text x="140" y="44" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">DECIDE</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">Keep supported; mark candidate.</text>
    <text x="140" y="105" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Match the decision to what the record actually supports.</text>
  </g>

  <g transform="translate(78 1170)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">STOP</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">Stop when the next proof is missing.</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Record the smallest safe next check and preserve the unknown.</text>
  </g>

  <path d="M710 1294 792 1294 792 1216" class="redline"/>
  <rect x="78" y="1345" width="762" height="72" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1375" class="mono" font-size="17">BOUNDARY</text>
  <text x="230" y="1375" class="ink" font-size="19" font-weight="700">No observation? No expanded claim.</text>
  <text x="102" y="1403" class="muted" font-size="17">A stop is a useful result when it preserves the unknown.</text>
</svg>
