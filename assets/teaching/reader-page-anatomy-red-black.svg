<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">How to read one Prysai LLM Playbook page</title>
  <desc id="desc">A six-step page anatomy: orient to the problem, name the concept, take one bounded action, inspect evidence, keep the boundary visible, and transfer the method to a changed task.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">READER / PAGE ANATOMY</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">READ THE PAGE</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">AS A SMALL LOOP.</text>
  <text x="78" y="282" class="muted" font-size="22">A page gives you a problem, a move, a check, and a boundary.</text>

  <line x1="128" y1="376" x2="128" y2="1262" class="line"/>
  <line x1="128" y1="450" x2="128" y2="506" class="redline"/>
  <line x1="128" y1="656" x2="128" y2="712" class="redline"/>
  <line x1="128" y1="862" x2="128" y2="918" class="redline"/>
  <line x1="128" y1="1068" x2="128" y2="1124" class="redline"/>
  <line x1="128" y1="1274" x2="128" y2="1320" class="redline"/>

  <g transform="translate(78 330)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">ORIENT</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">What problem does this page solve?</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Start with the situation, not with a product name.</text>
  </g>

  <g transform="translate(78 536)">
    <circle cx="50" cy="48" r="34" fill="#d71920"/>
    <text x="50" y="58" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">NAME</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">Which concept changes your next move?</text>
    <text x="140" y="105" class="muted" font-size="17">Keep the key distinction visible before you act.</text>
  </g>

  <g transform="translate(78 742)">
    <circle cx="50" cy="48" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="50" y="58" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">ACT</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">Try one bounded, observable move.</text>
    <text x="140" y="105" class="muted" font-size="17">Use a harmless fixture; pause before an external effect.</text>
  </g>

  <g transform="translate(78 948)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="112" y="0" width="650" height="120" fill="#d71920"/>
    <text x="140" y="44" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">CHECK</text>
    <text x="140" y="77" fill="#fff" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="900">Read the result against evidence.</text>
    <text x="140" y="105" fill="#fff" font-size="17" font-family="Arial,Helvetica,sans-serif">Keep the claim no larger than the record.</text>
  </g>

  <g transform="translate(78 1154)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">BOUNDARY</text>
    <text x="140" y="77" fill="#fff" font-size="28" font-family="Arial,Helvetica,sans-serif" font-weight="900">Name what the page cannot prove.</text>
    <text x="140" y="105" fill="#c8c8c2" font-size="17" font-family="Arial,Helvetica,sans-serif">A route is guidance, not a runtime or learner result.</text>
  </g>

  <rect x="78" y="1340" width="762" height="74" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1371" class="mono" font-size="17">06 / TRANSFER</text>
  <text x="265" y="1371" class="ink" font-size="19" font-weight="700">Change the task, keep the method, and record the gap.</text>
  <text x="102" y="1399" class="muted" font-size="17">One familiar example is practice; a changed case is the next question.</text>
</svg>
