<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Model choice is a bounded comparison</title>
  <desc id="desc">A red, black, and cream editorial board. One fixed task contract passes through a complete working-condition comparison and the same smoke tests before a scoped decision is recorded.</desc>
  <rect width="1600" height="900" fill="#111315"/>
  <rect x="0" y="0" width="34" height="900" fill="#e43b2f"/>
  <path d="M76 128H1524M76 748H1524" stroke="#e8e2d7" stroke-opacity=".28"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="84" fill="#e43b2f" font-size="18" font-weight="700" letter-spacing="4">FIELD TEST / MODEL SELECTION / 06</text>
    <text x="76" y="214" fill="#f0ebe1" font-size="84" font-weight="800" letter-spacing="-4">A LABEL IS A HYPOTHESIS.</text>
    <text x="80" y="267" fill="#a9adb0" font-size="23">Keep the task fixed. Compare the complete working condition. Record only what the tests support.</text>

    <g transform="translate(76 350)">
      <rect width="280" height="310" fill="#f0ebe1"/>
      <rect width="280" height="14" fill="#e43b2f"/>
      <text x="24" y="58" fill="#e43b2f" font-size="15" font-weight="700" letter-spacing="3">01 / FIX</text>
      <text x="24" y="112" fill="#151719" font-size="31" font-weight="800">TASK</text>
      <text x="24" y="154" fill="#151719" font-size="31" font-weight="800">CONTRACT</text>
      <path d="M24 184H256" stroke="#151719" stroke-opacity=".25"/>
      <text x="24" y="220" fill="#43474a" font-size="17">goal / context / risk</text>
      <text x="24" y="250" fill="#43474a" font-size="17">acceptance / stop rule</text>
      <text x="24" y="286" fill="#151719" font-size="14" font-weight="700">SAME INPUT FOR EVERY RUN</text>
    </g>

    <g transform="translate(386 350)">
      <rect width="404" height="310" fill="#202326" stroke="#666a6d"/>
      <text x="24" y="58" fill="#e43b2f" font-size="15" font-weight="700" letter-spacing="3">02 / COMPARE</text>
      <text x="24" y="112" fill="#f0ebe1" font-size="31" font-weight="800">WHOLE CONDITION</text>
      <path d="M24 142H380" stroke="#f0ebe1" stroke-opacity=".22"/>
      <text x="24" y="183" fill="#c4c1ba" font-size="18">model + provider + surface</text>
      <text x="24" y="217" fill="#c4c1ba" font-size="18">context + tools + permissions</text>
      <rect x="24" y="252" width="356" height="34" fill="#111315"/>
      <text x="38" y="275" fill="#e43b2f" font-size="14" font-weight="700">MARK INCOMPARABLE CONDITIONS</text>
    </g>

    <g transform="translate(820 350)">
      <rect width="324" height="310" fill="#f0ebe1"/>
      <text x="24" y="58" fill="#e43b2f" font-size="15" font-weight="700" letter-spacing="3">03 / OBSERVE</text>
      <text x="24" y="112" fill="#151719" font-size="31" font-weight="800">THREE TESTS</text>
      <path d="M24 142H300" stroke="#151719" stroke-opacity=".25"/>
      <text x="24" y="182" fill="#151719" font-size="18" font-weight="700">A / routine success</text>
      <text x="24" y="218" fill="#151719" font-size="18" font-weight="700">B / tool boundary</text>
      <text x="24" y="254" fill="#151719" font-size="18" font-weight="700">C / recovery</text>
      <text x="24" y="288" fill="#565a5d" font-size="14">time / output / failure / proof</text>
    </g>

    <g transform="translate(1174 350)">
      <rect width="350" height="310" fill="#e43b2f"/>
      <text x="24" y="58" fill="#151719" font-size="15" font-weight="700" letter-spacing="3">04 / DECIDE</text>
      <text x="24" y="112" fill="#fff8ed" font-size="31" font-weight="800">FOR THIS TASK</text>
      <text x="24" y="151" fill="#fff8ed" font-size="31" font-weight="800">IN THIS SCOPE</text>
      <path d="M24 180H326" stroke="#151719" stroke-opacity=".42"/>
      <text x="24" y="220" fill="#151719" font-size="17" font-weight="700">record what passed</text>
      <text x="24" y="252" fill="#151719" font-size="17" font-weight="700">record what remains unknown</text>
      <text x="24" y="287" fill="#fff8ed" font-size="14" font-weight="700">NO UNIVERSAL RANKING</text>
    </g>

    <path d="M356 505H386M790 505H820M1144 505H1174" stroke="#e43b2f" stroke-width="6"/>
    <text x="76" y="797" fill="#e43b2f" font-size="15" font-weight="700" letter-spacing="3">EVIDENCE BOUNDARY</text>
    <text x="76" y="832" fill="#a9adb0" font-size="17">This board proves no universal cost, speed, stability, quality, or account-wide availability.</text>
    <text x="1524" y="832" text-anchor="end" fill="#74787b" font-size="14">PRYSAI LAB / PROJECT-OWNED TEACHING ASSET</text>
  </g>
</svg>
