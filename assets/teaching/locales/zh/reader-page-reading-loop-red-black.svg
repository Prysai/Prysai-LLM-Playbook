<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1200" role="img" aria-labelledby="title desc">
  <title id="title">从页面阅读到实践的闭环</title>
  <desc id="desc">六个编号阶段把页面的问题、概念、行动、证据、边界和迁移问题连起来。最后一步指向新的任务，而不是宣称已经完成。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0 0 9 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#171717; font-family:Arial,Helvetica,sans-serif; }
      .muted { fill:#575750; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .line { stroke:#d71920; stroke-width:5; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1200" fill="#f6f6f2"/>
  <rect x="42" y="34" width="816" height="10" fill="#171717"/>
  <text x="42" y="94" class="mono" font-size="18">读者／从页面到实践</text>
  <text x="42" y="158" class="ink" font-size="46" font-weight="900">读懂页面，</text>
  <text x="42" y="212" class="mono" font-size="46">然后做一个动作。</text>
  <text x="44" y="252" class="muted" font-size="18">每个阶段都有一个问题、一个小动作，以及一份要保留的记录。</text>

  <path d="M120 330V1020" class="line"/>
  <path d="M120 1020H748V330" class="line"/>

  <g transform="translate(78 292)">
    <circle cx="42" cy="42" r="34" fill="#171717"/><text x="42" y="51" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="24" font-weight="700" text-anchor="middle">01</text>
    <rect x="96" width="700" height="96" fill="#171717"/>
    <text x="124" y="34" class="mono" fill="#fff" font-size="15">问题</text><text x="124" y="69" fill="#fff" font-size="24" font-weight="900">这页要解决什么情境？</text>
  </g>
  <g transform="translate(78 418)">
    <circle cx="42" cy="42" r="34" fill="#d71920"/><text x="42" y="51" class="ink" font-family="Consolas,'Courier New',monospace" font-size="24" font-weight="700" text-anchor="middle">02</text>
    <rect x="96" width="700" height="96" fill="#fff" stroke="#171717" stroke-width="2"/>
    <text x="124" y="34" class="mono" font-size="15">概念</text><text x="124" y="69" class="ink" font-size="24" font-weight="900">哪个区分会改变下一步？</text>
  </g>
  <g transform="translate(78 544)">
    <circle cx="42" cy="42" r="34" fill="#fff" stroke="#171717" stroke-width="2"/><text x="42" y="51" class="mono" font-size="24" text-anchor="middle">03</text>
    <rect x="96" width="700" height="96" fill="#ffe5e9" stroke="#171717" stroke-width="2"/>
    <text x="124" y="34" class="mono" font-size="15">行动</text><text x="124" y="69" class="ink" font-size="24" font-weight="900">最小的安全动作是什么？</text>
  </g>
  <g transform="translate(78 670)">
    <circle cx="42" cy="42" r="34" fill="#171717"/><text x="42" y="51" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="24" font-weight="700" text-anchor="middle">04</text>
    <rect x="96" width="700" height="96" fill="#d71920"/>
    <text x="124" y="34" class="ink" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="700">证据</text><text x="124" y="69" fill="#fff" font-size="24" font-weight="900">哪份记录能让我检查结果？</text>
  </g>
  <g transform="translate(78 796)">
    <circle cx="42" cy="42" r="34" fill="#171717"/><text x="42" y="51" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="24" font-weight="700" text-anchor="middle">05</text>
    <rect x="96" width="700" height="96" fill="#171717"/>
    <text x="124" y="34" class="mono" fill="#fff" font-size="15">边界</text><text x="124" y="69" fill="#fff" font-size="24" font-weight="900">这页不能证明什么？</text>
  </g>
  <g transform="translate(78 922)">
    <circle cx="42" cy="42" r="34" fill="#d71920"/><text x="42" y="51" class="ink" font-family="Consolas,'Courier New',monospace" font-size="24" font-weight="700" text-anchor="middle">06</text>
    <rect x="96" width="700" height="96" fill="#fff" stroke="#171717" stroke-width="2"/>
    <text x="124" y="34" class="mono" font-size="15">迁移</text><text x="124" y="69" class="ink" font-size="24" font-weight="900">下一项任务会有什么变化？</text>
  </g>
  <rect x="42" y="1080" width="816" height="70" fill="#171717"/>
  <text x="66" y="1122" fill="#d71920" font-family="Consolas,'Courier New',monospace" font-size="15" font-weight="700">边界／路线不是结果</text>
</svg>
