<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">证据成熟度阶梯</title>
  <desc id="desc">这张五阶段阶梯图从已设计的教学契约走到独立复核。每一阶段都说明它能支持什么、不能支持什么，以及进入下一阶段需要保留的证据。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">证据／成熟度</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">不要跳过</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">证据。</text>
  <text x="78" y="282" class="muted" font-size="22">页面写完，不等于方法有人练过、迁移过或复核过。</text>

  <line x1="120" y1="366" x2="120" y2="1268" class="line"/>
  <line x1="120" y1="452" x2="120" y2="508" class="redline"/>
  <line x1="120" y1="636" x2="120" y2="692" class="redline"/>
  <line x1="120" y1="820" x2="120" y2="876" class="redline"/>
  <line x1="120" y1="1004" x2="120" y2="1060" class="redline"/>

  <g transform="translate(78 320)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="96" y="0" width="688" height="148" fill="#111"/>
    <text x="124" y="42" class="mono" fill="#fff" font-size="19">已设计</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">契约已经写下。</text>
    <text x="124" y="111" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">可以支持：一套清楚的预期方法。</text>
    <text x="124" y="135" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">不能支持：任何人都能使用它的结论。</text>
  </g>

  <g transform="translate(78 504)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="96" y="0" width="688" height="148" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="42" class="mono" font-size="19">已呈现</text>
    <text x="124" y="78" class="ink" font-size="28" font-weight="900">页面和路线可以使用。</text>
    <text x="124" y="111" class="muted" font-size="17">可以支持：读者能够到达材料。</text>
    <text x="124" y="135" class="muted" font-size="17">不能支持：读者已经理解或使用了材料。</text>
  </g>

  <g transform="translate(78 688)">
    <circle cx="42" cy="54" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="42" y="64" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="96" y="0" width="688" height="148" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="42" class="mono" font-size="19">已练习</text>
    <text x="124" y="78" class="ink" font-size="28" font-weight="900">学习者实际运行了任务。</text>
    <text x="124" y="111" class="muted" font-size="17">可以支持：一次可观察的尝试及其结果。</text>
    <text x="124" y="135" class="muted" font-size="17">不能支持：在新任务上的可靠表现。</text>
  </g>

  <g transform="translate(78 872)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="96" y="0" width="688" height="148" fill="#d71920"/>
    <text x="124" y="42" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">已迁移</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">方法经得起任务变化。</text>
    <text x="124" y="111" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">可以支持：超出首个示例的复用证据。</text>
    <text x="124" y="135" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">不能支持：普遍或永久有效的技能结论。</text>
  </g>

  <g transform="translate(78 1056)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="96" y="0" width="688" height="148" fill="#111"/>
    <text x="124" y="42" class="mono" fill="#fff" font-size="19">已独立复核</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">另一个人重新运行并检查。</text>
    <text x="124" y="111" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">可以支持：在明确范围内得到交叉验证的结果。</text>
    <text x="124" y="135" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">不能支持：超出已复核条件的结论。</text>
  </g>

  <path d="M694 1258 790 1258 790 1174" class="redline"/>
  <rect x="78" y="1308" width="762" height="92" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1342" class="mono" font-size="17">下一项证据</text>
  <text x="102" y="1372" class="ink" font-size="19" font-weight="700">说清你已有的阶段，只收集能推动它前进的证据。</text>
</svg>
