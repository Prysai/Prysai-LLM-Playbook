<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">LLM 基础核心：五个单元</title>
  <desc id="desc">这条五单元路线从安全尝试开始，让任务字段可见，命名可见失败，检查并修正结果，最后在未见任务上重复方法。</desc>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="42" y="34" width="816" height="10" fill="#171717"/>
  <text x="42" y="94" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">基础核心／五个单元</text>
  <text x="42" y="158" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">先学会方法</text>
  <text x="42" y="214" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">再选择平台</text>
  <text x="44" y="255" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="16">尝试／观察／命名／修正／迁移</text>

  <line x1="76" y1="330" x2="76" y2="1178" stroke="#d71920" stroke-width="8"/>
  <circle cx="76" cy="370" r="15" fill="#d71920"/>
  <circle cx="76" cy="540" r="15" fill="#d71920"/>
  <circle cx="76" cy="710" r="15" fill="#d71920"/>
  <circle cx="76" cy="880" r="15" fill="#d71920"/>
  <circle cx="76" cy="1050" r="15" fill="#d71920"/>

  <g transform="translate(122 318)">
    <rect width="734" height="124" fill="#171717"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01／尝试</text>
    <text x="24" y="80" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">先做一次安全尝试。</text>
    <text x="24" y="104" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="15">保留第一次回答，作为基线。</text>
  </g>
  <g transform="translate(122 488)">
    <rect width="734" height="124" fill="#ffffff" stroke="#171717" stroke-width="3"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02／框定</text>
    <text x="24" y="80" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">让任务字段可见。</text>
    <text x="24" y="104" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="15">目标、上下文、限制和回答形式。</text>
  </g>
  <g transform="translate(122 658)">
    <rect width="734" height="124" fill="#ffe5e9" stroke="#171717" stroke-width="3"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03／识别</text>
    <text x="24" y="80" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">说出可见的失败。</text>
    <text x="24" y="104" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="15">遗漏、编造、歧义或过度自信。</text>
  </g>
  <g transform="translate(122 828)">
    <rect width="734" height="124" fill="#ffffff" stroke="#171717" stroke-width="3"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04／修正</text>
    <text x="24" y="80" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">用证据检查并修正。</text>
    <text x="24" y="104" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="15">对照证据。只改变一个条件。</text>
  </g>
  <g transform="translate(122 998)">
    <rect width="734" height="124" fill="#d71920"/>
    <text x="24" y="35" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">05／迁移</text>
    <text x="24" y="80" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">在未见任务上重复方法。</text>
    <text x="24" y="104" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="15">新任务仍需单独检查。</text>
  </g>

  <rect x="42" y="1192" width="816" height="132" fill="#171717"/>
  <text x="66" y="1235" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">边界／候选路线</text>
  <text x="66" y="1278" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900">一次尝试不等于掌握。</text>
  <text x="66" y="1308" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="18">保留产物、限制和下一个问题。</text>
  <text x="42" y="1372" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB／原创教学图／先练习，再下结论</text>
</svg>
