<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">工作流通过可检查的出口逐步前进</title>
  <desc id="desc">这张七阶段教学图把工作流分成两条阅读带，每个阶段都标出出口证据。缺少出口时，路径会明确分支到停止与恢复。</desc>
  <rect width="1600" height="900" fill="#111315"/>
  <rect x="0" y="0" width="34" height="900" fill="#e43b2f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="76" fill="#e43b2f" font-size="18" font-weight="700" letter-spacing="4">工作流控制／07 个阶段／08</text>
    <text x="76" y="172" fill="#f0ebe1" font-size="66" font-weight="800" letter-spacing="-3">没有出口证据，就不能前进。</text>
    <text x="80" y="218" fill="#a9adb0" font-size="21">Agent 继续行动不等于检查点；可检查的产出才是。</text>
    <path d="M76 262H1524" stroke="#f0ebe1" stroke-opacity=".28"/>

    <g transform="translate(76 304)">
      <text x="0" y="-18" fill="#777b7e" font-size="14" font-weight="700" letter-spacing="3">A 区／框定与制作</text>
      <g>
        <rect width="334" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">01</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">定义</text>
        <text x="86" y="82" fill="#55595c" font-size="16">目标／范围／非目标</text>
        <path d="M86 108H310" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">出口／验收＋停止</text>
      </g>
      <g transform="translate(354)">
        <rect width="334" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">02</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">计划</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">切片／依赖／风险</text>
        <path d="M86 108H310" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">出口／有序检查点</text>
      </g>
      <g transform="translate(708)">
        <rect width="334" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">03</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">构建</text>
        <text x="86" y="82" fill="#55595c" font-size="16">有范围的差异／变更文件</text>
        <path d="M86 108H310" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">出口／可回退的变更</text>
      </g>
      <g transform="translate(1062)">
        <rect width="386" height="176" fill="#e43b2f"/>
        <rect width="62" height="176" fill="#151719"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">04</text>
        <text x="86" y="48" fill="#fff8ed" font-size="25" font-weight="800">验证</text>
        <text x="86" y="82" fill="#211719" font-size="16">命令／退出／运行时／限制</text>
        <path d="M86 108H362" stroke="#151719" stroke-opacity=".38"/>
        <text x="86" y="140" fill="#151719" font-size="13" font-weight="800">出口／与声明匹配的证明</text>
      </g>
    </g>

    <g transform="translate(76 574)">
      <text x="0" y="-18" fill="#777b7e" font-size="14" font-weight="700" letter-spacing="3">B 区／判断、交接、保持现状</text>
      <g>
        <rect width="406" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">05</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">审查</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">声明图／独立阅读／风险</text>
        <path d="M86 108H382" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">出口／接受、修改、拒绝</text>
      </g>
      <g transform="translate(426)">
        <rect width="406" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">06</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">交付</text>
        <text x="86" y="82" fill="#55595c" font-size="16">差异／日志／缺口／交接</text>
        <path d="M86 108H382" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">出口／有边界的回执</text>
      </g>
      <g transform="translate(852)">
        <rect width="354" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">07</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">维护</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">负责人／审查／回滚</text>
        <path d="M86 108H330" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">出口／标注下一次检查日期</text>
      </g>
      <g transform="translate(1236)">
        <path d="M0 0H212V176H0V118H26V58H0Z" fill="#e43b2f"/>
        <text x="28" y="45" fill="#151719" font-size="16" font-weight="800">缺少出口？</text>
        <text x="28" y="83" fill="#fff8ed" font-size="27" font-weight="800">停止</text>
        <text x="28" y="116" fill="#fff8ed" font-size="27" font-weight="800">恢复</text>
        <text x="28" y="151" fill="#151719" font-size="13" font-weight="700">保留最后状态</text>
      </g>
    </g>
    <path d="M1385 480V544H1418V574" fill="none" stroke="#e43b2f" stroke-width="5"/>
    <text x="76" y="836" fill="#797d80" font-size="14">教学模型／每个出口都有声明范围／单张截图不能证明工作流已经运行</text>
  </g>
</svg>
