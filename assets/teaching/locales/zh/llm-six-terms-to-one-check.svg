<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">六个 LLM 术语，一个可检查的结果</title>
  <desc id="desc">这张横向教学图分开令牌、上下文、上下文窗口、提示词、回答，以及工具或 Agent。红色边界提醒：回答只有和来源或验收规则核对过，才算可继续使用的候选结果。</desc>
  <rect width="1400" height="1000" fill="#f6f6f2"/>
  <rect x="48" y="36" width="1304" height="10" fill="#161616"/>
  <text x="48" y="92" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LLM 基础 / 一次请求</text>
  <text x="48" y="166" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-3">六个术语。</text>
  <text x="48" y="236" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-3">一次检查。</text>
  <text x="48" y="282" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="17">在相信回答前，先分开各层</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="354" width="196" height="290" fill="#161616"/>
    <text x="72" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / 单位</text>
    <text x="72" y="452" fill="#ffffff" font-size="32" font-weight="900">令牌</text>
    <text x="72" y="500" fill="#c4c4be" font-size="18">模型处理的</text>
    <text x="72" y="528" fill="#c4c4be" font-size="18">一小段</text>
    <text x="72" y="556" fill="#c4c4be" font-size="18">文字。</text>
    <text x="72" y="610" fill="#ffffff" font-size="16" font-weight="700">它不是事实。</text>

    <rect x="264" y="354" width="196" height="290" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="288" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / 材料</text>
    <text x="288" y="452" fill="#161616" font-size="32" font-weight="900">上下文</text>
    <text x="288" y="500" fill="#565650" font-size="18">本轮可用的</text>
    <text x="288" y="528" fill="#565650" font-size="18">上下文</text>
    <text x="288" y="556" fill="#565650" font-size="18">材料。</text>
    <text x="288" y="610" fill="#161616" font-size="16" font-weight="700">缺少的上下文仍是未知。</text>

    <rect x="480" y="354" width="196" height="290" fill="#d71920"/>
    <text x="504" y="392" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / 容量</text>
    <text x="504" y="452" fill="#ffffff" font-size="32" font-weight="900">窗口</text>
    <text x="504" y="500" fill="#ffffff" font-size="18">本轮能容纳的</text>
    <text x="504" y="528" fill="#ffffff" font-size="18">内容</text>
    <text x="504" y="556" fill="#ffffff" font-size="18">上限。</text>
    <text x="504" y="610" fill="#161616" font-size="16" font-weight="700">文字更多不一定更好。</text>

    <rect x="696" y="354" width="196" height="290" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="720" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / 方向</text>
    <text x="720" y="452" fill="#161616" font-size="32" font-weight="900">提示词</text>
    <text x="720" y="500" fill="#565650" font-size="18">你的目标、</text>
    <text x="720" y="528" fill="#565650" font-size="18">限制条件和</text>
    <text x="720" y="556" fill="#565650" font-size="18">输出形式。</text>
    <text x="720" y="610" fill="#161616" font-size="16" font-weight="700">提示词用于框定任务；不会授予访问权限。</text>

    <rect x="912" y="354" width="196" height="290" fill="#161616"/>
    <text x="936" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">05 / 候选</text>
    <text x="936" y="452" fill="#ffffff" font-size="32" font-weight="900">回答</text>
    <text x="936" y="500" fill="#c4c4be" font-size="18">模型提出的</text>
    <text x="936" y="528" fill="#c4c4be" font-size="18">待检查</text>
    <text x="936" y="556" fill="#c4c4be" font-size="18">文字。</text>
    <text x="936" y="610" fill="#ffffff" font-size="16" font-weight="700">流畅不等于证据。</text>

    <rect x="1128" y="354" width="224" height="290" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="1152" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">06 / 额外行动</text>
    <text x="1152" y="452" fill="#161616" font-size="32" font-weight="900">工具 / Agent</text>
    <text x="1152" y="500" fill="#565650" font-size="18">产品可能</text>
    <text x="1152" y="528" fill="#565650" font-size="18">读取或行动，</text>
    <text x="1152" y="556" fill="#565650" font-size="18">并拥有额外权限。</text>
    <text x="1152" y="610" fill="#161616" font-size="16" font-weight="700">执行仍需要许可。</text>
  </g>

  <g stroke="#d71920" stroke-width="5" fill="none">
    <path d="M244 500H258"/><path d="M460 500H474"/><path d="M676 500H690"/><path d="M892 500H906"/><path d="M1108 500H1122"/>
  </g>
  <g fill="#d71920">
    <path d="M258 500l-12-8v16z"/><path d="M474 500l-12-8v16z"/><path d="M690 500l-12-8v16z"/><path d="M906 500l-12-8v16z"/><path d="M1122 500l-12-8v16z"/>
  </g>

  <rect x="48" y="718" width="1304" height="176" fill="#d71920"/>
  <text x="76" y="760" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">检查 / 不要跳过这一步</text>
  <text x="76" y="812" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">回答 ≠ 行动 ≠ 已验证结果</text>
  <text x="76" y="852" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20">在声称完成前，把结果与来源、差异、测试、日志或验收规则对照。</text>
  <text x="48" y="950" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / 原创教学图 / 先分清各层</text>
</svg>
