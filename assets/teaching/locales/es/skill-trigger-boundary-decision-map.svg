<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Mapa de decisión sobre activación y límites de un Skill</title>
  <desc id="desc">Este mapa de cinco pasos describe un Skill reutilizable: nombra el trabajo, comprueba la entrada, verifica la autoridad, inspecciona la ejecución real y mantiene la afirmación dentro de la evidencia; si falta el encaje, cede y se detiene.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>

  <text x="78" y="112" class="mono" font-size="22">SKILL / LÍMITE</text>
  <text x="78" y="174" class="ink" font-size="46" font-weight="900">ACTIVAR NO ES</text>
  <text x="78" y="228" class="ink" font-size="46" font-weight="900">DAR PERMISO.</text>
  <text x="78" y="278" class="muted" font-size="21">Un método reutilizable demuestra su valor al ceder de forma segura cuando faltan encaje o evidencia.</text>

  <line x1="120" y1="356" x2="120" y2="1212" class="line"/>
  <line x1="120" y1="454" x2="120" y2="494" class="redline"/>
  <line x1="120" y1="624" x2="120" y2="664" class="redline"/>
  <line x1="120" y1="794" x2="120" y2="834" class="redline"/>
  <line x1="120" y1="964" x2="120" y2="1004" class="redline"/>

  <g transform="translate(78 320)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="96" y="0" width="688" height="134" fill="#111"/>
    <text x="124" y="38" class="mono" fill="#fff" font-size="18">ACTIVACIÓN</text>
    <text x="124" y="73" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900">Nombra un trabajo acotado.</text>
    <text x="124" y="106" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Un buen encaje dirige la tarea; un encaje débil cede.</text>
  </g>

  <g transform="translate(78 490)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="96" y="0" width="688" height="134" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="38" class="mono" font-size="18">FILTRO DE ENTRADA</text>
    <text x="124" y="73" class="ink" font-size="27" font-weight="900">Comprueba qué está realmente presente.</text>
    <text x="124" y="106" class="muted" font-size="17">Proporcionada / legible / inferida / desconocida · falta entrada → parar.</text>
  </g>

  <g transform="translate(78 660)">
    <circle cx="42" cy="54" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="42" y="64" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="96" y="0" width="688" height="134" fill="#d71920"/>
    <text x="124" y="38" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" letter-spacing="1px">AUTORIDAD</text>
    <text x="124" y="73" fill="#fff" font-size="27" font-weight="900">Separa capacidad y permiso.</text>
    <text x="124" y="106" fill="#fff" font-size="17">Permitido / prohibido / reversible / aprobación · pausa antes de un efecto externo.</text>
  </g>

  <g transform="translate(78 830)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="96" y="0" width="688" height="134" fill="#111"/>
    <text x="124" y="38" class="mono" fill="#fff" font-size="18">EJECUTAR / INSPECCIONAR</text>
    <text x="124" y="73" fill="#fff" font-size="27" font-weight="900">Busca el evento real.</text>
    <text x="124" y="106" fill="#c8c8c2" font-size="17">Registro · salida · diff · log · prueba · comprobación humana.</text>
  </g>

  <g transform="translate(78 1000)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="96" y="0" width="688" height="134" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="38" class="mono" font-size="18">LÍMITE DE EVIDENCIA</text>
    <text x="124" y="73" class="ink" font-size="27" font-weight="900">Afirma solo lo que respalda el registro.</text>
    <text x="124" y="106" class="muted" font-size="17">Positivo / límite / fallo / transferencia · candidate o parada si falta prueba.</text>
  </g>

  <path d="M216 1134 216 1190 310 1190" class="redline"/>
  <path d="M684 1134 684 1190 590 1190" class="redline"/>
  <rect x="78" y="1218" width="762" height="126" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1254" class="mono" font-size="17">DOS RESULTADOS HONESTOS</text>
  <text x="102" y="1291" class="ink" font-size="21" font-weight="700">DIRIGIR: se ven el encaje, la autoridad y la evidencia.</text>
  <text x="102" y="1324" class="ink" font-size="21" font-weight="700">CEDER: se nombra el hecho que falta y la afirmación sigue siendo pequeña.</text>

  <text x="78" y="1402" class="muted" font-size="16">El contrato de un Skill explica cuándo actuar, cuándo no hacerlo y qué puede inspeccionar otra persona.</text>
</svg>
