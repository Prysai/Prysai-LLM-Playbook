<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Recorrido de aprendizaje de Prysai LLM Playbook</title>
  <desc id="desc">Este recorrido de cuatro etapas completa primero las cinco unidades del LLM Foundation Core, convierte una primera tarea acotada en evidencia y una parada o decisión deliberada, y después ofrece prácticas opcionales con Codex, herramientas, Skills o equipos.</desc>
  <rect width="1200" height="1600" fill="#f6f6f2"/>
  <rect x="58" y="42" width="1084" height="10" fill="#171717"/>
  <text x="58" y="106" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" letter-spacing="4">PRYSAI LLM PLAYBOOK / RECORRIDO DE APRENDIZAJE</text>
  <text x="58" y="178" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="-3">APRENDE EL MÉTODO.</text>
  <text x="58" y="244" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="900" letter-spacing="-3">DESPUÉS ELIGE LA PLATAFORMA.</text>
  <text x="60" y="286" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="17">fundamentos / primera tarea / evidencia / práctica opcional</text>

  <line x1="90" y1="360" x2="90" y2="1300" stroke="#d71920" stroke-width="9"/>
  <circle cx="90" cy="425" r="17" fill="#d71920"/>
  <circle cx="90" cy="690" r="17" fill="#d71920"/>
  <circle cx="90" cy="955" r="17" fill="#d71920"/>
  <circle cx="90" cy="1220" r="17" fill="#d71920"/>

  <g transform="translate(140 360)">
    <rect width="1000" height="198" fill="#171717"/>
    <text x="28" y="42" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700">01 / LLM FOUNDATION CORE</text>
    <text x="28" y="91" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900">Entender → iniciar → identificar → reparar → transferir</text>
    <text x="28" y="134" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="18">Las cinco unidades hacen explícitos el modelo, la petición, los fallos visibles, la comprobación y la tarea nueva.</text>
    <text x="28" y="170" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="16">Empieza aquí, antes de Codex, las herramientas, los Agents o los Skills.</text>
  </g>

  <g transform="translate(140 625)">
    <rect width="1000" height="198" fill="#ffffff" stroke="#171717" stroke-width="3"/>
    <text x="28" y="42" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700">02 / PRIMERA TAREA ACOTADA</text>
    <text x="28" y="91" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900">Nombra el resultado antes de pedirlo.</text>
    <text x="28" y="134" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="18">Indica el objetivo, el contexto disponible, la ayuda permitida, los límites, la forma de respuesta y cuándo parar.</text>
    <text x="28" y="170" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="16">Usa una tarea ficticia o desechable; conserva la primera petición y la primera respuesta.</text>
  </g>

  <g transform="translate(140 890)">
    <rect width="1000" height="198" fill="#ffe5e9" stroke="#171717" stroke-width="3"/>
    <text x="28" y="42" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700">03 / CICLO DE EVIDENCIA</text>
    <text x="28" y="91" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900">Observa qué cambió y conserva lo que aún no sabes.</text>
    <text x="28" y="134" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="18">Compara la respuesta o el diff con una fuente, una prueba, un registro o un criterio de aceptación.</text>
    <text x="28" y="170" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="16">Continúa solo si existe la siguiente prueba; si no, registra la parada segura más pequeña.</text>
  </g>

  <g transform="translate(140 1155)">
    <rect width="1000" height="198" fill="#d71920"/>
    <text x="28" y="42" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700">04 / RECORRIDOS OPCIONALES</text>
    <text x="28" y="91" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900">Elige la siguiente capa útil más pequeña.</text>
    <text x="28" y="134" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="18">Codex · herramientas · Skills · Agents · investigación · ingeniería · práctica de equipo</text>
    <text x="28" y="170" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="16">Cada recorrido conserva sus propias fuentes, permisos, evidencias, fallos y límites.</text>
  </g>

  <rect x="58" y="1410" width="1084" height="126" fill="#171717"/>
  <text x="84" y="1452" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700">LÍMITE / RECORRIDO CANDIDATO</text>
  <text x="84" y="1492" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900">EL MAPA MUESTRA EL ORDEN, NO EL DOMINIO.</text>
  <text x="84" y="1518" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="16">Conserva el artefacto, la evidencia, el límite y la siguiente pregunta.</text>
  <text x="58" y="1574" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / TABLERO ORIGINAL / PRACTICA ANTES DE AFIRMAR</text>
</svg>
