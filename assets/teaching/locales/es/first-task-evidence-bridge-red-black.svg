<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">De la primera tarea a una evidencia utilizable</title>
  <desc id="desc">Este puente de cinco pasos va de elegir un resultado observable, pasando por un límite seguro y un intento real, hasta una comprobación concreta y un registro de entrega. El último panel recuerda que, sin registro, la afirmación debe ser más pequeña.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">PRIMERA TAREA / PUENTE DE EVIDENCIA</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">HAZ COMPROBABLE</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">UNA TAREA PEQUEÑA.</text>
  <text x="78" y="282" class="muted" font-size="22">Un resultado solo sirve cuando otra persona puede inspeccionar el recorrido.</text>

  <line x1="128" y1="376" x2="128" y2="1250" class="line"/>
  <line x1="128" y1="450" x2="128" y2="530" class="redline"/>
  <line x1="128" y1="660" x2="128" y2="740" class="redline"/>
  <line x1="128" y1="870" x2="128" y2="950" class="redline"/>
  <line x1="128" y1="1080" x2="128" y2="1160" class="redline"/>

  <g transform="translate(78 330)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">RESULTADO</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">ELIGE UN RESULTADO OBSERVABLE.</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">«Ayúdame con esto» todavía no es un resultado comprobable.</text>
  </g>

  <g transform="translate(78 540)">
    <circle cx="50" cy="48" r="34" fill="#d71920"/>
    <text x="50" y="58" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">LÍMITE</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">MANTÉN VISIBLES LA ENTRADA Y LA PARADA.</text>
    <text x="140" y="105" class="muted" font-size="17">Usa un juego de prueba seguro; indica qué queda fuera y cuándo parar.</text>
  </g>

  <g transform="translate(78 750)">
    <circle cx="50" cy="48" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="50" y="58" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">INTENTO</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">GUARDA LO QUE OCURRIÓ DE VERDAD.</text>
    <text x="140" y="105" class="muted" font-size="17">Conserva la entrada, la respuesta, la edición, la salida o los datos devueltos; no solo el plan.</text>
  </g>

  <g transform="translate(78 960)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="112" y="0" width="650" height="120" fill="#d71920"/>
    <text x="140" y="44" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">COMPROBAR</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">COMPARA UN DETALLE IMPORTANTE.</text>
    <text x="140" y="105" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Usa una fuente, un diff, una prueba, un registro o un criterio de aceptación.</text>
  </g>

  <g transform="translate(78 1170)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">REGISTRO</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">ENTREGA RESULTADO, LÍMITE Y SIGUIENTE PASO.</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Un registro breve permite inspeccionar el mismo intento.</text>
  </g>

  <rect x="78" y="1345" width="762" height="72" fill="#d71920"/>
  <text x="102" y="1375" class="mono" fill="#111" font-size="17">LÍMITE</text>
  <text x="230" y="1375" class="ink" fill="#111" font-size="19" font-weight="700">¿NO HAY REGISTRO? NO AMPLÍES LA AFIRMACIÓN.</text>
  <text x="102" y="1403" class="muted" font-size="17">Una parada pequeña es mejor que una historia segura de sí misma sin registro.</text>
</svg>
