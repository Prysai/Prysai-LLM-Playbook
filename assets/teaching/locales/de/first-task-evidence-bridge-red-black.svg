<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Von der ersten Aufgabe zum nutzbaren Beleg</title>
  <desc id="desc">Diese Brücke mit fünf Schritten führt von einem beobachtbaren Ergebnis über eine sichere Grenze und einen tatsächlichen Versuch zu einer gezielten Prüfung und einem Übergabeprotokoll. Das letzte Feld sagt: Ohne Protokoll bleibt die Aussage klein.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">ERSTE AUFGABE / BELEG-BRÜCKE</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">MACH EINE KLEINE</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">AUFGABE PRÜFBAR.</text>
  <text x="78" y="282" class="muted" font-size="22">Ein Ergebnis ist erst nützlich, wenn eine andere Person den Weg prüfen kann.</text>

  <line x1="128" y1="376" x2="128" y2="1250" class="line"/>
  <line x1="128" y1="450" x2="128" y2="530" class="redline"/>
  <line x1="128" y1="660" x2="128" y2="740" class="redline"/>
  <line x1="128" y1="870" x2="128" y2="950" class="redline"/>
  <line x1="128" y1="1080" x2="128" y2="1160" class="redline"/>

  <g transform="translate(78 330)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">ERGEBNIS</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">WÄHLE EIN BEOBACHTBARES ERGEBNIS.</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">„Hilf mir damit“ ist noch kein prüfbares Ergebnis.</text>
  </g>

  <g transform="translate(78 540)">
    <circle cx="50" cy="48" r="34" fill="#d71920"/>
    <text x="50" y="58" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">GRENZE</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">HALTE EINGABE UND STOPP SICHTBAR.</text>
    <text x="140" y="105" class="muted" font-size="17">Nutze ein sicheres Testmaterial; nenne, was draußen bleibt und wann du pausierst.</text>
  </g>

  <g transform="translate(78 750)">
    <circle cx="50" cy="48" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="50" y="58" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">VERSUCH</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">SICHERE, WAS TATSÄCHLICH PASSIERT IST.</text>
    <text x="140" y="105" class="muted" font-size="17">Bewahre Eingabe, Antwort, Bearbeitung, Ende oder zurückgegebene Daten auf – nicht nur den Plan.</text>
  </g>

  <g transform="translate(78 960)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="112" y="0" width="650" height="120" fill="#d71920"/>
    <text x="140" y="44" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">PRÜFEN</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">VERGLEICHE EIN WICHTIGES DETAIL.</text>
    <text x="140" y="105" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Nutze Quelle, Diff, Test, Log oder Abnahmeregel.</text>
  </g>

  <g transform="translate(78 1170)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">PROTOKOLL</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">ÜBERGIB ERGEBNIS, GRENZE UND NÄCHSTEN SCHRITT.</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Ein kurzes Protokoll lässt andere denselben Versuch prüfen.</text>
  </g>

  <rect x="78" y="1345" width="762" height="72" fill="#d71920"/>
  <text x="102" y="1375" class="mono" fill="#111" font-size="17">GRENZE</text>
  <text x="230" y="1375" class="ink" fill="#111" font-size="19" font-weight="700">KEIN PROTOKOLL? KEINE GRÖSSERE AUSSAGE.</text>
  <text x="102" y="1403" class="muted" font-size="17">Ein kleiner Stopp ist besser als eine selbstsichere Geschichte ohne Protokoll.</text>
</svg>
