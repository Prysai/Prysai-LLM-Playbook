<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Leiter der Belegreife</title>
  <desc id="desc">Diese Leiter mit fünf Stufen führt vom entworfenen Lehrvertrag bis zur unabhängigen Prüfung. Jede Stufe nennt, was sie trägt, was sie nicht trägt und welcher Beleg den nächsten Schritt ermöglicht.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">BELEG / REIFE</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">NICHT ÜBERSPRINGEN</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">DIE BELEGE.</text>
  <text x="78" y="282" class="muted" font-size="22" textLength="762" lengthAdjust="spacingAndGlyphs">Eine fertige Seite ist nicht dasselbe wie eine geübte, übertragene und geprüfte Methode.</text>

  <line x1="120" y1="366" x2="120" y2="1268" class="line"/>
  <line x1="120" y1="452" x2="120" y2="508" class="redline"/>
  <line x1="120" y1="636" x2="120" y2="692" class="redline"/>
  <line x1="120" y1="820" x2="120" y2="876" class="redline"/>
  <line x1="120" y1="1004" x2="120" y2="1060" class="redline"/>

  <g transform="translate(78 320)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="96" y="0" width="688" height="148" fill="#111"/>
    <text x="124" y="42" class="mono" fill="#fff" font-size="19">ENTWORFEN</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">Der Vertrag ist geschrieben.</text>
    <text x="124" y="111" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Trägt: eine klare beabsichtigte Methode.</text>
    <text x="124" y="135" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Trägt nicht: die Aussage, dass jeder sie nutzen kann.</text>
  </g>

  <g transform="translate(78 504)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="96" y="0" width="688" height="148" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="42" class="mono" font-size="19">DARGESTELLT</text>
    <text x="124" y="78" class="ink" font-size="28" font-weight="900">Seite und Route funktionieren.</text>
    <text x="124" y="111" class="muted" font-size="17">Trägt: Leser können das Material erreichen.</text>
    <text x="124" y="135" class="muted" font-size="17">Trägt nicht: dass Leser es verstanden oder genutzt haben.</text>
  </g>

  <g transform="translate(78 688)">
    <circle cx="42" cy="54" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="42" y="64" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="96" y="0" width="688" height="148" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="42" class="mono" font-size="19">GEÜBT</text>
    <text x="124" y="78" class="ink" font-size="28" font-weight="900" textLength="646" lengthAdjust="spacingAndGlyphs">Eine lernende Person führt die Aufgabe aus.</text>
    <text x="124" y="111" class="muted" font-size="17">Trägt: einen beobachteten Versuch und sein Ergebnis.</text>
    <text x="124" y="135" class="muted" font-size="17">Trägt nicht: zuverlässige Leistung bei einer neuen Aufgabe.</text>
  </g>

  <g transform="translate(78 872)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="96" y="0" width="688" height="148" fill="#d71920"/>
    <text x="124" y="42" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">ÜBERTRAGEN</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" textLength="646" lengthAdjust="spacingAndGlyphs">Die Methode hält eine veränderte Aufgabe aus.</text>
    <text x="124" y="111" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Trägt: Belege für Wiederverwendung über das erste Beispiel hinaus.</text>
    <text x="124" y="135" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Trägt nicht: eine universelle oder dauerhafte Kompetenzbehauptung.</text>
  </g>

  <g transform="translate(78 1056)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="96" y="0" width="688" height="148" fill="#111"/>
    <text x="124" y="42" class="mono" fill="#fff" font-size="19">UNABHÄNGIG GEPRÜFT</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" textLength="648" lengthAdjust="spacingAndGlyphs">Eine andere Person führt sie erneut aus und prüft sie.</text>
    <text x="124" y="111" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Trägt: ein bestätigtes Ergebnis innerhalb eines benannten Umfangs.</text>
    <text x="124" y="135" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Trägt nicht: Aussagen außerhalb der geprüften Bedingungen.</text>
  </g>

  <path d="M694 1258 790 1258 790 1174" class="redline"/>
  <rect x="78" y="1308" width="762" height="92" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1342" class="mono" font-size="17">NÄCHSTER BELEG</text>
  <text x="102" y="1372" class="ink" font-size="19" font-weight="700">Nenne die vorhandene Stufe und sammle nur, was sie weiterbringt.</text>
</svg>
