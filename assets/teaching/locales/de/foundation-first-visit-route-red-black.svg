<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Erster Besuch: eine prüfbare LLM-Aufgabe beginnen</title>
  <desc id="desc">Diese Lehrtafel mit fünf Schritten führt durch den ersten Besuch: Wähle ein Ziel, öffne den LLM Foundation Core, mache einen sicheren Versuch, lies das Protokoll und gehe weiter oder halte mit sichtbarer Ungewissheit an.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1400" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1316" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">START / ERSTER BESUCH</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">EIN SICHERER WEG.</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">VOR DEM KATALOG.</text>
  <text x="78" y="282" class="muted" font-size="22">Wähle ein Ziel, mache einen kleinen Versuch und bewahre das Protokoll auf.</text>

  <line x1="128" y1="362" x2="128" y2="1154" class="line"/>
  <line x1="128" y1="480" x2="128" y2="538" class="redline"/>
  <line x1="128" y1="642" x2="128" y2="700" class="redline"/>
  <line x1="128" y1="804" x2="128" y2="862" class="redline"/>
  <line x1="128" y1="966" x2="128" y2="1024" class="redline"/>

  <g transform="translate(78 320)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="112" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">WÄHLEN</text>
    <text x="140" y="78" fill="#fff" font-size="28" font-weight="900">Benenne ein Ergebnis.</text>
    <text x="140" y="106" fill="#c8c8c2" font-size="17">Verstehe, übe oder prüfe genau eine kleine Sache.</text>
  </g>

  <g transform="translate(78 482)">
    <circle cx="50" cy="48" r="34" fill="#d71920"/>
    <text x="50" y="58" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="112" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">ÖFFNEN</text>
    <text x="140" y="78" class="ink" font-size="28" font-weight="900">Beginne mit dem LLM Foundation Core.</text>
    <text x="140" y="106" class="muted" font-size="17">Lerne die Modellgrenze kennen, bevor du eine Plattform wählst.</text>
  </g>

  <g transform="translate(78 644)">
    <circle cx="50" cy="48" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="50" y="58" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="112" width="650" height="120" fill="#ffe5e9" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">VERSUCH</text>
    <text x="140" y="78" class="ink" font-size="28" font-weight="900">Mache einen sicheren Versuch.</text>
    <text x="140" y="106" class="muted" font-size="17">Nutze fiktives oder lokales, nicht sensibles Material.</text>
  </g>

  <g transform="translate(78 806)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="112" width="650" height="120" fill="#d71920"/>
    <text x="140" y="44" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700">PRÜFEN</text>
    <text x="140" y="78" fill="#fff" font-size="28" font-weight="900">Lies das tatsächliche Protokoll.</text>
    <text x="140" y="106" fill="#fff" font-size="17">Vergleiche Antwort, Diff, Quelle, Test oder Log.</text>
  </g>

  <g transform="translate(78 968)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="112" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">WEITER / STOPP</text>
    <text x="140" y="78" fill="#fff" font-size="28" font-weight="900">Wähle den nächsten begrenzten Weg.</text>
    <text x="140" y="106" fill="#c8c8c2" font-size="17">Fehlt der nächste Beleg, lass die Ungewissheit sichtbar.</text>
  </g>

  <rect x="78" y="1160" width="762" height="116" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1200" class="mono" font-size="17">GRENZE</text>
  <text x="102" y="1236" class="ink" font-size="21" font-weight="700">Der Katalog bietet Optionen; er ist nicht die erste Aufgabe.</text>
  <text x="102" y="1264" class="muted" font-size="17">Dieser Weg orientiert Besucher; er beweist weder Lernen noch Beherrschung.</text>
  <text x="78" y="1320" class="muted" font-size="17">PRYSAI LAB / ORIGINALE LEHRGRAFIK / KLEIN ANFANGEN, DAS WICHTIGE PRÜFEN</text>
</svg>
