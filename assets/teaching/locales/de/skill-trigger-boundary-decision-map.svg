<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Entscheidungskarte für Skill-Trigger und Grenzen</title>
  <desc id="desc">Diese Karte mit fünf Schritten beschreibt einen wiederverwendbaren Skill: Aufgabe benennen, Eingabe prüfen, Berechtigung bestätigen, den tatsächlichen Lauf inspizieren und die Aussage auf den Beleg begrenzen; fehlt die Passung, gibt der Skill ab und stoppt.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>

  <text x="78" y="112" class="mono" font-size="22">SKILL / GRENZE</text>
  <text x="78" y="174" class="ink" font-size="46" font-weight="900">TRIGGER IST KEINE</text>
  <text x="78" y="228" class="ink" font-size="46" font-weight="900">BERECHTIGUNG.</text>
  <text x="78" y="278" class="muted" font-size="21">Eine wiederverwendbare Methode verdient ihren Platz, wenn sie bei fehlender Passung oder Evidenz sicher abgibt.</text>

  <line x1="120" y1="356" x2="120" y2="1212" class="line"/>
  <line x1="120" y1="454" x2="120" y2="494" class="redline"/>
  <line x1="120" y1="624" x2="120" y2="664" class="redline"/>
  <line x1="120" y1="794" x2="120" y2="834" class="redline"/>
  <line x1="120" y1="964" x2="120" y2="1004" class="redline"/>

  <g transform="translate(78 320)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="96" y="0" width="688" height="134" fill="#111"/>
    <text x="124" y="38" class="mono" fill="#fff" font-size="18">AUSLÖSER</text>
    <text x="124" y="73" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900">Benenne die eng begrenzte Aufgabe.</text>
    <text x="124" y="106" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Gute Passung leitet die Aufgabe weiter; schwache Passung gibt ab.</text>
  </g>

  <g transform="translate(78 490)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="96" y="0" width="688" height="134" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="38" class="mono" font-size="18">EINGABEPRÜFUNG</text>
    <text x="124" y="73" class="ink" font-size="27" font-weight="900">Prüfe, was tatsächlich vorhanden ist.</text>
    <text x="124" y="106" class="muted" font-size="17">Gegeben / lesbar / erschlossen / unbekannt · fehlende Eingabe → Stopp.</text>
  </g>

  <g transform="translate(78 660)">
    <circle cx="42" cy="54" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="42" y="64" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="96" y="0" width="688" height="134" fill="#d71920"/>
    <text x="124" y="38" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" letter-spacing="1px">BERECHTIGUNG</text>
    <text x="124" y="73" fill="#fff" font-size="27" font-weight="900">Trenne Fähigkeit und Erlaubnis.</text>
    <text x="124" y="106" fill="#fff" font-size="17">Erlaubt / verboten / umkehrbar / Freigabe · vor Nebenwirkungen pausieren.</text>
  </g>

  <g transform="translate(78 830)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="96" y="0" width="688" height="134" fill="#111"/>
    <text x="124" y="38" class="mono" fill="#fff" font-size="18">LAUF / PRÜFEN</text>
    <text x="124" y="73" fill="#fff" font-size="27" font-weight="900">Suche das tatsächliche Ereignis.</text>
    <text x="124" y="106" fill="#c8c8c2" font-size="17">Protokoll · Ausgabe · Diff · Log · Test · menschlicher Rückcheck.</text>
  </g>

  <g transform="translate(78 1000)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="96" y="0" width="688" height="134" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="38" class="mono" font-size="18">BELEG-GRENZE</text>
    <text x="124" y="73" class="ink" font-size="27" font-weight="900">Behaupte nur, was das Protokoll trägt.</text>
    <text x="124" y="106" class="muted" font-size="17">Positiv / Grenze / Fehler / Transfer · candidate oder Stopp, wenn der Beleg fehlt.</text>
  </g>

  <path d="M216 1134 216 1190 310 1190" class="redline"/>
  <path d="M684 1134 684 1190 590 1190" class="redline"/>
  <rect x="78" y="1218" width="762" height="126" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1254" class="mono" font-size="17">ZWEI EHRLICHE ERGEBNISSE</text>
  <text x="102" y="1291" class="ink" font-size="21" font-weight="700">WEITERLEITEN: Passung, Berechtigung und Beleg sind sichtbar.</text>
  <text x="102" y="1324" class="ink" font-size="21" font-weight="700">ABGEBEN: Die fehlende Tatsache ist benannt und die Aussage bleibt klein.</text>

  <text x="78" y="1402" class="muted" font-size="16">Ein Skill-Vertrag erklärt, wann gehandelt wird, wann nicht und was eine andere Person prüfen kann.</text>
</svg>
