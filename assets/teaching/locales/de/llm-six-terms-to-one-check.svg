<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Sechs LLM-Begriffe, ein prüfbares Ergebnis</title>
  <desc id="desc">Die waagerechte Lehrgrafik trennt Token, Kontext, Kontextfenster, Prompt, Antwort und Tool oder Agent. Die rote Grenze sagt: Eine Antwort bleibt Kandidat, bis eine Person sie mit Quelle oder Abnahmeregel vergleicht.</desc>
  <rect width="1400" height="1000" fill="#f6f6f2"/>
  <rect x="48" y="36" width="1304" height="10" fill="#161616"/>
  <text x="48" y="92" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LLM-GRUNDLAGEN / EINE ANFRAGE</text>
  <text x="48" y="166" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-3">SECHS BEGRIFFE.</text>
  <text x="48" y="236" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="900" letter-spacing="-3">EINE PRÜFUNG.</text>
  <text x="48" y="282" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="17">Trenne die Ebenen, bevor du der Antwort vertraust</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="48" y="354" width="196" height="290" fill="#161616"/>
    <text x="72" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / EINHEIT</text>
    <text x="72" y="452" fill="#ffffff" font-size="32" font-weight="900">TOKEN</text>
    <text x="72" y="500" fill="#c4c4be" font-size="18">Ein kleines</text>
    <text x="72" y="528" fill="#c4c4be" font-size="18">Textstück, das das</text>
    <text x="72" y="556" fill="#c4c4be" font-size="18">Modell verarbeitet.</text>
    <text x="72" y="610" fill="#ffffff" font-size="16" font-weight="700">Es ist keine Tatsache.</text>

    <rect x="264" y="354" width="196" height="290" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="288" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / MATERIAL</text>
    <text x="288" y="452" fill="#161616" font-size="32" font-weight="900">KONTEXT</text>
    <text x="288" y="500" fill="#565650" font-size="18">Material, das</text>
    <text x="288" y="528" fill="#565650" font-size="18">in diesem</text>
    <text x="288" y="556" fill="#565650" font-size="18">Durchlauf verfügbar ist.</text>
    <text x="288" y="610" fill="#161616" font-size="16" font-weight="700">Fehlender Kontext bleibt unbekannt.</text>

    <rect x="480" y="354" width="196" height="290" fill="#d71920"/>
    <text x="504" y="392" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / KAPAZITÄT</text>
    <text x="504" y="452" fill="#ffffff" font-size="32" font-weight="900">FENSTER</text>
    <text x="504" y="500" fill="#ffffff" font-size="18">Die Grenze für</text>
    <text x="504" y="528" fill="#ffffff" font-size="18">das, was in</text>
    <text x="504" y="556" fill="#ffffff" font-size="18">den Durchlauf passt.</text>
    <text x="504" y="610" fill="#161616" font-size="16" font-weight="700">Mehr Text ist nicht immer besser.</text>

    <rect x="696" y="354" width="196" height="290" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="720" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / RICHTUNG</text>
    <text x="720" y="452" fill="#161616" font-size="32" font-weight="900">PROMPT</text>
    <text x="720" y="500" fill="#565650" font-size="18">Dein Ziel,</text>
    <text x="720" y="528" fill="#565650" font-size="18">deine Grenzen</text>
    <text x="720" y="556" fill="#565650" font-size="18">und das Ausgabeformat.</text>
    <text x="720" y="610" fill="#161616" font-size="16" font-weight="700">Ein Prompt steckt den Rahmen ab; er erteilt keinen Zugriff.</text>

    <rect x="912" y="354" width="196" height="290" fill="#161616"/>
    <text x="936" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">05 / KANDIDAT</text>
    <text x="936" y="452" fill="#ffffff" font-size="32" font-weight="900">ANTWORT</text>
    <text x="936" y="500" fill="#c4c4be" font-size="18">Vom Modell</text>
    <text x="936" y="528" fill="#c4c4be" font-size="18">vorgeschlagener</text>
    <text x="936" y="556" fill="#c4c4be" font-size="18">Text zur Prüfung.</text>
    <text x="936" y="610" fill="#ffffff" font-size="16" font-weight="700">Flüssige Sprache ist kein Beleg.</text>

    <rect x="1128" y="354" width="224" height="290" fill="#ffffff" stroke="#161616" stroke-width="3"/>
    <text x="1152" y="392" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">06 / ZUSATZAKTION</text>
    <text x="1152" y="452" fill="#161616" font-size="32" font-weight="900">TOOL / AGENT</text>
    <text x="1152" y="500" fill="#565650" font-size="18">Ein Produkt kann</text>
    <text x="1152" y="528" fill="#565650" font-size="18">mit zusätzlicher</text>
    <text x="1152" y="556" fill="#565650" font-size="18">Berechtigung lesen oder handeln.</text>
    <text x="1152" y="610" fill="#161616" font-size="16" font-weight="700">Auch die Ausführung braucht eine Erlaubnis.</text>
  </g>

  <g stroke="#d71920" stroke-width="5" fill="none">
    <path d="M244 500H258"/><path d="M460 500H474"/><path d="M676 500H690"/><path d="M892 500H906"/><path d="M1108 500H1122"/>
  </g>
  <g fill="#d71920">
    <path d="M258 500l-12-8v16z"/><path d="M474 500l-12-8v16z"/><path d="M690 500l-12-8v16z"/><path d="M906 500l-12-8v16z"/><path d="M1122 500l-12-8v16z"/>
  </g>

  <rect x="48" y="718" width="1304" height="176" fill="#d71920"/>
  <text x="76" y="760" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">PRÜFUNG / DIESE ZEILE NICHT ÜBERSPRINGEN</text>
  <text x="76" y="812" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="900">ANTWORT ≠ AKTION ≠ VERIFIZIERTES ERGEBNIS</text>
  <text x="76" y="852" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20">Vergleiche das Ergebnis mit Quelle, Diff, Test, Log oder Abnahmeregel, bevor du die Aufgabe als erledigt bezeichnest.</text>
  <text x="48" y="950" fill="#565650" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / ORIGINALE LEHRGRAFIK / BEGINNE MIT DEN EBENEN</text>
</svg>
