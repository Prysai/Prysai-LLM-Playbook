<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ein Skill-Vertrag führt zu einem prüfbaren Ergebnis</title>
  <desc id="desc">Diese Lehrgrafik in Rot und Schwarz verbindet vier Entscheidungen eines Skills mit einem prüfbaren Ergebnis: Auslöser, Eingabeprüfung, begrenzte Methode und prüfbarer Beleg. Die untere Prüfschiene verlangt positive, begrenzte, fehlerhafte und übertragene Fälle.</desc>
  <rect width="1600" height="900" fill="#f3f0e9"/>
  <rect width="1600" height="116" fill="#11151a"/>
  <rect x="64" y="46" width="18" height="18" fill="#d62828"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="106" y="68" fill="#f3f0e9" font-size="32" font-weight="700" letter-spacing="1">SKILL-VERTRAG → PRÜFBARES ERGEBNIS</text>
    <text x="1536" y="68" fill="#f3f0e9" font-size="16" font-weight="700" text-anchor="end" letter-spacing="2">METHODE / KEINE MAGIE</text>

    <text x="64" y="190" fill="#11151a" font-size="58" font-weight="800" letter-spacing="-2">Vier Entscheidungen. Ein prüfbares Ergebnis.</text>
    <text x="64" y="232" fill="#4f555a" font-size="21">Die Frage bestimmt den Umfang; bei jeder Übergabe bleibt die Berechtigung sichtbar.</text>

    <rect x="64" y="290" width="270" height="292" fill="#11151a"/>
    <text x="88" y="330" fill="#ef4444" font-size="18" font-weight="700" letter-spacing="2">01 / AUSLÖSER</text>
    <text x="88" y="393" fill="#f3f0e9" font-size="35" font-weight="700">Nenne sie.</text>
    <text x="88" y="448" fill="#c9cccf" font-size="20">Wann passt diese</text>
    <text x="88" y="480" fill="#c9cccf" font-size="20">Methode am engsten?</text>
    <line x1="88" y1="528" x2="310" y2="528" stroke="#ef4444" stroke-width="4"/>
    <text x="88" y="559" fill="#f3f0e9" font-size="16" font-weight="700">AUSGABE: WEITER ODER ABGEBEN</text>

    <rect x="350" y="290" width="318" height="292" fill="#f3f0e9" stroke="#11151a" stroke-width="3"/>
    <text x="374" y="330" fill="#d62828" font-size="18" font-weight="700" letter-spacing="2">02 / EINGABEPRÜFUNG</text>
    <text x="374" y="393" fill="#11151a" font-size="32" font-weight="700">Zuerst prüfen.</text>
    <text x="374" y="448" fill="#4f555a" font-size="20">Was muss vorhanden sein?</text>
    <text x="374" y="480" fill="#4f555a" font-size="20">Welche Lücke stoppt sie?</text>
    <line x1="374" y1="528" x2="644" y2="528" stroke="#d62828" stroke-width="4"/>
    <text x="374" y="559" fill="#11151a" font-size="16" font-weight="700">EINGABE FEHLT → STOPP</text>

    <rect x="684" y="290" width="380" height="292" fill="#d62828"/>
    <text x="708" y="330" fill="#11151a" font-size="18" font-weight="700" letter-spacing="2">03 / BEGRENZTE METHODE</text>
    <text x="708" y="393" fill="#ffffff" font-size="32" font-weight="700">Trenne die Aktionen.</text>
    <text x="708" y="448" fill="#ffffff" font-size="20">Erlaubt / verboten / umkehrbar</text>
    <text x="708" y="480" fill="#ffffff" font-size="20">Ziel / Verantwortung / Stopp / Rückweg</text>
    <line x1="708" y1="528" x2="1040" y2="528" stroke="#11151a" stroke-width="4"/>
    <text x="708" y="559" fill="#11151a" font-size="16" font-weight="700">FÄHIGKEIT ≠ BERECHTIGUNG</text>

    <rect x="1080" y="290" width="456" height="292" fill="#11151a"/>
    <text x="1104" y="330" fill="#ef4444" font-size="18" font-weight="700" letter-spacing="2">04 / PRÜFBARES ERGEBNIS</text>
    <text x="1104" y="393" fill="#f3f0e9" font-size="35" font-weight="700">Lass einen Beleg da,</text>
    <text x="1104" y="434" fill="#f3f0e9" font-size="35" font-weight="700">den andere prüfen können.</text>
    <text x="1104" y="480" fill="#c9cccf" font-size="20">Datei · Diff · Log · Screenshot</text>
    <line x1="1104" y1="528" x2="1512" y2="528" stroke="#ef4444" stroke-width="4"/>
    <text x="1104" y="559" fill="#f3f0e9" font-size="16" font-weight="700">ERGEBNIS + GRENZE + STATUS</text>

    <text x="64" y="654" fill="#d62828" font-size="17" font-weight="700" letter-spacing="2">PRÜFRAIL</text>
    <line x1="64" y1="690" x2="1536" y2="690" stroke="#11151a" stroke-width="3"/>
    <rect x="64" y="676" width="18" height="28" fill="#d62828"/>
    <rect x="440" y="676" width="18" height="28" fill="#d62828"/>
    <rect x="816" y="676" width="18" height="28" fill="#d62828"/>
    <rect x="1192" y="676" width="18" height="28" fill="#d62828"/>
    <text x="64" y="748" fill="#11151a" font-size="27" font-weight="700">POSITIV</text>
    <text x="440" y="748" fill="#11151a" font-size="27" font-weight="700">GRENZE</text>
    <text x="816" y="748" fill="#11151a" font-size="27" font-weight="700">FEHLER</text>
    <text x="1192" y="748" fill="#11151a" font-size="27" font-weight="700">ÜBERTRAGUNG</text>
    <text x="64" y="784" fill="#4f555a" font-size="17">funktioniert bei der benannten Aufgabe</text>
    <text x="440" y="784" fill="#4f555a" font-size="17">gibt außerhalb des Umfangs ab</text>
    <text x="816" y="784" fill="#4f555a" font-size="17">stoppt oder stellt ehrlich wieder her</text>
    <text x="1192" y="784" fill="#4f555a" font-size="17">hält ein verändertes Beispiel aus</text>

    <text x="64" y="854" fill="#11151a" font-size="15" font-weight="700">PROJEKTEIGENE GRAFIK · KEINE EXTERNEN MEDIEN</text>
    <text x="1536" y="854" fill="#11151a" font-size="15" font-weight="700" text-anchor="end">PRYSAI LAB / KANDIDAT</text>
  </g>
</svg>
