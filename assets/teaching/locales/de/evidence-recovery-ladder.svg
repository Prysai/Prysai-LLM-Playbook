<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Wiederherstellungskarte / Beleg zuerst</title>
  <desc id="desc">Diese Karte bewahrt Aussage und echte Spur, findet den ersten fehlenden Beleg und wählt einen erlaubten Check oder einen klaren Stopp. Unbekanntes wird dadurch nicht zum Beleg.</desc>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="40" y="30" width="820" height="10" fill="#161616"/>
  <text x="40" y="96" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" letter-spacing="2">WIEDERHERSTELLUNGSKARTE / BELEG ZUERST</text>
  <text x="40" y="162" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">BEIM ERSTEN</text>
  <text x="40" y="216" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">FEHLENDEN BELEG STOPPEN.</text>
  <text x="40" y="258" fill="#514f49" font-family="Arial, Helvetica, sans-serif" font-size="22">Eine glatte Zusammenfassung ist kein Protokoll. Lass die erste Lücke sichtbar,</text>
  <text x="40" y="290" fill="#514f49" font-family="Arial, Helvetica, sans-serif" font-size="22">dann wähle einen erlaubten Check – oder stoppe, ohne Erfolg zu erfinden.</text>
  <line x1="82" y1="360" x2="82" y2="1128" stroke="#d71920" stroke-width="8"/>
  <g transform="translate(126 338)"><rect width="734" height="150" fill="#161616"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / AUSSAGE</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">SAG, WAS „FERTIG“ HEISST.</text><text x="24" y="116" fill="#c8c8c1" font-family="Arial, Helvetica, sans-serif" font-size="20">Datei, Antwort, Test, Übergabe oder Entscheidung – kein selbstsicherer Satz.</text></g>
  <g transform="translate(126 510)"><rect width="734" height="150" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / PROTOKOLL</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">PRÜFE DIE ECHTE SPUR.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="20">Lies Diff, Exit-Code, Quelle, Screenshot, Log oder Prüfnotiz.</text></g>
  <g transform="translate(126 682)"><rect width="734" height="150" fill="#d71920"/><text x="24" y="34" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / ERSTE LÜCKE</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">BENENNE, WAS FEHLT.</text><text x="24" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20">Fehlende Belege markieren: teilweise, ungeprüft, blockiert, unbekannt.</text></g>
  <g transform="translate(126 854)"><rect width="734" height="150" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / NÄCHSTE ENTSCHEIDUNG</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">SICHER PRÜFEN – ODER STOPP.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="20">Ändere nur eine Bedingung. Erweitere keine Berechtigung, damit es klappt.</text></g>
  <rect x="40" y="1086" width="820" height="184" fill="#161616"/><rect x="40" y="1086" width="14" height="184" fill="#d71920"/>
  <text x="82" y="1132" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">PROTOKOLL BEWAHREN</text><text x="82" y="1176" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">FEHLER, UMFANG,</text><text x="82" y="1210" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">ZUSTAND UND LETZTEN CHECKPOINT SICHERN.</text><text x="82" y="1248" fill="#c8c8c1" font-family="Arial, Helvetica, sans-serif" font-size="19">Das Protokoll stützt nur den nächsten begrenzten Schritt. Unbekanntes wird kein Beleg.</text>
  <text x="40" y="1344" fill="#514f49" font-family="Arial, Helvetica, sans-serif" font-size="18">Entscheidungshilfe, kein Erfolgsbeleg für Aufgabe, Modell oder Lernende.</text>
</svg>
