<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Ein Workflow geht über prüfbare Ausstiege weiter</title>
  <desc id="desc">Diese Lehrgrafik mit sieben Stufen teilt den Workflow in zwei Lesebänder und benennt den Ausstiegsbeleg jeder Stufe. Fehlt ein Ausstieg, führt eine sichtbare Verzweigung zu Stopp und Wiederherstellung.</desc>
  <rect width="1600" height="900" fill="#111315"/>
  <rect x="0" y="0" width="34" height="900" fill="#e43b2f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="76" fill="#e43b2f" font-size="18" font-weight="700" letter-spacing="4">WORKFLOW-STEUERUNG / 07 STUFEN / 08</text>
    <text x="76" y="172" fill="#f0ebe1" font-size="66" font-weight="800" letter-spacing="-3">OHNE AUSSTIEGSBELEG KEIN WEITER.</text>
    <text x="80" y="218" fill="#a9adb0" font-size="21">Dass der Agent weitergeht, ist kein Checkpoint; ein prüfbares Artefakt ist es.</text>
    <path d="M76 262H1524" stroke="#f0ebe1" stroke-opacity=".28"/>

    <g transform="translate(76 304)">
      <text x="0" y="-18" fill="#777b7e" font-size="14" font-weight="700" letter-spacing="3">BAND A / ABGRENZEN UND MACHEN</text>
      <g>
        <rect width="334" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">01</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">DEFINIEREN</text>
        <text x="86" y="82" fill="#55595c" font-size="16">Ziel / Umfang / Nicht-Ziele</text>
        <path d="M86 108H310" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">AUSSTIEG / ABNAHME + STOPP</text>
      </g>
      <g transform="translate(354)">
        <rect width="334" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">02</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">PLANEN</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">Slices / Abhängigkeiten / Risiken</text>
        <path d="M86 108H310" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">AUSSTIEG / GEORDNETE CHECKPOINTS</text>
      </g>
      <g transform="translate(708)">
        <rect width="334" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">03</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">BAUEN</text>
        <text x="86" y="82" fill="#55595c" font-size="16">begrenzter Diff / Dateien</text>
        <path d="M86 108H310" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">AUSSTIEG / UMKEHRBAR</text>
      </g>
      <g transform="translate(1062)">
        <rect width="386" height="176" fill="#e43b2f"/>
        <rect width="62" height="176" fill="#151719"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">04</text>
        <text x="86" y="48" fill="#fff8ed" font-size="25" font-weight="800">PRÜFEN</text>
        <text x="86" y="82" fill="#211719" font-size="16">Befehl / Exit / Laufzeit / Grenzen</text>
        <path d="M86 108H362" stroke="#151719" stroke-opacity=".38"/>
        <text x="86" y="140" fill="#151719" font-size="13" font-weight="800">AUSSTIEG / BELEG ZUR AUSSAGE</text>
      </g>
    </g>

    <g transform="translate(76 574)">
      <text x="0" y="-18" fill="#777b7e" font-size="14" font-weight="700" letter-spacing="3">BAND B / BEURTEILEN, ÜBERGEBEN, STATUS HALTEN</text>
      <g>
        <rect width="406" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">05</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">BEGUTACHTEN</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">AUSSAGENKARTE / UNABHÄNGIG PRÜFEN / RISIKEN</text>
        <path d="M86 108H382" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">AUSSTIEG / ANNEHMEN, ÜBERARBEITEN, ABLEHNEN</text>
      </g>
      <g transform="translate(426)">
        <rect width="406" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">06</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">ÜBERGEBEN</text>
        <text x="86" y="82" fill="#55595c" font-size="16">Diff / Logs / Lücken / Übergabe</text>
        <path d="M86 108H382" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">AUSSTIEG / BEGRENZTES PROTOKOLL</text>
      </g>
      <g transform="translate(852)">
        <rect width="354" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">07</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">PFLEGEN</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">Verantwortung / Prüfung / Rückweg</text>
        <path d="M86 108H330" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">AUSSTIEG / NÄCHSTE PRÜFUNG</text>
      </g>
      <g transform="translate(1236)">
        <path d="M0 0H212V176H0V118H26V58H0Z" fill="#e43b2f"/>
        <text x="28" y="45" fill="#151719" font-size="16" font-weight="800">AUSSTIEG FEHLT?</text>
        <text x="28" y="83" fill="#fff8ed" font-size="27" font-weight="800">STOPP</text>
        <text x="28" y="116" fill="#fff8ed" font-size="27" font-weight="800">BEHEBEN</text>
        <text x="28" y="151" fill="#151719" font-size="13" font-weight="700">STATUS SICHERN</text>
      </g>
    </g>
    <path d="M1385 480V544H1418V574" fill="none" stroke="#e43b2f" stroke-width="5"/>
    <text x="76" y="836" fill="#797d80" font-size="14">LEHRMODELL / JEDER AUSSTIEG HAT EINEN AUSSAGENUMFANG / EIN EINZELNER SCREENSHOT BEWEIST NICHT, DASS DER WORKFLOW GELAUFEN IST</text>
  </g>
</svg>
