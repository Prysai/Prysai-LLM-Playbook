<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">워크플로는 확인 가능한 종료 지점을 거쳐 나아갑니다</title>
  <desc id="desc">이 일곱 단계 교육 그림은 워크플로를 두 개의 읽기 구간으로 나누고 각 단계의 종료 증거를 보여 줍니다. 종료 지점이 없으면 멈춤과 복구로 가는 분기가 드러납니다.</desc>
  <rect width="1600" height="900" fill="#111315"/>
  <rect x="0" y="0" width="34" height="900" fill="#e43b2f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="76" fill="#e43b2f" font-size="18" font-weight="700" letter-spacing="4">워크플로 제어 / 07단계 / 08</text>
    <text x="76" y="172" fill="#f0ebe1" font-size="66" font-weight="800" letter-spacing="-3">종료 증거가 없으면 앞으로 나아가지 마세요.</text>
    <text x="80" y="218" fill="#a9adb0" font-size="21">Agent가 계속 진행하는 것은 체크포인트가 아닙니다. 확인할 수 있는 산출물이 체크포인트입니다.</text>
    <path d="M76 262H1524" stroke="#f0ebe1" stroke-opacity=".28"/>

    <g transform="translate(76 304)">
      <text x="0" y="-18" fill="#777b7e" font-size="14" font-weight="700" letter-spacing="3">A 구간 / 틀을 잡고 만들기</text>
      <g>
        <rect width="334" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">01</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">정의</text>
        <text x="86" y="82" fill="#55595c" font-size="16">목표 / 범위 / 제외할 것</text>
        <path d="M86 108H310" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">종료 / 수용 + 중지</text>
      </g>
      <g transform="translate(354)">
        <rect width="334" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">02</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">계획</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">슬라이스 / 의존성 / 위험</text>
        <path d="M86 108H310" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">종료 / 순서가 있는 체크포인트</text>
      </g>
      <g transform="translate(708)">
        <rect width="334" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">03</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">구축</text>
        <text x="86" y="82" fill="#55595c" font-size="16">범위가 정해진 diff / 변경 파일</text>
        <path d="M86 108H310" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">종료 / 되돌릴 수 있는 변경</text>
      </g>
      <g transform="translate(1062)">
        <rect width="386" height="176" fill="#e43b2f"/>
        <rect width="62" height="176" fill="#151719"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">04</text>
        <text x="86" y="48" fill="#fff8ed" font-size="25" font-weight="800">검증</text>
        <text x="86" y="82" fill="#211719" font-size="16">명령 / 종료 / 실행 시점 / 한계</text>
        <path d="M86 108H362" stroke="#151719" stroke-opacity=".38"/>
        <text x="86" y="140" fill="#151719" font-size="13" font-weight="800">종료 / 주장에 맞춘 증거</text>
      </g>
    </g>

    <g transform="translate(76 574)">
      <text x="0" y="-18" fill="#777b7e" font-size="14" font-weight="700" letter-spacing="3">B 구간 / 판단, 인계, 현재 상태 유지</text>
      <g>
        <rect width="406" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">05</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">검토</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">주장 지도 / 독립적인 재검토 / 위험</text>
        <path d="M86 108H382" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">종료 / 수용, 수정, 거부</text>
      </g>
      <g transform="translate(426)">
        <rect width="406" height="176" fill="#f0ebe1"/>
        <rect width="62" height="176" fill="#e43b2f"/>
        <text x="31" y="50" text-anchor="middle" fill="#fff8ed" font-size="20" font-weight="800">06</text>
        <text x="86" y="48" fill="#151719" font-size="25" font-weight="800">전달</text>
        <text x="86" y="82" fill="#55595c" font-size="16">diff / 로그 / 빈틈 / 인계</text>
        <path d="M86 108H382" stroke="#151719" stroke-opacity=".2"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">종료 / 범위가 제한된 기록</text>
      </g>
      <g transform="translate(852)">
        <rect width="354" height="176" fill="#202326" stroke="#55595c"/>
        <rect width="62" height="176" fill="#303438"/>
        <text x="31" y="50" text-anchor="middle" fill="#e43b2f" font-size="20" font-weight="800">07</text>
        <text x="86" y="48" fill="#f0ebe1" font-size="25" font-weight="800">유지보수</text>
        <text x="86" y="82" fill="#b8b6b0" font-size="16">담당자 / 검토 / 복구</text>
        <path d="M86 108H330" stroke="#f0ebe1" stroke-opacity=".18"/>
        <text x="86" y="140" fill="#e43b2f" font-size="13" font-weight="700">종료 / 다음 점검 날짜를 기록</text>
      </g>
      <g transform="translate(1236)">
        <path d="M0 0H212V176H0V118H26V58H0Z" fill="#e43b2f"/>
        <text x="28" y="45" fill="#151719" font-size="16" font-weight="800">종료 지점이 없나요?</text>
        <text x="28" y="83" fill="#fff8ed" font-size="27" font-weight="800">멈추세요</text>
        <text x="28" y="116" fill="#fff8ed" font-size="27" font-weight="800">복구하세요</text>
        <text x="28" y="151" fill="#151719" font-size="13" font-weight="700">마지막 상태를 보존하세요</text>
      </g>
    </g>
    <path d="M1385 480V544H1418V574" fill="none" stroke="#e43b2f" stroke-width="5"/>
    <text x="76" y="836" fill="#797d80" font-size="14">교육 모델 / 각 종료 지점에는 주장의 범위가 있습니다 / 스크린샷 한 장만으로는 워크플로 실행을 증명할 수 없습니다</text>
  </g>
</svg>
