<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">복구 카드 / 증거 우선</title>
  <desc id="desc">이 카드는 주장과 실제 기록을 보존하고 첫 번째 증거 누락을 찾은 뒤 허용된 점검 하나를 선택하거나 분명히 멈추게 합니다. 알 수 없음을 증거로 바꾸지는 않습니다.</desc>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="40" y="30" width="820" height="10" fill="#161616"/>
  <text x="40" y="96" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" letter-spacing="2">복구 카드 / 증거 우선</text>
  <text x="40" y="162" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">첫 번째 증거 누락에서</text>
  <text x="40" y="216" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">멈추세요.</text>
  <text x="40" y="258" fill="#514f49" font-family="Arial, Helvetica, sans-serif" font-size="22">매끄러운 요약은 기록이 아닙니다. 첫 빈틈을 보이게 남기고,</text>
  <text x="40" y="290" fill="#514f49" font-family="Arial, Helvetica, sans-serif" font-size="22">허용된 점검 하나를 고르거나 성공을 꾸미지 말고 멈추세요.</text>
  <line x1="82" y1="360" x2="82" y2="1128" stroke="#d71920" stroke-width="8"/>
  <g transform="translate(126 338)"><rect width="734" height="150" fill="#161616"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / 주장</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">‘완료’의 의미를 정하세요.</text><text x="24" y="116" fill="#c8c8c1" font-family="Arial, Helvetica, sans-serif" font-size="20">파일, 답변, 테스트, 전달 또는 결정이지 자신감 있는 한 문장이 아닙니다.</text></g>
  <g transform="translate(126 510)"><rect width="734" height="150" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / 기록</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">실제 흔적을 점검하세요.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="20">diff, 종료 코드, 출처, 스크린샷, 로그 또는 검토 메모를 읽으세요.</text></g>
  <g transform="translate(126 682)"><rect width="734" height="150" fill="#d71920"/><text x="24" y="34" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / 첫 빈틈</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">빠진 것을 표시하세요.</text><text x="24" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20">부분적·미검증·차단됨·알 수 없음으로 표시하세요. 수용을 추정하지 마세요.</text></g>
  <g transform="translate(126 854)"><rect width="734" height="150" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / 다음 결정</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">안전한 점검 하나를 하거나 멈추세요.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="20">조건 하나만 바꾸세요. 결과를 통과시키려고 권한을 넓히지 마세요.</text></g>
  <rect x="40" y="1086" width="820" height="184" fill="#161616"/><rect x="40" y="1086" width="14" height="184" fill="#d71920"/>
  <text x="82" y="1132" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">기록을 보존하세요</text><text x="82" y="1176" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">오류, 범위,</text><text x="82" y="1210" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">상태와 마지막 체크포인트를 보존하세요.</text><text x="82" y="1248" fill="#c8c8c1" font-family="Arial, Helvetica, sans-serif" font-size="19">이 기록은 범위가 좁은 다음 단계를 뒷받침할 뿐, unknown을 증거로 바꾸지 않습니다.</text>
  <text x="40" y="1344" fill="#514f49" font-family="Arial, Helvetica, sans-serif" font-size="18">복구 카드는 판단을 돕는 자료이지 작업, 모델 또는 학습자의 성공을 증명하는 증거가 아닙니다.</text>
</svg>
