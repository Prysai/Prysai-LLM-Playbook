<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">LLM Foundation Core 5단계 학습 경로</title>
  <desc id="desc">이 다섯 단계 경로는 안전한 시도에서 시작해 작업 항목을 보이게 하고, 눈에 보이는 실패를 이름 붙이고, 증거로 점검·수정한 뒤 처음 보는 작업에 방법을 적용합니다.</desc>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="42" y="34" width="816" height="10" fill="#171717"/>
  <text x="42" y="94" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3">LLM FOUNDATION CORE / 다섯 단계</text>
  <text x="42" y="158" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">방법부터 배우기</text>
  <text x="42" y="214" fill="#d71920" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900" letter-spacing="-2">플랫폼을 고르기 전에</text>
  <text x="44" y="255" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="16">시도 / 관찰 / 이름 붙이기 / 수정 / 전이</text>

  <line x1="76" y1="330" x2="76" y2="1178" stroke="#d71920" stroke-width="8"/>
  <circle cx="76" cy="370" r="15" fill="#d71920"/>
  <circle cx="76" cy="540" r="15" fill="#d71920"/>
  <circle cx="76" cy="710" r="15" fill="#d71920"/>
  <circle cx="76" cy="880" r="15" fill="#d71920"/>
  <circle cx="76" cy="1050" r="15" fill="#d71920"/>

  <g transform="translate(122 318)">
    <rect width="734" height="124" fill="#171717"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / 시도</text>
    <text x="24" y="80" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">안전하게 한 번 시도하세요.</text>
    <text x="24" y="104" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="15">첫 답변을 기준으로 남기세요.</text>
  </g>
  <g transform="translate(122 488)">
    <rect width="734" height="124" fill="#ffffff" stroke="#171717" stroke-width="3"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / 틀 잡기</text>
    <text x="24" y="80" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">작업 항목을 보이게 하세요.</text>
    <text x="24" y="104" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="15">목표, 맥락, 한계와 답변 형식.</text>
  </g>
  <g transform="translate(122 658)">
    <rect width="734" height="124" fill="#ffe5e9" stroke="#171717" stroke-width="3"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / 알아차리기</text>
    <text x="24" y="80" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">눈에 보이는 실패를 이름 붙이세요.</text>
    <text x="24" y="104" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="15">누락, 꾸며 냄, 모호함 또는 과도한 확신.</text>
  </g>
  <g transform="translate(122 828)">
    <rect width="734" height="124" fill="#ffffff" stroke="#171717" stroke-width="3"/>
    <text x="24" y="35" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / 수정하기</text>
    <text x="24" y="80" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">증거로 점검하고 수정하세요.</text>
    <text x="24" y="104" fill="#575750" font-family="Arial, Helvetica, sans-serif" font-size="15">증거와 대조하세요. 조건 하나만 바꾸세요.</text>
  </g>
  <g transform="translate(122 998)">
    <rect width="734" height="124" fill="#d71920"/>
    <text x="24" y="35" fill="#171717" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">05 / 전이</text>
    <text x="24" y="80" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">처음 보는 작업에 방법을 반복하세요.</text>
    <text x="24" y="104" fill="#171717" font-family="Arial, Helvetica, sans-serif" font-size="15">새 작업에는 별도 점검이 필요합니다.</text>
  </g>

  <rect x="42" y="1192" width="816" height="132" fill="#171717"/>
  <text x="66" y="1235" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">경계 / 후보 경로</text>
  <text x="66" y="1278" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900">한 번의 시도가 숙련을 뜻하지는 않습니다.</text>
  <text x="66" y="1308" fill="#c8c8c2" font-family="Arial, Helvetica, sans-serif" font-size="18">산출물, 한계와 다음 질문을 남기세요.</text>
  <text x="42" y="1372" fill="#575750" font-family="Consolas, 'Courier New', monospace" font-size="13">PRYSAI LAB / 프로젝트 원본 교육 그림 / 주장하기 전에 연습하기</text>
</svg>
