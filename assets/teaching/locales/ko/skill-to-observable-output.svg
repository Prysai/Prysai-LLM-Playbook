<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Skill 계약에서 확인 가능한 산출물로</title>
  <desc id="desc">이 빨강·검정 교육 그림은 Skill의 네 가지 결정을 확인 가능한 산출물로 연결합니다. 트리거, 입력 관문, 범위가 정해진 방법과 확인 가능한 산출물을 보여 주고, 아래 검증 레일에서 긍정·경계·실패·전이 네 가지 사례를 요구합니다.</desc>
  <rect width="1600" height="900" fill="#f3f0e9"/>
  <rect width="1600" height="116" fill="#11151a"/>
  <rect x="64" y="46" width="18" height="18" fill="#d62828"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="106" y="68" fill="#f3f0e9" font-size="32" font-weight="700" letter-spacing="1">SKILL 계약 → 확인 가능한 산출물</text>
    <text x="1536" y="68" fill="#f3f0e9" font-size="16" font-weight="700" text-anchor="end" letter-spacing="2">방법 / 마법이 아닙니다</text>

    <text x="64" y="190" fill="#11151a" font-size="58" font-weight="800" letter-spacing="-2">네 가지 결정. 하나의 점검 가능한 결과.</text>
    <text x="64" y="232" fill="#4f555a" font-size="21">질문에 맞춰 범위를 정하고 인계할 때마다 권한을 드러냅니다.</text>

    <rect x="64" y="290" width="270" height="292" fill="#11151a"/>
    <text x="88" y="330" fill="#ef4444" font-size="18" font-weight="700" letter-spacing="2">01 / 트리거</text>
    <text x="88" y="393" fill="#f3f0e9" font-size="35" font-weight="700">작업 정하기.</text>
    <text x="88" y="448" fill="#c9cccf" font-size="20">이 방법이</text>
    <text x="88" y="480" fill="#c9cccf" font-size="20">언제 가장 잘 맞나요?</text>
    <line x1="88" y1="528" x2="310" y2="528" stroke="#ef4444" stroke-width="4"/>
    <text x="88" y="559" fill="#f3f0e9" font-size="16" font-weight="700">출력: 연결 또는 양보</text>

    <rect x="350" y="290" width="318" height="292" fill="#f3f0e9" stroke="#11151a" stroke-width="3"/>
    <text x="374" y="330" fill="#d62828" font-size="18" font-weight="700" letter-spacing="2">02 / 입력 관문</text>
    <text x="374" y="393" fill="#11151a" font-size="32" font-weight="700">먼저 확인하세요.</text>
    <text x="374" y="448" fill="#4f555a" font-size="20">무엇이 있어야 하나요?</text>
    <text x="374" y="480" fill="#4f555a" font-size="20">무엇이 없으면 멈추나요?</text>
    <line x1="374" y1="528" x2="644" y2="528" stroke="#d62828" stroke-width="4"/>
    <text x="374" y="559" fill="#11151a" font-size="16" font-weight="700">입력 누락 → 중지</text>

    <rect x="684" y="290" width="380" height="292" fill="#d62828"/>
    <text x="708" y="330" fill="#11151a" font-size="18" font-weight="700" letter-spacing="2">03 / 범위가 정해진 방법</text>
    <text x="708" y="393" fill="#ffffff" font-size="32" font-weight="700">행동을 분리하세요.</text>
    <text x="708" y="448" fill="#ffffff" font-size="20">허용 / 금지 / 되돌릴 수 있음</text>
    <text x="708" y="480" fill="#ffffff" font-size="20">대상 / 담당자 / 중지 / 복구</text>
    <line x1="708" y1="528" x2="1040" y2="528" stroke="#11151a" stroke-width="4"/>
    <text x="708" y="559" fill="#11151a" font-size="16" font-weight="700">능력 ≠ 권한</text>

    <rect x="1080" y="290" width="456" height="292" fill="#11151a"/>
    <text x="1104" y="330" fill="#ef4444" font-size="18" font-weight="700" letter-spacing="2">04 / 확인 가능한 산출물</text>
    <text x="1104" y="393" fill="#f3f0e9" font-size="35" font-weight="700">다른 사람이 확인할</text>
    <text x="1104" y="434" fill="#f3f0e9" font-size="35" font-weight="700">증거를 남기세요.</text>
    <text x="1104" y="480" fill="#c9cccf" font-size="20">파일 · diff · 로그 · 스크린샷</text>
    <line x1="1104" y1="528" x2="1512" y2="528" stroke="#ef4444" stroke-width="4"/>
    <text x="1104" y="559" fill="#f3f0e9" font-size="16" font-weight="700">산출물 + 한계 + 상태</text>

    <text x="64" y="654" fill="#d62828" font-size="17" font-weight="700" letter-spacing="2">검증 레일</text>
    <line x1="64" y1="690" x2="1536" y2="690" stroke="#11151a" stroke-width="3"/>
    <rect x="64" y="676" width="18" height="28" fill="#d62828"/>
    <rect x="440" y="676" width="18" height="28" fill="#d62828"/>
    <rect x="816" y="676" width="18" height="28" fill="#d62828"/>
    <rect x="1192" y="676" width="18" height="28" fill="#d62828"/>
    <text x="64" y="748" fill="#11151a" font-size="27" font-weight="700">긍정</text>
    <text x="440" y="748" fill="#11151a" font-size="27" font-weight="700">경계</text>
    <text x="816" y="748" fill="#11151a" font-size="27" font-weight="700">실패</text>
    <text x="1192" y="748" fill="#11151a" font-size="27" font-weight="700">전이</text>
    <text x="64" y="784" fill="#4f555a" font-size="17">지정한 작업에서 작동</text>
    <text x="440" y="784" fill="#4f555a" font-size="17">범위를 벗어나면 양보</text>
    <text x="816" y="784" fill="#4f555a" font-size="17">정직하게 중지하거나 복구</text>
    <text x="1192" y="784" fill="#4f555a" font-size="17">바뀐 예에서도 견딤</text>

    <text x="64" y="854" fill="#11151a" font-size="15" font-weight="700">프로젝트 원본 도형 · 외부 미디어 없음</text>
    <text x="1536" y="854" fill="#11151a" font-size="15" font-weight="700" text-anchor="end">PRYSAI LAB / candidate</text>
  </g>
</svg>
