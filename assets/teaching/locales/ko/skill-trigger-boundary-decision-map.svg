<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Skill 트리거와 경계 의사결정 지도</title>
  <desc id="desc">재사용 가능한 Skill의 다섯 단계를 보여 줍니다. 작업을 정하고 입력을 확인하며 권한을 검증한 뒤 실제 실행을 살펴보세요. 증거가 뒷받침하는 만큼만 주장하고 맞지 않으면 양보하고 멈춥니다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>

  <text x="78" y="112" class="mono" font-size="22">SKILL / 경계</text>
  <text x="78" y="174" class="ink" font-size="46" font-weight="900">트리거는</text>
  <text x="78" y="228" class="ink" font-size="46" font-weight="900">권한이 아닙니다.</text>
  <text x="78" y="278" class="muted" font-size="21">재사용 가능한 방법은 조건이나 증거가 부족할 때 안전하게 양보할 수 있어야 쓸모를 증명합니다.</text>

  <line x1="120" y1="356" x2="120" y2="1212" class="line"/>
  <line x1="120" y1="454" x2="120" y2="494" class="redline"/>
  <line x1="120" y1="624" x2="120" y2="664" class="redline"/>
  <line x1="120" y1="794" x2="120" y2="834" class="redline"/>
  <line x1="120" y1="964" x2="120" y2="1004" class="redline"/>

  <g transform="translate(78 320)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="96" y="0" width="688" height="134" fill="#111"/>
    <text x="124" y="38" class="mono" fill="#fff" font-size="18">트리거</text>
    <text x="124" y="73" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="900">범위가 좁은 작업을 정하세요.</text>
    <text x="124" y="106" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">잘 맞으면 작업을 연결하고, 맞지 않으면 양보합니다.</text>
  </g>

  <g transform="translate(78 490)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="96" y="0" width="688" height="134" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="38" class="mono" font-size="18">입력 관문</text>
    <text x="124" y="73" class="ink" font-size="27" font-weight="900">실제로 있는 것을 확인하세요.</text>
    <text x="124" y="106" class="muted" font-size="17">제공됨 / 읽을 수 있음 / 추정됨 / unknown · 입력이 없으면 중지.</text>
  </g>

  <g transform="translate(78 660)">
    <circle cx="42" cy="54" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="42" y="64" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="96" y="0" width="688" height="134" fill="#d71920"/>
    <text x="124" y="38" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="18" font-weight="700" letter-spacing="1px">권한</text>
    <text x="124" y="73" fill="#fff" font-size="27" font-weight="900">능력과 허가를 분리하세요.</text>
    <text x="124" y="106" fill="#fff" font-size="17">허용 / 금지 / 되돌릴 수 있음 / 승인 · 부작용 전에 멈추세요.</text>
  </g>

  <g transform="translate(78 830)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="96" y="0" width="688" height="134" fill="#111"/>
    <text x="124" y="38" class="mono" fill="#fff" font-size="18">실행 / 점검</text>
    <text x="124" y="73" fill="#fff" font-size="27" font-weight="900">실제 이벤트를 찾으세요.</text>
    <text x="124" y="106" fill="#c8c8c2" font-size="17">기록 · 출력 · diff · 로그 · 테스트 · 사람이 다시 확인한 내용.</text>
  </g>

  <g transform="translate(78 1000)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="96" y="0" width="688" height="134" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="38" class="mono" font-size="18">증거 경계</text>
    <text x="124" y="73" class="ink" font-size="27" font-weight="900">기록이 뒷받침하는 만큼만 주장하세요.</text>
    <text x="124" y="106" class="muted" font-size="17">긍정 / 경계 / 실패 / 전이 · 증거가 없으면 candidate 또는 중지.</text>
  </g>

  <path d="M216 1134 216 1190 310 1190" class="redline"/>
  <path d="M684 1134 684 1190 590 1190" class="redline"/>
  <rect x="78" y="1218" width="762" height="126" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1254" class="mono" font-size="17">정직한 두 가지 결과</text>
  <text x="102" y="1291" class="ink" font-size="21" font-weight="700">연결: 적합성, 권한과 증거가 보입니다.</text>
  <text x="102" y="1324" class="ink" font-size="21" font-weight="700">양보: 부족한 사실을 밝히고 주장을 작게 유지합니다.</text>

  <text x="78" y="1402" class="muted" font-size="16">Skill 계약은 언제 행동하고 언제 행동하지 않으며 다른 사람이 무엇을 점검할 수 있는지 설명합니다.</text>
</svg>
