<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">Échelle de maturité des preuves</title>
  <desc id="desc">Cette échelle en cinq étapes va du contrat pédagogique conçu à la revue indépendante. Chaque étape précise ce qu’elle permet d’affirmer, ce qu’elle ne permet pas d’affirmer et la preuve nécessaire pour avancer.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">PREUVES / MATURITÉ</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">NE SAUTEZ PAS</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">LES PREUVES.</text>
  <text x="78" y="282" class="muted" font-size="22" textLength="762" lengthAdjust="spacingAndGlyphs">Une page complète ne signifie pas que la méthode a été pratiquée, transférée et relue.</text>

  <line x1="120" y1="366" x2="120" y2="1268" class="line"/>
  <line x1="120" y1="452" x2="120" y2="508" class="redline"/>
  <line x1="120" y1="636" x2="120" y2="692" class="redline"/>
  <line x1="120" y1="820" x2="120" y2="876" class="redline"/>
  <line x1="120" y1="1004" x2="120" y2="1060" class="redline"/>

  <g transform="translate(78 320)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="96" y="0" width="688" height="148" fill="#111"/>
    <text x="124" y="42" class="mono" fill="#fff" font-size="19">CONÇU</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">Le contrat est écrit.</text>
    <text x="124" y="111" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Permet d’affirmer : une méthode prévue et claire.</text>
    <text x="124" y="135" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Ne permet pas d’affirmer : que chacun peut l’utiliser.</text>
  </g>

  <g transform="translate(78 504)">
    <circle cx="42" cy="54" r="34" fill="#d71920"/>
    <text x="42" y="64" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="96" y="0" width="688" height="148" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="42" class="mono" font-size="19">RENDU</text>
    <text x="124" y="78" class="ink" font-size="28" font-weight="900">La page et le parcours fonctionnent.</text>
    <text x="124" y="111" class="muted" font-size="17">Permet d’affirmer : qu’un lecteur peut atteindre le contenu.</text>
    <text x="124" y="135" class="muted" font-size="17">Ne permet pas d’affirmer : qu’il l’a compris ou utilisé.</text>
  </g>

  <g transform="translate(78 688)">
    <circle cx="42" cy="54" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="42" y="64" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="96" y="0" width="688" height="148" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="124" y="42" class="mono" font-size="19">PRATIQUÉ</text>
    <text x="124" y="78" class="ink" font-size="28" font-weight="900">Un apprenant exécute la tâche.</text>
    <text x="124" y="111" class="muted" font-size="17">Permet d’affirmer : un essai observé et son résultat.</text>
    <text x="124" y="135" class="muted" font-size="17">Ne permet pas d’affirmer : une performance fiable sur une nouvelle tâche.</text>
  </g>

  <g transform="translate(78 872)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="96" y="0" width="688" height="148" fill="#d71920"/>
    <text x="124" y="42" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">TRANSFÉRÉ</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">La méthode résiste à une tâche différente.</text>
    <text x="124" y="111" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Permet d’affirmer : une preuve de réutilisation au-delà du premier exemple.</text>
    <text x="124" y="135" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Ne permet pas d’affirmer : une compétence universelle ou permanente.</text>
  </g>

  <g transform="translate(78 1056)">
    <circle cx="42" cy="54" r="34" fill="#111"/>
    <text x="42" y="64" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="96" y="0" width="688" height="148" fill="#111"/>
    <text x="124" y="42" class="mono" fill="#fff" font-size="19">RELU INDÉPENDAMMENT</text>
    <text x="124" y="78" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">Une autre personne la rejoue et la vérifie.</text>
    <text x="124" y="111" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Permet d’affirmer : un résultat corroboré dans un périmètre nommé.</text>
    <text x="124" y="135" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Ne permet pas d’affirmer : des conclusions hors des conditions relues.</text>
  </g>

  <path d="M694 1258 790 1258 790 1174" class="redline"/>
  <rect x="78" y="1308" width="762" height="92" fill="#f3f0e9" stroke="#111" stroke-width="2"/>
  <text x="102" y="1342" class="mono" font-size="17">PROCHAINE PREUVE</text>
  <text x="102" y="1372" class="ink" font-size="19" font-weight="700">Nommez l’étape que vous avez et réunissez seulement ce qui la fait avancer.</text>
</svg>
