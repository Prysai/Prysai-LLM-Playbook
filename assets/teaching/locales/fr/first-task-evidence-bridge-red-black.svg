<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">De la première tâche à une preuve utilisable</title>
  <desc id="desc">Ce pont en cinq étapes part d’un résultat observable, passe par une limite sûre et un essai réel, puis arrive à un contrôle ciblé et à une fiche de transmission. Le dernier panneau rappelle que l’absence de relevé limite l’affirmation.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">PREMIÈRE TÂCHE / PONT DES PREUVES</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">RENDEZ UNE PETITE</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">TÂCHE VÉRIFIABLE.</text>
  <text x="78" y="282" class="muted" font-size="22">Un résultat n’est utile que si une autre personne peut examiner le chemin parcouru.</text>

  <line x1="128" y1="376" x2="128" y2="1250" class="line"/>
  <line x1="128" y1="450" x2="128" y2="530" class="redline"/>
  <line x1="128" y1="660" x2="128" y2="740" class="redline"/>
  <line x1="128" y1="870" x2="128" y2="950" class="redline"/>
  <line x1="128" y1="1080" x2="128" y2="1160" class="redline"/>

  <g transform="translate(78 330)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">RÉSULTAT</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">CHOISISSEZ UN RÉSULTAT OBSERVABLE.</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">« Aidez-moi avec ça » ne décrit pas encore un résultat vérifiable.</text>
  </g>

  <g transform="translate(78 540)">
    <circle cx="50" cy="48" r="34" fill="#d71920"/>
    <text x="50" y="58" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">LIMITE</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">GARDEZ L’ENTRÉE ET L’ARRÊT VISIBLES.</text>
    <text x="140" y="105" class="muted" font-size="17">Utilisez un jeu de test sûr ; indiquez ce qui reste hors périmètre et quand vous arrêter.</text>
  </g>

  <g transform="translate(78 750)">
    <circle cx="50" cy="48" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="50" y="58" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">ESSAI</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">CONSERVEZ CE QUI S’EST VRAIMENT PASSÉ.</text>
    <text x="140" y="105" class="muted" font-size="17">Gardez l’entrée, la réponse, la modification, la sortie ou les données renvoyées — pas seulement le plan.</text>
  </g>

  <g transform="translate(78 960)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="112" y="0" width="650" height="120" fill="#d71920"/>
    <text x="140" y="44" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">CONTRÔLE</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">COMPAREZ UN DÉTAIL IMPORTANT.</text>
    <text x="140" y="105" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">Utilisez une source, un diff, un test, un journal ou un critère d’acceptation.</text>
  </g>

  <g transform="translate(78 1170)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">RELEVÉ</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">TRANSMETTEZ LE RÉSULTAT, LA LIMITE ET LA SUITE.</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">Un relevé court permet à une autre personne d’examiner le même essai.</text>
  </g>

  <rect x="78" y="1345" width="762" height="72" fill="#d71920"/>
  <text x="102" y="1375" class="mono" fill="#111" font-size="17">LIMITE</text>
  <text x="230" y="1375" class="ink" fill="#111" font-size="19" font-weight="700">PAS DE RELEVÉ ? PAS D’AFFIRMATION PLUS LARGE.</text>
  <text x="102" y="1403" class="muted" font-size="17">Un petit arrêt vaut mieux qu’une histoire assurée sans relevé.</text>
</svg>
