<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1400" role="img" aria-labelledby="title desc">
  <title id="title">Carte de reprise / la preuve d’abord</title>
  <desc id="desc">Cette carte conserve l’affirmation et la trace réelle, repère le premier manque de preuve, puis choisit un contrôle autorisé ou un arrêt clair. Elle ne transforme pas l’inconnu en preuve.</desc>
  <rect width="900" height="1400" fill="#f6f6f2"/>
  <rect x="40" y="30" width="820" height="10" fill="#161616"/>
  <text x="40" y="96" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="16" font-weight="700" letter-spacing="2">CARTE DE REPRISE / LA PREUVE D’ABORD</text>
  <text x="40" y="162" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">ARRÊTEZ-VOUS AU</text>
  <text x="40" y="216" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="900">PREMIER MANQUE DE PREUVE.</text>
  <text x="40" y="258" fill="#514f49" font-family="Arial, Helvetica, sans-serif" font-size="22">Un résumé bien tourné n’est pas un relevé. Gardez le premier manque visible,</text>
  <text x="40" y="290" fill="#514f49" font-family="Arial, Helvetica, sans-serif" font-size="22">puis choisissez un contrôle autorisé — ou arrêtez-vous sans inventer de réussite.</text>
  <line x1="82" y1="360" x2="82" y2="1128" stroke="#d71920" stroke-width="8"/>
  <g transform="translate(126 338)"><rect width="734" height="150" fill="#161616"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">01 / AFFIRMATION</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">DITES CE QUE « TERMINÉ » VEUT DIRE.</text><text x="24" y="116" fill="#c8c8c1" font-family="Arial, Helvetica, sans-serif" font-size="20">Fichier, réponse, test, livraison ou décision — pas une certitude.</text></g>
  <g transform="translate(126 510)"><rect width="734" height="150" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">02 / RELEVÉ</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">EXAMINEZ LA TRACE RÉELLE.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="20">Lisez le diff, le code de sortie, la source, la capture, le journal ou la relecture.</text></g>
  <g transform="translate(126 682)"><rect width="734" height="150" fill="#d71920"/><text x="24" y="34" fill="#161616" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">03 / PREMIER MANQUE</text><text x="24" y="78" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">NOMMEZ CE QUI MANQUE.</text><text x="24" y="116" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="20">Marquez partiel, non vérifié, bloqué ou inconnu. N’inférez pas l’acceptation.</text></g>
  <g transform="translate(126 854)"><rect width="734" height="150" fill="#ffffff" stroke="#161616" stroke-width="3"/><text x="24" y="34" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">04 / DÉCISION SUIVANTE</text><text x="24" y="78" fill="#161616" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">CONTRÔLE SÛR — OU ARRÊT.</text><text x="24" y="116" fill="#565650" font-family="Arial, Helvetica, sans-serif" font-size="20">Une seule condition. N’élargissez pas l’autorité pour faire passer le résultat.</text></g>
  <rect x="40" y="1086" width="820" height="184" fill="#161616"/><rect x="40" y="1086" width="14" height="184" fill="#d71920"/>
  <text x="82" y="1132" fill="#d71920" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700">GARDEZ LE RELEVÉ</text><text x="82" y="1176" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">CONSERVEZ L’ERREUR, LE PÉRIMÈTRE,</text><text x="82" y="1210" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="900">L’ÉTAT ET LE DERNIER POINT DE CONTRÔLE.</text><text x="82" y="1248" fill="#c8c8c1" font-family="Arial, Helvetica, sans-serif" font-size="19">Le relevé peut soutenir une prochaine étape délimitée ; il ne transforme pas l’inconnu en preuve.</text>
  <text x="40" y="1344" fill="#514f49" font-family="Arial, Helvetica, sans-serif" font-size="18">Carte de reprise : aide à décider, sans prouver la réussite d’une tâche, d’un modèle ou d’un apprenant.</text>
</svg>
