<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1500" role="img" aria-labelledby="title desc">
  <title id="title">最初の課題を使える証拠につなげる</title>
  <desc id="desc">5段階の橋です。観察できる結果を1つ選び、安全な境界と実際の試行を経て、焦点を絞った確認と引き継ぎの記録につなげます。最後の枠は、記録がなければ主張を広げられないと伝えます。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto">
      <path d="M0 0 8 4 0 8Z" fill="#d71920"/>
    </marker>
    <style>
      .ink { fill:#111; font-family:Arial,Helvetica,sans-serif; }
      .muted { fill:#565650; font-family:Arial,Helvetica,sans-serif; }
      .mono { fill:#d71920; font-family:Consolas,'Courier New',monospace; font-weight:700; letter-spacing:1px; }
      .line { stroke:#111; stroke-width:2; fill:none; }
      .redline { stroke:#d71920; stroke-width:4; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>
  <rect width="900" height="1500" fill="#f3f0e9"/>
  <rect x="42" y="42" width="816" height="1416" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="78" y="112" class="mono" font-size="22">最初の課題 / 証拠の橋</text>
  <text x="78" y="174" class="ink" font-size="48" font-weight="900">小さな</text>
  <text x="78" y="230" class="ink" font-size="48" font-weight="900">課題を確認できる形にする。</text>
  <text x="78" y="282" class="muted" font-size="22">別の人が経路を確認できて初めて、結果は役に立ちます。</text>

  <line x1="128" y1="376" x2="128" y2="1250" class="line"/>
  <line x1="128" y1="450" x2="128" y2="530" class="redline"/>
  <line x1="128" y1="660" x2="128" y2="740" class="redline"/>
  <line x1="128" y1="870" x2="128" y2="950" class="redline"/>
  <line x1="128" y1="1080" x2="128" y2="1160" class="redline"/>

  <g transform="translate(78 330)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">01</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">結果</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">観察できる結果を1つ選ぶ。</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">「これを手伝って」だけでは、まだ確認できる結果ではない。</text>
  </g>

  <g transform="translate(78 540)">
    <circle cx="50" cy="48" r="34" fill="#d71920"/>
    <text x="50" y="58" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">02</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">境界</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">入力と停止を見えるようにする。</text>
    <text x="140" y="105" class="muted" font-size="17">安全なテストデータを使い、含めないものと止める時点を決める。</text>
  </g>

  <g transform="translate(78 750)">
    <circle cx="50" cy="48" r="34" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="50" y="58" class="mono" font-size="25" text-anchor="middle">03</text>
    <rect x="112" y="0" width="650" height="120" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="140" y="44" class="mono" font-size="19">試行</text>
    <text x="140" y="77" class="ink" font-size="28" font-weight="900">実際に起きたことを保存する。</text>
    <text x="140" y="105" class="muted" font-size="17">入力、応答、編集、終了、返されたデータを残す。計画だけでは足りない。</text>
  </g>

  <g transform="translate(78 960)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">04</text>
    <rect x="112" y="0" width="650" height="120" fill="#d71920"/>
    <text x="140" y="44" fill="#111" font-family="Consolas,'Courier New',monospace" font-size="19" font-weight="700" letter-spacing="1px">確認</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">重要な点を1つ照合する。</text>
    <text x="140" y="105" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="17">出典、差分、テスト、ログ、受け入れ条件のいずれかを使う。</text>
  </g>

  <g transform="translate(78 1170)">
    <circle cx="50" cy="48" r="34" fill="#111"/>
    <text x="50" y="58" fill="#fff" font-family="Consolas,'Courier New',monospace" font-size="25" font-weight="700" text-anchor="middle">05</text>
    <rect x="112" y="0" width="650" height="120" fill="#111"/>
    <text x="140" y="44" class="mono" fill="#fff" font-size="19">記録</text>
    <text x="140" y="77" fill="#fff" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900">結果、限界、次の一手を引き継ぐ。</text>
    <text x="140" y="105" fill="#c8c8c2" font-family="Arial,Helvetica,sans-serif" font-size="17">短い記録があれば、別の人も同じ試行を確認できます。</text>
  </g>

  <rect x="78" y="1345" width="762" height="72" fill="#d71920"/>
  <text x="102" y="1375" class="mono" fill="#111" font-size="17">境界</text>
  <text x="230" y="1375" class="ink" fill="#111" font-size="19" font-weight="700">記録がないなら、主張を広げない。</text>
  <text x="102" y="1403" class="muted" font-size="17">記録のない自信満々の物語より、小さく止める方がよい。</text>
</svg>
