<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stop at the first missing proof</title>
  <desc id="desc">A claim becomes stronger as scope, execution, runtime, and acceptance evidence are added. When a proof is missing, label the gap, run one safe check, or stop.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#071425"/><stop offset="1" stop-color="#102c4c"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#55d6be"/><stop offset="1" stop-color="#6aa8ff"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#173858" stop-opacity=".98"/><stop offset="1" stop-color="#0b2037" stop-opacity=".98"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020a16" flood-opacity=".34"/></filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#8fb7dc" stroke-opacity=".07"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#6aa8ff"/></marker>
    <marker id="downArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#f7c66b"/></marker>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/><rect x="28" y="28" width="1544" height="844" rx="28" fill="url(#grid)"/>
  <text x="96" y="102" fill="#79e4d0" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4">EVIDENCE / RECOVERY MAP</text>
  <text x="96" y="162" fill="#f4f8ff" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Do not climb past the first missing proof.</text>
  <text x="96" y="205" fill="#a9bfd7" font-family="Arial, Helvetica, sans-serif" font-size="22">A stronger claim needs a stronger, separately scoped observation.</text>
  <text x="96" y="274" fill="#79e4d0" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2">CLAIM STRENGTH</text>
  <path d="M96 310H1438" stroke="#284c70" stroke-width="14" stroke-linecap="round"/><path d="M96 310H1438" stroke="url(#rail)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(88 246)"><circle cx="38" cy="64" r="28" fill="#55d6be"/><text x="38" y="72" text-anchor="middle" fill="#06211e" font-size="22" font-weight="700">01</text><rect x="0" y="104" width="252" height="164" rx="18" fill="url(#card)" stroke="#3e7894" stroke-opacity=".7" filter="url(#shadow)"/><text x="24" y="140" fill="#f4f8ff" font-size="24" font-weight="700">Scope exists</text><text x="24" y="174" fill="#a9bfd7" font-size="17">diff · path · hash</text><text x="24" y="222" fill="#79e4d0" font-size="16" font-weight="700">SOURCE EVIDENCE</text><text x="24" y="248" fill="#cfe0f0" font-size="15">What changed?</text></g>
    <g transform="translate(386 246)"><circle cx="38" cy="64" r="28" fill="#5bc9d0"/><text x="38" y="72" text-anchor="middle" fill="#06211e" font-size="22" font-weight="700">02</text><rect x="0" y="104" width="252" height="164" rx="18" fill="url(#card)" stroke="#3e7894" stroke-opacity=".7" filter="url(#shadow)"/><text x="24" y="140" fill="#f4f8ff" font-size="24" font-weight="700">Check ran</text><text x="24" y="174" fill="#a9bfd7" font-size="17">command · exit code</text><text x="24" y="222" fill="#79e4d0" font-size="16" font-weight="700">RUN EVIDENCE</text><text x="24" y="248" fill="#cfe0f0" font-size="15">What did it report?</text></g>
    <g transform="translate(684 246)"><circle cx="38" cy="64" r="28" fill="#6aa8ff"/><text x="38" y="72" text-anchor="middle" fill="#071425" font-size="22" font-weight="700">03</text><rect x="0" y="104" width="252" height="164" rx="18" fill="url(#card)" stroke="#3e7894" stroke-opacity=".7" filter="url(#shadow)"/><text x="24" y="140" fill="#f4f8ff" font-size="24" font-weight="700">Target behaved</text><text x="24" y="174" fill="#a9bfd7" font-size="17">runtime · read-back</text><text x="24" y="222" fill="#79e4d0" font-size="16" font-weight="700">TARGET EVIDENCE</text><text x="24" y="248" fill="#cfe0f0" font-size="15">Did the state change?</text></g>
    <g transform="translate(982 246)"><circle cx="38" cy="64" r="28" fill="#8db5ff"/><text x="38" y="72" text-anchor="middle" fill="#071425" font-size="22" font-weight="700">04</text><rect x="0" y="104" width="252" height="164" rx="18" fill="url(#card)" stroke="#3e7894" stroke-opacity=".7" filter="url(#shadow)"/><text x="24" y="140" fill="#f4f8ff" font-size="24" font-weight="700">User accepted</text><text x="24" y="174" fill="#a9bfd7" font-size="17">task · sample · feedback</text><text x="24" y="222" fill="#79e4d0" font-size="16" font-weight="700">ACCEPTANCE</text><text x="24" y="248" fill="#cfe0f0" font-size="15">Did it help this user?</text></g>
    <g transform="translate(1280 246)"><circle cx="38" cy="64" r="28" fill="#b1caff"/><text x="38" y="72" text-anchor="middle" fill="#071425" font-size="22" font-weight="700">05</text><rect x="0" y="104" width="252" height="164" rx="18" fill="url(#card)" stroke="#3e7894" stroke-opacity=".7" filter="url(#shadow)"/><text x="24" y="140" fill="#f4f8ff" font-size="24" font-weight="700">Ready to ship</text><text x="24" y="174" fill="#a9bfd7" font-size="17">release · rollback · owner</text><text x="24" y="222" fill="#79e4d0" font-size="16" font-weight="700">RELEASE EVIDENCE</text><text x="24" y="248" fill="#cfe0f0" font-size="15">What remains outside scope?</text></g>
    <path d="M804 514C804 574 804 590 804 642" fill="none" stroke="#f7c66b" stroke-width="4" stroke-dasharray="9 10" marker-end="url(#downArrow)"/><text x="822" y="554" fill="#f7c66b" font-size="17" font-weight="700">first missing proof</text><text x="822" y="580" fill="#d7c99b" font-size="15">stop here; do not infer the next stage</text>
    <rect x="96" y="638" width="640" height="150" rx="20" fill="#142d47" stroke="#f7c66b" stroke-opacity=".7" filter="url(#shadow)"/><text x="128" y="684" fill="#f7c66b" font-size="18" font-weight="700" letter-spacing="2">GAP LABEL</text><text x="128" y="722" fill="#f4f8ff" font-size="25" font-weight="700">partial · unverified · blocked</text><text x="128" y="756" fill="#cfe0f0" font-size="16">Preserve the error, state, scope, and last checkpoint.</text>
    <rect x="864" y="638" width="640" height="150" rx="20" fill="#142d47" stroke="#55d6be" stroke-opacity=".75" filter="url(#shadow)"/><text x="896" y="684" fill="#79e4d0" font-size="18" font-weight="700" letter-spacing="2">RECOVERY CHOICE</text><text x="896" y="722" fill="#f4f8ff" font-size="25" font-weight="700">one safe check — or a clear stop</text><text x="896" y="756" fill="#cfe0f0" font-size="16">Change one condition; retry only when the rule and state allow it.</text>
    <text x="96" y="838" fill="#8fa8c2" font-size="15">Teaching model · evidence is scoped to a claim · no runtime or production claim</text><text x="1504" y="838" text-anchor="end" fill="#8fa8c2" font-size="15">Prysai Lab / FIELD GUIDE</text>
  </g>
</svg>
