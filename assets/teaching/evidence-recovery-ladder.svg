<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stop at the first missing proof</title>
  <desc id="desc">A literal five-step evidence staircase rises from source scope to release evidence. A missing target observation breaks the third step and routes to a bounded recovery decision.</desc>
  <rect width="1600" height="900" fill="#111315"/><rect width="34" height="900" fill="#e43b2f"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="76" y="76" fill="#e43b2f" font-size="18" font-weight="700" letter-spacing="4">EVIDENCE LADDER / RECOVERY / 09</text>
    <text x="76" y="170" fill="#f0ebe1" font-size="68" font-weight="800" letter-spacing="-3">STOP AT THE FIRST MISSING PROOF.</text>
    <text x="80" y="216" fill="#a9adb0" font-size="21">Claim strength rises only when a separately scoped observation exists.</text>
    <path d="M76 260H1524" stroke="#f0ebe1" stroke-opacity=".28"/>
    <g transform="translate(76 296)">
      <rect x="0" y="320" width="270" height="130" fill="#f0ebe1"/><rect x="270" y="240" width="270" height="210" fill="#24272a" stroke="#55595c"/>
      <rect x="540" y="160" width="270" height="290" fill="#e43b2f"/><rect x="810" y="80" width="270" height="370" fill="#24272a" stroke="#55595c"/>
      <rect x="1080" width="292" height="450" fill="#f0ebe1"/>
      <text x="24" y="356" fill="#e43b2f" font-size="14" font-weight="700" letter-spacing="2">01 / SOURCE</text><text x="24" y="394" fill="#151719" font-size="24" font-weight="800">SCOPE EXISTS</text><text x="24" y="425" fill="#55595c" font-size="15">diff / path / hash</text>
      <text x="294" y="276" fill="#e43b2f" font-size="14" font-weight="700" letter-spacing="2">02 / RUN</text><text x="294" y="314" fill="#f0ebe1" font-size="24" font-weight="800">CHECK RAN</text><text x="294" y="345" fill="#b8b6b0" font-size="15">command / exit code</text>
      <text x="564" y="196" fill="#151719" font-size="14" font-weight="800" letter-spacing="2">03 / TARGET</text><text x="564" y="234" fill="#fff8ed" font-size="24" font-weight="800">STATE OBSERVED</text><text x="564" y="265" fill="#211719" font-size="15">runtime / read-back</text>
      <path d="M540 302H660L690 270L720 334L750 302H810" fill="none" stroke="#111315" stroke-width="12"/><text x="564" y="374" fill="#151719" font-size="17" font-weight="800">FIRST GAP</text><text x="564" y="405" fill="#fff8ed" font-size="15">do not infer acceptance</text>
      <text x="834" y="116" fill="#e43b2f" font-size="14" font-weight="700" letter-spacing="2">04 / ACCEPTANCE</text><text x="834" y="154" fill="#f0ebe1" font-size="22" font-weight="800">USER TASK</text><text x="834" y="181" fill="#f0ebe1" font-size="22" font-weight="800">PASSED</text><text x="834" y="214" fill="#b8b6b0" font-size="15">sample / criteria / feedback</text><text x="834" y="412" fill="#777b7e" font-size="13">LOCKED UNTIL STEP 03 EXISTS</text>
      <text x="1104" y="36" fill="#e43b2f" font-size="14" font-weight="700" letter-spacing="2">05 / RELEASE</text><text x="1104" y="74" fill="#151719" font-size="24" font-weight="800">READY TO SHIP</text><text x="1104" y="105" fill="#55595c" font-size="15">version / rollback / owner</text><text x="1104" y="412" fill="#777b7e" font-size="13">LOCKED UNTIL STEP 04 EXISTS</text>
    </g>
    <path d="M751 598V720H660" fill="none" stroke="#e43b2f" stroke-width="6"/>
    <g transform="translate(76 826)"><rect y="-54" width="602" height="76" fill="#e43b2f"/><text x="24" y="-19" fill="#151719" font-size="17" font-weight="800">LABEL THE GAP / partial · unverified · blocked</text><text x="24" y="7" fill="#fff8ed" font-size="14">Preserve the error, scope, state, and last checkpoint.</text><rect x="622" y="-54" width="826" height="76" fill="#24272a" stroke="#e43b2f"/><text x="646" y="-19" fill="#e43b2f" font-size="17" font-weight="800">RECOVER / run one safe check — or stop clearly</text><text x="646" y="7" fill="#b8b6b0" font-size="14">Change one condition only; retry when authority and state permit.</text></g>
    <text x="1524" y="860" text-anchor="end" fill="#74787b" font-size="14">PRYSAI LAB / CLAIM-SCOPED TEACHING MODEL</text>
  </g>
</svg>
