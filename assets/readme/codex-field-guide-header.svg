<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
  <title id="title">Codex: From First Task to Real Work</title>
  <desc id="desc">A hard-edged red and black editorial header. The title sits beside a five-stage rail labelled problem, decision, action, evidence, and transfer.</desc>
  <rect width="1600" height="480" fill="#11151a"/>
  <path d="M0 120H1600M0 390H1600M1040 0V480" fill="none" stroke="#f3f0e9" stroke-opacity=".18"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="72" y="52" width="18" height="18" fill="#e12b2f"/>
    <text x="108" y="68" fill="#f3f0e9" font-size="18" font-weight="700" letter-spacing="4">PRYSAI LAB / FIELD GUIDE 001</text>
    <text x="72" y="230" fill="#f3f0e9" font-size="118" font-weight="800" letter-spacing="-6">CODEX</text>
    <text x="78" y="284" fill="#f3f0e9" font-size="30" font-weight="700" letter-spacing="8">FROM FIRST TASK TO REAL WORK</text>
    <text x="78" y="338" fill="#c7cbcf" font-size="20">A practical system for models, tools, Skills, Agents, and evidence.</text>

    <text x="72" y="423" fill="#e12b2f" font-size="15" font-weight="700" letter-spacing="2">READ THE BOUNDARY</text>
    <line x1="296" y1="418" x2="720" y2="418" stroke="#f3f0e9" stroke-width="2"/>
    <text x="920" y="423" fill="#f3f0e9" font-size="15" font-weight="700" text-anchor="end" letter-spacing="2">KEEP THE PROOF</text>

    <text x="1080" y="64" fill="#f3f0e9" font-size="15" font-weight="700" letter-spacing="2">ONE READING PATH / FIVE CHECKPOINTS</text>
    <line x1="1080" y1="132" x2="1080" y2="354" stroke="#f3f0e9" stroke-width="3"/>
    <rect x="1067" y="124" width="27" height="27" fill="#e12b2f"/>
    <rect x="1067" y="178" width="27" height="27" fill="#e12b2f"/>
    <rect x="1067" y="232" width="27" height="27" fill="#e12b2f"/>
    <rect x="1067" y="286" width="27" height="27" fill="#e12b2f"/>
    <rect x="1067" y="340" width="27" height="27" fill="#f3f0e9"/>

    <text x="1124" y="146" fill="#f3f0e9" font-size="25" font-weight="700">PROBLEM</text>
    <text x="1472" y="146" fill="#aeb4ba" font-size="15" text-anchor="end">name the real job</text>
    <text x="1124" y="200" fill="#f3f0e9" font-size="25" font-weight="700">DECISION</text>
    <text x="1472" y="200" fill="#aeb4ba" font-size="15" text-anchor="end">fix scope and authority</text>
    <text x="1124" y="254" fill="#f3f0e9" font-size="25" font-weight="700">ACTION</text>
    <text x="1472" y="254" fill="#aeb4ba" font-size="15" text-anchor="end">make the bounded change</text>
    <text x="1124" y="308" fill="#f3f0e9" font-size="25" font-weight="700">EVIDENCE</text>
    <text x="1472" y="308" fill="#aeb4ba" font-size="15" text-anchor="end">check the exact claim</text>
    <text x="1124" y="362" fill="#f3f0e9" font-size="25" font-weight="700">TRANSFER</text>
    <text x="1472" y="362" fill="#e12b2f" font-size="15" font-weight="700" text-anchor="end">test a changed context</text>
  </g>
</svg>
