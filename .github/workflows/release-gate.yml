name: Prysai LLM Playbook release gate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Exact reviewed commit SHA to evaluate for a formal release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  enforce-release-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3

      - name: Set up Node.js for browser checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install pinned browser test dependency
        run: npm ci

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Run formal release gate
        env:
          RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/.work/release-evidence
          RELEASE_EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/build_release_evidence.py
          --output-dir "$RELEASE_EVIDENCE_DIR"
          --candidate-sha "${{ inputs.candidate_sha }}"
          --repository "$GITHUB_REPOSITORY"
          --workflow-run-url "$RELEASE_EVIDENCE_RUN_URL"

      - name: Upload release evidence packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ inputs.candidate_sha }}
          path: ${{ github.workspace }}/.work/release-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Publish release evidence summary
        if: always()
        env:
          RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/.work/release-evidence
        run: |
          if [ -f "$RELEASE_EVIDENCE_DIR/release-evidence.md" ]; then
            cat "$RELEASE_EVIDENCE_DIR/release-evidence.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Release evidence unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "The formal gate did not create a packet; inspect the preceding steps." >> "$GITHUB_STEP_SUMMARY"
          fi
