name: Build and publish Prysai LLM Playbook site

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**"
      - "site/**"
      - "skills/**"
      - "assets/**"
      - "examples/**"
      - "evals/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "scripts/build_*.py"
      - "scripts/validate_*.py"
      - "README*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building (requires Pages to be enabled for this repository)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Builds the bounded site artifact on every content push; deploys to
    # GitHub Pages when Pages is enabled for the repository (public
    # repositories on the free plan support it). The build job stays
    # green even when Pages is not yet enabled, so deployment is opt-in.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up GitHub Pages
        if: ${{ (inputs.deploy || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build the bounded Pages artifact
        run: python scripts/build_pages_artifact.py --output _site

      - name: Detect Hugging Face publication configuration
        id: huggingface-sync
        if: ${{ (inputs.deploy || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -n "$HF_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "huggingface_sync=enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "huggingface_sync=not_configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Add a fine-grained Hugging Face write token as the HF_TOKEN repository secret to enable publication." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up uv for Hugging Face publication
        if: steps.huggingface-sync.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # This workflow has no uv lockfile or requirements file to cache.
          enable-cache: false

      - name: Sync the built site to Hugging Face
        if: steps.huggingface-sync.outputs.enabled == 'true'
        shell: bash
        env:
          HF_REPO_ID: Prysai/Prysai-LLM-Playbook
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO_TYPE: space
          SPACE_SDK: static
          SUBDIRECTORY: _site
        run: |
          set -euo pipefail
          test -n "$HF_TOKEN"
          test -d "$SUBDIRECTORY"
          uvx hf repo create "$HF_REPO_ID" --repo-type "$REPO_TYPE" --exist-ok --space-sdk "$SPACE_SDK"
          uvx hf upload "$HF_REPO_ID" "$SUBDIRECTORY" \
            --repo-type "$REPO_TYPE" \
            --exclude='.git*' \
            --exclude='.github*' \
            --delete='*' \
            --commit-message='Sync from GitHub via Pages workflow'

      - name: Record deployment boundary
        shell: bash
        env:
          DEPLOY_INPUT: ${{ inputs.deploy }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          if [[ ( "$DEPLOY_INPUT" = "true" || "$EVENT_NAME" = "push" ) && "$REF_NAME" = "refs/heads/main" ]]; then
            echo "deployment_status=requested" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "deployment_status=not_deployed" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "This successful job builds a review artifact only; it does not publish GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded site artifact for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-candidate-${{ github.sha }}
          path: _site
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Archive Pages deployment artifact
        if: ${{ (inputs.deploy || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
        shell: bash
        run: tar --dereference --hard-dereference --directory _site -cvf "$RUNNER_TEMP/artifact.tar" --exclude=.git --exclude=.github .

      - name: Upload Pages deployment artifact
        if: ${{ (inputs.deploy || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    if: ${{ (inputs.deploy || github.event_name == 'push') && github.ref == 'refs/heads/main' }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  docs-prysai-deploy:
    needs: build
    if: ${{ (github.event_name == 'push' || inputs.deploy) && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs-prysai-production
      url: https://docs.prysai.com/llm-playbook/
    permissions:
      actions: read
    concurrency:
      group: docs-prysai-production
      cancel-in-progress: false
    steps:
      - name: Download the validated Pages artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-candidate-${{ github.sha }}
          path: _site
          github-token: ${{ github.token }}

      - name: Configure the restricted deployment key
        env:
          DOCS_DEPLOY_SSH_KEY: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$DOCS_DEPLOY_SSH_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DOCS_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' 'docs.prysai.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHupie01tDV2nKK5N74smhAjkkugyKj3bG4qTk5WY0le' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Publish atomically to Docs
        run: >-
          tar --create --directory=_site --file=- . |
          ssh -i "$HOME/.ssh/id_ed25519"
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          prysai-docs-deploy@docs.prysai.com
