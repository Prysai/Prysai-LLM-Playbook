name: Build and publish Prysai LLM Playbook site

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/governance/**"
      - "site/**"
      - "skills/**"
      - "scripts/build_*.py"
      - "scripts/validate_*.py"
      - "README*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building (requires Pages to be enabled for this repository)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Builds the bounded site artifact on every content push; deploys to
    # GitHub Pages when Pages is enabled for the repository (public
    # repositories on the free plan support it). The build job stays
    # green even when Pages is not yet enabled, so deployment is opt-in.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up GitHub Pages
        if: ${{ inputs.deploy || github.event_name == 'push' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build the bounded Pages artifact
        run: python scripts/build_pages_artifact.py --output _site

      - name: Record deployment boundary
        shell: bash
        run: |
          if [ "${{ inputs.deploy }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "deployment_status=requested" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "deployment_status=not_deployed" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "This successful job builds a review artifact only; it does not publish GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded site artifact for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-candidate-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages deployment artifact
        if: ${{ inputs.deploy || github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ inputs.deploy || github.event_name == 'push' }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
