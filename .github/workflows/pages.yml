name: Build the Field Guide Pages candidate artifact

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building (requires Pages to be enabled for this repository)"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # This private repository's current GitHub plan does not support Pages.
    # Keep the workflow available for an explicit run after the repository is
    # public or the account plan changes, instead of failing every main push.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up GitHub Pages
        if: inputs.deploy
        uses: actions/configure-pages@v5

      - name: Build the bounded Pages artifact
        run: python scripts/build_pages_artifact.py --output _site

      - name: Record deployment boundary
        shell: bash
        run: |
          if [ "${{ inputs.deploy }}" = "true" ]; then
            echo "deployment_status=requested" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "deployment_status=not_deployed" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "This successful job builds a review artifact only; it does not publish GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded site artifact for review
        uses: actions/upload-artifact@v7
        with:
          name: pages-candidate-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages deployment artifact
        if: inputs.deploy
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: inputs.deploy
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
