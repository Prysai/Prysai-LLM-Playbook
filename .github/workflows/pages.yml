name: Build and publish Prysai LLM Playbook site

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "docs/**"
      - "site/**"
      - "skills/**"
      - "assets/**"
      - "examples/**"
      - "evals/**"
      - "AGENTS.md"
      - "CONTEXT.md"
      - "scripts/build_*.py"
      - "scripts/validate_*.py"
      - "README*.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after building (requires Pages to be enabled for this repository)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Builds the bounded site artifact on every content push; deploys to
    # GitHub Pages when Pages is enabled for the repository (public
    # repositories on the free plan support it). The build job stays
    # green even when Pages is not yet enabled, so deployment is opt-in.
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Set up GitHub Pages
        if: ${{ inputs.deploy || github.event_name == 'push' }}
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Build the bounded Pages artifact
        run: python scripts/build_pages_artifact.py --output _site

      - name: Detect Hugging Face publication configuration
        id: huggingface-sync
        if: ${{ inputs.deploy || github.event_name == 'push' }}
        shell: bash
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [[ -n "$HF_TOKEN" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "huggingface_sync=enabled" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "huggingface_sync=not_configured" >> "$GITHUB_STEP_SUMMARY"
            echo "Add a fine-grained Hugging Face write token as the HF_TOKEN repository secret to enable publication." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Sync the built site to Hugging Face
        if: steps.huggingface-sync.outputs.enabled == 'true'
        uses: huggingface/hub-sync@6fbce0a787a7146710e588abe7a4fd5eca07f47c # v0.1.0
        with:
          github_repo_id: ${{ github.repository }}
          huggingface_repo_id: Prysai/Prysai-LLM-Playbook
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: space
          space_sdk: static
          subdirectory: _site

      - name: Record deployment boundary
        shell: bash
        run: |
          if [ "${{ inputs.deploy }}" = "true" ] || [ "${{ github.event_name }}" = "push" ]; then
            echo "deployment_status=requested" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "deployment_status=not_deployed" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "This successful job builds a review artifact only; it does not publish GitHub Pages." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload bounded site artifact for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-candidate-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 14

      - name: Upload Pages deployment artifact
        if: ${{ inputs.deploy || github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ inputs.deploy || github.event_name == 'push' }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  docs-prysai-deploy:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.deploy }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs-prysai-production
      url: https://docs.prysai.com/llm-playbook/
    permissions:
      contents: read
    concurrency:
      group: docs-prysai-production
      cancel-in-progress: false
    steps:
      - name: Check out the reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build the bounded deployment artifact
        run: python scripts/build_pages_artifact.py --output _site

      - name: Configure the restricted deployment key
        env:
          DOCS_DEPLOY_SSH_KEY: ${{ secrets.DOCS_DEPLOY_SSH_KEY }}
        run: |
          test -n "$DOCS_DEPLOY_SSH_KEY"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DOCS_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' 'docs.prysai.com ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHupie01tDV2nKK5N74smhAjkkugyKj3bG4qTk5WY0le' > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Publish atomically to Docs
        run: >-
          tar --create --directory=_site --file=- . |
          ssh -i "$HOME/.ssh/id_ed25519"
          -o BatchMode=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          prysai-docs-deploy@docs.prysai.com
