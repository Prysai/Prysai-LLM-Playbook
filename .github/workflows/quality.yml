name: Codex From First Task to Real Work quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure-and-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate project structure
        run: python scripts/validate_project.py

      - name: Validate canonical directory map
        run: python scripts/validate_project_structure.py

      - name: Validate volatile fact impact registry
        run: python scripts/validate_fact_impact_registry.py

      - name: Check local Markdown links
        run: python scripts/check_local_links.py

      - name: Validate Codex Skills
        run: python scripts/validate_skills.py

      - name: Validate evaluation fixtures
        run: python scripts/validate_eval_tasks.py

      - name: Validate learning contract
        run: python scripts/validate_learning_contract.py

      - name: Validate learning path
        run: python scripts/validate_learning_path.py

      - name: Check generated learning-path data
        run: python scripts/build_learning_path_site.py --check

      - name: Validate update registry
        run: python scripts/validate_update_registry.py

      - name: Validate current content status
        run: python scripts/validate_content_status.py

      - name: Validate locale matrix and same-language links
        run: python scripts/validate_localization.py

      - name: Validate public page language contract
        run: python scripts/validate_site_i18n.py
