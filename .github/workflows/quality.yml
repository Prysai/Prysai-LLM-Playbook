name: Prysai LLM Playbook quality

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    # A PR that changes only an original fictional contribution uses the
    # bounded fast workflow below. Any other touched path still runs this full
    # release-evidence matrix.
    paths-ignore:
      - "evals/contributions/**"

permissions:
  contents: read

jobs:
  candidate-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pull requests are untrusted; the read-only token does not need to remain in Git config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all: PyYAML==6.0.3

      - name: Set up Node.js for browser checks
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.19.0"
          cache: npm

      - name: Install pinned browser test dependency
        run: npm ci

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Run unified regression suite
        run: python scripts/run_tests.py

      - name: Validate release evidence contract
        run: python scripts/build_release_evidence.py --check

      - name: Run gates and build commit-bound release evidence
        id: release_evidence
        continue-on-error: true
        env:
          RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/.work/release-evidence
          RELEASE_EVIDENCE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          python scripts/build_release_evidence.py
          --output-dir "$RELEASE_EVIDENCE_DIR"
          --candidate-sha "$GITHUB_SHA"
          --repository "$GITHUB_REPOSITORY"
          --workflow-run-url "$RELEASE_EVIDENCE_RUN_URL"

      - name: Upload release evidence packet
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence-${{ github.sha }}
          path: ${{ github.workspace }}/.work/release-evidence
          if-no-files-found: error
          retention-days: 30

      - name: Upload browser failure evidence
        if: steps.release_evidence.outcome != 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-smoke-failure-${{ github.sha }}
          path: ${{ github.workspace }}/.work/browser-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Publish release evidence summary
        if: always()
        env:
          RELEASE_EVIDENCE_DIR: ${{ github.workspace }}/.work/release-evidence
        run: |
          if [ -f "$RELEASE_EVIDENCE_DIR/release-evidence.md" ]; then
            cat "$RELEASE_EVIDENCE_DIR/release-evidence.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "# Release evidence unavailable" >> "$GITHUB_STEP_SUMMARY"
            echo "The packet was not generated; inspect the preceding steps." >> "$GITHUB_STEP_SUMMARY"
          fi
