name: Field Guide quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  structure-and-skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate project structure
        run: python scripts/validate_project.py

      - name: Check local Markdown links
        run: python scripts/check_local_links.py

      - name: Validate Field Guide Skills
        run: python scripts/validate_skills.py

      - name: Validate evaluation fixtures
        run: python scripts/validate_eval_tasks.py
